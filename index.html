<style data-purpose="custom-styles">
        body {
            background-color: #000; /* For mobile device feel outside safe area */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            min-height: 100dvh;
            max-width: 430px; /* Max width for mobile feel */
            position: relative;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        /* Auth users: the feed scrolls freely (no scroll limits) */
        body.is-auth #app-container {
            overflow-y: auto;
            max-height: none;
        }
        /* Guests: keep the phone-frame feel */
        body.is-guest #app-container {
            overflow: hidden;
            height: 100dvh;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            padding: 20px;
        }

        /* Custom Font for Logo (Approximation) */
        .brand-logo {
            font-family: 'Arial Black', Gadget, sans-serif;
            background: -webkit-linear-gradient(#ff6b6b, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        .bottom-nav-bg {
            background: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item-active {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }

        /* ---- Guest-mode overrides ---- */
        /* Blur + disable the bottom nav for signed-out visitors */
        body.is-guest .guest-blur {
            filter: blur(7px) saturate(0.6);
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            opacity: 0.55;
        }
        /* Right-side controls swap */
        body.is-guest #auth-controls { display: none; }
        body.is-auth #guest-cta { display: none; }
        body.is-guest #guest-cta { display: flex; }
        body.is-auth #auth-controls { display: flex; }
    </style>
</head>

<script>
  (function () {
    // Same Supabase project as auth.html (anon key is safe to ship to browsers).
    var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';

    function applyMode(isAuth) {
      document.body.classList.toggle('is-auth', isAuth);
      document.body.classList.toggle('is-guest', !isAuth);
      // The blurred guest nav must never navigate; swap back to live links for auth users.
      var nav = document.querySelector('nav.guest-blur');
      if (!nav) return;
      nav.querySelectorAll('a').forEach(function (a) {
        if (isAuth) {
          a.removeAttribute('aria-disabled');
          a.removeAttribute('tabindex');
          a.classList.add('cursor-pointer', 'hover:opacity-100');
          a.classList.remove('opacity-60', 'opacity-70');
          if (a.getAttribute('title') === 'Feed') {
            a.classList.add('bg-[#3A3A3A]');
          }
        } else {
          a.setAttribute('aria-disabled', 'true');
          a.setAttribute('tabindex', '-1');
          a.classList.remove('cursor-pointer');
          if (a.getAttribute('title') === 'Feed') {
            a.classList.remove('bg-[#3A3A3A]');
          }
        }
      });
    }

    // Single delegated guard: blocks nav clicks only while the guest mode is active.
    // Attached once, so switching guest ↔ auth on the same page never leaks handlers
    // and never leaves a stale preventDefault behind.
    document.addEventListener('click', function (e) {
      var link = e.target.closest ? e.target.closest('nav.guest-blur a') : null;
      if (link && document.body.classList.contains('is-guest')) {
        e.preventDefault();
        e.stopPropagation();
      }
    });

    var supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      supabase = null;
    }

    // Optional demo override for testing both versions without a real session:
    //   index.html?demo=auth   → force the authenticated layout
    //   index.html?demo=guest  → force the guest layout
    var demoMode = new URLSearchParams(window.location.search).get('demo');
    var savedDemo = localStorage.getItem('yours_demo_mode');

    function resolveMode() {
      // A real signed-in session always wins over any demo/test override.
      if (supabase) {
        supabase.auth.getSession().then(function (res) {
          var hasSession = !!(res.data && res.data.session);
          if (hasSession) {
            localStorage.removeItem('yours_demo_mode');
            applyMode(true);
          } else if (demoMode === 'auth') {
            applyMode(true);
          } else if (demoMode === 'guest') {
            applyMode(false);
          } else if (savedDemo === 'auth') {
            applyMode(true);
          } else {
            applyMode(false);
          }
        }).catch(function () {
          // If the session lookup fails, fall back to the demo override or guest.
          if (demoMode === 'auth' || savedDemo === 'auth') applyMode(true);
          else applyMode(false);
        });
        supabase.auth.onAuthStateChange(function (event) {
          if (event === 'SIGNED_IN') {
            localStorage.removeItem('yours_demo_mode');
            applyMode(true);
          } else if (event === 'SIGNED_OUT') {
            applyMode(false);
          }
        });
      } else if (demoMode === 'auth' || demoMode === 'guest') {
        applyMode(demoMode === 'auth');
        localStorage.setItem('yours_demo_mode', demoMode);
      } else if (savedDemo === 'auth' || savedDemo === 'guest') {
        applyMode(savedDemo === 'auth');
      } else {
        applyMode(false);
      }
    }

    resolveMode();
  })();
</script>
