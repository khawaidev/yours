<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Design your perfect AI companion on Yours. Choose a style and start creating today.">
<title>Create Your Perfect AI Companion | Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
<link rel="stylesheet" href="css/desktop.css">
<style>
  /* ---------- Gender segmented control ---------- */
  .segmented {
    position: relative;
    display: inline-flex; align-items: stretch;
    padding: 4px; gap: 2px;
    width: min(420px, 100%);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    margin-top: 26px;
  }
  .segmented .seg-indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc((100% - 12px) / 3);
    border-radius: 999px;
    background: var(--ds-surface-3);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), left .3s ease;
    will-change: transform;
  }
  .segmented button {
    position: relative; z-index: 1;
    flex: 1; height: 40px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; background: transparent; border-radius: 999px;
    color: var(--ds-muted); font-size: 13.5px; font-weight: 700;
    transition: color .2s ease;
  }
  .segmented button[aria-selected="true"] { color: var(--ds-text); }
  .segmented button:hover:not([aria-selected="true"]) { color: rgba(255,255,255,.85); }

  /* ---------- Style cards ---------- */
  .styles {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px;
    width: min(640px, 100%);
    margin: 28px auto 0;
  }
  .style-card {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: var(--ds-radius);
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.10);
    background: var(--ds-surface);
    padding: 0;
    text-align: center;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .style-card:hover { transform: scale(1.01); }
  .style-card img.style-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: top;
  }
  .style-card .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.08) 42%, transparent 60%);
  }
  .style-card .fallback-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; color: rgba(255, 255, 255, 0.16);
  }
  .style-card .label {
    position: absolute; inset-inline: 0; bottom: 16px;
    font-size: 21px; font-weight: 800; letter-spacing: 0.04em;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  }
  .style-card .check {
    position: absolute; top: 12px; right: 12px;
    display: none; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--ds-accent); color: #fff; font-size: 13px;
  }
  .style-card.selected { border-color: var(--ds-accent); box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.22); }
  .style-card.selected .check { display: inline-flex; }

  .hero-note { margin-top: 18px; font-size: 12.5px; color: rgba(255, 255, 255, 0.4); }
  .hero-note a { text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 767px) {
    .styles { gap: 12px; }
  }
</style>
</head>
<body class="ds-page" data-active-nav="create" data-topbar-title="Create">

<div class="ds-layout">
  <div id="ds-sidebar"></div>

  <div class="ds-content-col">
    <div id="ds-topbar"></div>

    <main class="ds-main">
      <!-- ================= CREATE STAGE 1 / STYLE ================= -->
      <section class="cc-wrap" aria-label="Create your companion">
        <div class="cc-progress" role="progressbar" aria-valuenow="17" aria-valuemin="0" aria-valuemax="100" aria-label="Creation progress">
          <div class="cc-progress-fill" style="width: 16.66%"></div>
        </div>

        <h1 class="cc-title">Design Your <span class="brand-word" id="brand-word">Dream AI Girl</span></h1>

        <div class="segmented" role="tablist" aria-label="Choose gender" id="gender-tabs">
          <span class="seg-indicator" aria-hidden="true"></span>
          <button role="tab" aria-selected="true" data-gender="Female" data-word="Dream AI Girl"><i class="fa-solid fa-venus" aria-hidden="true"></i>Female</button>
          <button role="tab" aria-selected="false" data-gender="Male" data-word="Dream AI Guy"><i class="fa-solid fa-mars" aria-hidden="true"></i>Male</button>
          <button role="tab" aria-selected="false" data-gender="Trans" data-word="Dream AI Partner"><i class="fa-solid fa-transgender" aria-hidden="true"></i>Trans</button>
        </div>

        <div class="styles" role="radiogroup" aria-label="Choose style">
          <button type="button" class="style-card selected" data-style="realistic" aria-label="Realistic style">
            <img class="style-img" alt="" data-slot="realistic">
            <span class="fallback-icon" aria-hidden="true"><i class="fa-solid fa-image"></i></span>
            <span class="scrim" aria-hidden="true"></span>
            <span class="label">Realistic</span>
            <span class="check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
          </button>
          <button type="button" class="style-card" data-style="anime" aria-label="Anime style">
            <img class="style-img" alt="" data-slot="anime">
            <span class="fallback-icon" aria-hidden="true"><i class="fa-solid fa-image"></i></span>
            <span class="scrim" aria-hidden="true"></span>
            <span class="label">Anime</span>
            <span class="check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
          </button>
        </div>

        <div class="cc-nav">
          <button type="button" class="cc-continue" id="continue-btn">
            Continue to design<i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
        <p class="hero-note">By continuing you confirm you are 18+ and accept our <a href="terms.html">Terms</a>.</p>
      </section>
    </main>

    <footer id="ds-footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api-client.js"></script>
<script src="js/desktop-ui.js"></script>
<script src="js/create-funnel.js"></script>
<script>
(function () {
  'use strict';

  var prefs = window.YoursCreate.prefs();
  var state = { gender: prefs.gender || 'Female', style: prefs.style || 'realistic' };
  var tabs = document.getElementById('gender-tabs');
  var indicator = tabs.querySelector('.seg-indicator');
  var brandWord = document.getElementById('brand-word');

  function moveIndicator(btn) {
    indicator.style.left = btn.offsetLeft + 'px';
    indicator.style.width = btn.offsetWidth + 'px';
  }

  function selectGender(btn) {
    state.gender = btn.getAttribute('data-gender');
    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    moveIndicator(btn);
    brandWord.textContent = btn.getAttribute('data-word');
  }

  tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('button[role="tab"]');
    if (btn) selectGender(btn);
  });

  function selectStyle(card) {
    state.style = card.getAttribute('data-style');
    document.querySelectorAll('.style-card').forEach(function (c) {
      c.classList.toggle('selected', c === card);
    });
  }
  document.querySelectorAll('.style-card').forEach(function (card) {
    card.addEventListener('click', function () { selectStyle(card); });
  });

  // Restore saved choices.
  var savedTab = tabs.querySelector('button[data-gender="' + state.gender + '"]');
  if (savedTab && savedTab.getAttribute('aria-selected') !== 'true') selectGender(savedTab);
  var savedCard = document.querySelector('.style-card[data-style="' + state.style + '"]');
  if (savedCard && !savedCard.classList.contains('selected')) selectStyle(savedCard);

  // ---- Continue to stage 2 ----
  document.getElementById('continue-btn').addEventListener('click', function () {
    YoursCreate.save(state);
    var user = window.YoursAPI ? YoursAPI.getCurrentUser() : null;
    try { if (user && YoursAPI.trackEvent) YoursAPI.trackEvent('desktop_create_stage1', state, user.id); } catch (e) {}
    window.location.href = 'desktop-create-stage2.html';
  });

  // ---- Live imagery for the style cards ----
  function fillCard(slotName, list) {
    var img = document.querySelector('.style-card[data-style="' + slotName + '"] .style-img');
    if (!img) return;
    for (var i = 0; i < list.length; i++) {
      var url = window.YoursDesktop.cardImage(list[i]);
      if (url && !/\.mp4($|\?)/i.test(url)) {
        img.addEventListener('load', function () {
          this.parentNode.classList.add('has-img');
          var icon = this.parentNode.querySelector('.fallback-icon');
          if (icon) icon.remove();
        }, { once: true });
        img.src = url;
        return;
      }
    }
  }

  YoursDesktop.loadCharacters()
    .then(function (chars) {
      var realistic = chars.filter(function (c) { return c.art_style === 'realistic'; });
      var anime = chars.filter(function (c) { return c.art_style === 'anime'; });
      fillCard('realistic', realistic.length ? realistic : chars);
      fillCard('anime', anime.length ? anime : chars);
    })
    .catch(function () { /* gradient fallback stays */ });

  window.addEventListener('resize', function () {
    var active = tabs.querySelector('button[aria-selected="true"]');
    if (active) moveIndicator(active);
  });

  // Init after layout settles so the indicator measures correctly.
  requestAnimationFrame(function () {
    moveIndicator(tabs.querySelector('button[aria-selected="true"]'));
  });
})();
</script>
</body>
</html>
