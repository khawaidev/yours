<script>
  document.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('age-list');
    const MIN_AGE = 18;
    const MAX_AGE = 90;

    // Build the full scrollable age range
    for (let age = MIN_AGE; age <= MAX_AGE; age++) {
      const item = document.createElement('div');
      item.className = 'age-item';
      item.dataset.age = age;
      item.textContent = age;
      list.appendChild(item);
    }

    // Highlight the item that is snapped to the center of the list
    const updateSelection = () => {
      const listRect = list.getBoundingClientRect();
      const centerY = listRect.top + listRect.height / 2;
      let selected = null;
      list.querySelectorAll('.age-item').forEach((item) => {
        const rect = item.getBoundingClientRect();
        const itemCenter = rect.top + rect.height / 2;
        if (Math.abs(itemCenter - centerY) < rect.height / 2) selected = item;
        item.classList.remove('selected');
      });
      if (selected) {
        selected.classList.add('selected');
        window.selectedAge = Number(selected.dataset.age);
      }
    };

    list.addEventListener('scroll', updateSelection, { passive: true });

    // Start scrolled to the default age (26) so the list is obviously scrollable
    const defaultItem = list.querySelector('[data-age="26"]');
    if (defaultItem) {
      defaultItem.scrollIntoView({ block: 'center' });
      requestAnimationFrame(updateSelection);
    } else {
      updateSelection();
    }
  });
</script>

    try {
