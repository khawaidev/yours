<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Create Your Companion - Body | Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body class="ds-page" data-active-nav="create" data-topbar-title="Create">

<div class="ds-layout">
  <div id="ds-sidebar"></div>

  <div class="ds-content-col">
    <div id="ds-topbar"></div>

    <main class="ds-main">
      <!-- ================= CREATE STAGE 4 / BODY ================= -->
      <section class="cc-wrap" aria-label="Body preferences">
        <div class="cc-progress" role="progressbar" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100" aria-label="Creation progress">
          <div class="cc-progress-fill" style="width: 66.66%"></div>
        </div>

        <h1 class="cc-title">Sculpt Her <span class="brand-word">Body</span></h1>

        <div class="cc-group">
          <p class="cc-group-title">BODY TYPE</p>
          <div class="option-card-grid cols-5" role="radiogroup" aria-label="Body Type" data-group="body_type">
            <button type="button" class="option-card" data-value="Slim"><i class="fa-solid fa-person" aria-hidden="true"></i><span>Slim</span></button>
            <button type="button" class="option-card" data-value="Athletic"><i class="fa-solid fa-person-running" aria-hidden="true"></i><span>Athletic</span></button>
            <button type="button" class="option-card" data-value="Curvy"><i class="fa-solid fa-heart" aria-hidden="true"></i><span>Curvy</span></button>
            <button type="button" class="option-card" data-value="Voluptuous"><i class="fa-solid fa-fire" aria-hidden="true"></i><span>Voluptuous</span></button>
            <button type="button" class="option-card" data-value="Muscular"><i class="fa-solid fa-dumbbell" aria-hidden="true"></i><span>Muscular</span></button>
          </div>
        </div>
        <div class="cc-group">
          <p class="cc-group-title">BUST</p>
          <div class="option-card-grid cols-4" role="radiogroup" aria-label="Bust" data-group="bust">
            <button type="button" class="option-card" data-value="Flat"><i class="fa-regular fa-circle" aria-hidden="true"></i><span>Flat</span></button>
            <button type="button" class="option-card" data-value="Small"><i class="fa-solid fa-circle" style="font-size:14px" aria-hidden="true"></i><span>Small</span></button>
            <button type="button" class="option-card" data-value="Medium"><i class="fa-solid fa-circle" style="font-size:18px" aria-hidden="true"></i><span>Medium</span></button>
            <button type="button" class="option-card" data-value="Large"><i class="fa-solid fa-circle" style="font-size:22px" aria-hidden="true"></i><span>Large</span></button>
          </div>
        </div>
        <div class="cc-group">
          <p class="cc-group-title">BUTT</p>
          <div class="option-card-grid cols-3" role="radiogroup" aria-label="Butt" data-group="butt">
            <button type="button" class="option-card" data-value="Small"><i class="fa-solid fa-circle" style="font-size:14px" aria-hidden="true"></i><span>Small</span></button>
            <button type="button" class="option-card" data-value="Medium"><i class="fa-solid fa-circle" style="font-size:18px" aria-hidden="true"></i><span>Medium</span></button>
            <button type="button" class="option-card" data-value="Large"><i class="fa-solid fa-circle" style="font-size:22px" aria-hidden="true"></i><span>Large</span></button>
          </div>
        </div>

        <div class="cc-nav">
          <a class="cc-back" href="desktop-create-stage3.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back</a>
          <button type="button" class="cc-continue" id="continue-btn">Continue<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </div>
      </section>
    </main>

    <footer id="ds-footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api-client.js"></script>
<script src="js/desktop-ui.js"></script>
<script src="js/create-funnel.js"></script>
<script>
(function () {
  'use strict';

  YoursCreate.bindChipGroups();

  document.getElementById('continue-btn').addEventListener('click', function () {
    YoursCreate.save(YoursCreate.collectGroups());
    var user = window.YoursAPI ? YoursAPI.getCurrentUser() : null;
    try { if (user && YoursAPI.trackEvent) YoursAPI.trackEvent('desktop_create_stage4', YoursCreate.prefs(), user.id); } catch (e) {}
    window.location.href = 'desktop-create-stage5.html';
  });
})();
</script>
</body>
</html>
