<script>
(function () {
  var STORAGE_KEY = 'yours_language';

  // Map the language display names to Google Translate language codes.
  var rows = document.querySelectorAll('.lang-row');

  // Read the chosen language from session storage so a refresh keeps it.
  function storedLang() {
    try { return sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function storeLang(lang, code) {
    try {
      sessionStorage.setItem(STORAGE_KEY, lang);
      sessionStorage.setItem('yours_language_code', code || 'en');
    } catch (e) {}
  }

  // Apply a translation via the Google Translate widget select. The widget is
  // hidden, we just trigger the same <select> the toolbar uses.
  function applyTranslate(code) {
    try {
      var sel = document.querySelector('.goog-te-combo');
      if (!sel) return false;
      sel.value = code;
      sel.dispatchEvent(new Event('change'));
      return true;
    } catch (e) { return false; }
  }

  // Mark the given language row (matching stored "lang" name) as active.
  function selectRow(lang) {
    for (var i = 0; i < rows.length; i++) {
      var active = rows[i].getAttribute('data-lang') === lang;
      rows[i].classList.toggle('active', active);
      if (active) {
        storeLang(lang, rows[i].getAttribute('data-code'));
        applyTranslate(rows[i].getAttribute('data-code'));
      }
    }
  }

  // On load: restore the saved language (session storage) before the widget
  // is ready, then apply again once Google Translate finishes initialising.
  var saved = storedLang();
  if (saved) selectRow(saved);
  var savedCode = null;
  try { savedCode = sessionStorage.getItem('yours_language_code') || null; } catch (e) {}

  // Wait for Google Translate to be fully ready (it replaces the <body> once),
  // then re-apply the saved language so a reload actually keeps it.
  var attempts = 0;
  var restoreTimer = setInterval(function () {
    attempts++;
    var code = savedCode || '';
    if (!code && saved) {
      for (var r = 0; r < rows.length; r++) {
        if (rows[r].getAttribute('data-lang') === saved) { code = rows[r].getAttribute('data-code'); break; }
      }
    }
    if (code && applyTranslate(code)) clearInterval(restoreTimer);
    else if (attempts > 60) clearInterval(restoreTimer);
  }, 500);

  for (var i = 0; i < rows.length; i++) {
    (function (row) {
      row.addEventListener('click', function () {
        var lang = row.getAttribute('data-lang');
        var code = row.getAttribute('data-code');
        storeLang(lang, code);
        selectRow(lang);
        applyTranslate(code);
      });
    })(rows[i]);
  }
})();
</script>
