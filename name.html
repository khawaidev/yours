<!-- Custom Styles -->
<style data-purpose="custom-animations">
    /* Flashing cursor animation */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1s step-end infinite;
    }
    
    /* Keep the page fixed when the on-screen keyboard opens so the browser
       doesn't pan/zoom into the focused input and break the layout. */
    html {
      overflow: hidden;
    }
    input {
      font-size: 16px; /* iOS zooms into inputs smaller than 16px */
    }
    /* Input styling to hide default cursor and border, and center text */
    input[type="text"] {
      caret-color: transparent; /* Hide default cursor */
    }
    input[type="text"]:focus {
      outline: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="bg-blush-bg text-blush-primary font-sans h-dvh flex flex-col overflow-hidden antialiased app-page">

<button onclick="window.location.href='Age.html'" aria-label="Go back" class="p-2 -ml-2 text-blush-primary focus:outline-none cursor-pointer" data-purpose="back-button">
<svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 18L9 12L15 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</button>
<!-- Progress Bar Container -->
<div class="flex-1 mx-8 flex items-center h-full" data-purpose="progress-container">
<div class="w-full h-1 bg-blush-progress-bg rounded-full overflow-hidden flex">
<!-- Progress Indicator (approx 15%) -->
<div class="h-full bg-blush-accent rounded-full w-[15%]" data-purpose="progress-indicator"></div>
</div>
</div>
<!-- Placeholder for alignment -->
<div class="w-10"></div>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Content Section -->
<main class="flex-1 flex flex-col items-center justify-start px-6 pt-6 relative z-0" data-purpose="main-content">
<!-- Headline -->
<h1 class="text-3xl font-bold tracking-tight text-center mb-auto pt-4" data-purpose="headline">
      What's your name?
    </h1>
<!-- Input Area -->
<div class="flex-1 flex items-center justify-center w-full" data-purpose="input-container">
<div class="relative flex items-center justify-center">
<!-- Custom blinking cursor element -->
<div class="absolute w-[3px] h-[36px] bg-blush-primary rounded-full animate-blink pointer-events-none" id="custom-cursor" style="display: none;"></div>
<input aria-label="Your name" autocomplete="off" autofocus="" class="bg-transparent text-center text-4xl font-semibold text-blush-primary border-none focus:ring-0 w-full min-w-[20px]" id="name-input" placeholder="" type="text">
</div>
</div>
</main>
<!-- END: Main Content Section -->
<!-- BEGIN: Footer Section (Button) -->
<footer class="px-6 pb-10 pt-4 bg-blush-bg" data-purpose="footer-action">
<button id="continue-btn" class="w-full bg-blush-button text-blush-button-text font-bold text-lg py-4 rounded-full active:scale-95 disabled:active:scale-100 transition-transform duration-150 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" data-purpose="continue-button" disabled>
      Continue
    </button>
</footer>
<!-- END: Footer Section (Button) -->
<!-- Minimal JS to handle input interaction (hiding fake cursor on typing for realism) -->
<script data-purpose="input-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('name-input');
      const cursor = document.getElementById('custom-cursor');
      const continueBtn = document.getElementById('continue-btn');

      // Focus input on load for immediate typing
      input.focus();

      // Only letters (a-z, A-Z) and spaces are allowed in the name
      const sanitizeName = (value) => value.replace(/[^a-zA-Z\s]/g, '');

      // Continue stays disabled until the name contains at least one letter
      const updateContinueState = () => {
        continueBtn.disabled = !/[a-zA-Z]/.test(input.value.trim());
      };

      const submitName = () => {
        if (/[a-zA-Z]/.test(input.value.trim())) {
          window.location.href = 'age-interest.html';
        }
      };

      input.addEventListener('input', () => {
        // Strip any non-letter / non-space characters (e.g. from pasted text)
        const sanitized = sanitizeName(input.value);
        if (sanitized !== input.value) {
          input.value = sanitized;
          input.setSelectionRange(input.value.length, input.value.length);
        }
        // Fake cursor visibility
        if (input.value.length > 0) {
          cursor.style.display = 'none';
          input.style.caretColor = '#FFFFFF'; // Show real cursor
        } else {
          cursor.style.display = 'block';
          input.style.caretColor = 'transparent'; // Hide real cursor
        }
        updateContinueState();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !continueBtn.disabled) submitName();
      });

      // Wire up the Continue button (disabled buttons don't fire clicks, so this is safe)
      continueBtn.addEventListener('click', submitName);

      // Ensure focus keeps it blinking if empty
      input.addEventListener('focus', () => {
         if (input.value.length === 0) {
            cursor.style.display = 'block';
         }
      });

      input.addEventListener('blur', () => {
          cursor.style.display = 'none';
      });

      updateContinueState();
    });
  </script>
<script src="js/animations.js"></script>
</body></html>
