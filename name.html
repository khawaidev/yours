<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" name="viewport">
    <meta name="description" content="Tell us your name so your AI companion knows what to call you.">
    <meta name="robots" content="noindex, nofollow">
<title>What's your name? - Onboarding</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<!-- Include Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/onboarding.css">
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Custom Styles -->
<style data-purpose="custom-animations">
    /* Flashing cursor animation */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1s step-end infinite;
    }

    /* Keep the page fixed when the on-screen keyboard opens so the browser
       doesn't pan/zoom into the focused input and break the layout. */
    html {
      overflow: hidden;
    }
    input {
      font-size: 16px; /* iOS zooms into inputs smaller than 16px */
    }
    /* Input styling to hide default cursor and border, and center text */
    input[type="text"] {
      caret-color: transparent; /* Hide default cursor */
    }
    input[type="text"]:focus {
      outline: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="ys-ob-page app-page" style="overflow:hidden;">
<!-- BEGIN: Header Section -->
<header class="ys-ob-header">
<!-- Back Button -->
<button aria-label="Go back" class="ys-ob-back" data-purpose="back-button" onclick="window.location.href='Age.html'" type="button">
<svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 18L9 12L15 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</button>
<!-- Progress Bar Container -->
<div class="ys-ob-progress" data-step="2"><span data-ob-progress></span></div>
<!-- Placeholder for alignment -->
<div class="ys-ob-spacer" aria-hidden="true"></div>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Content Section -->
<main class="ys-ob-main" data-purpose="main-content">
<!-- Headline -->
<div class="ys-ob-title" data-purpose="headline">
<h1>What's your name?</h1>
</div>
<!-- Input Area -->
<div class="flex-1 flex items-center justify-center w-full px-6 pb-6" data-purpose="input-container">
<div class="relative flex items-center justify-center">
<!-- Custom blinking cursor element -->
<div class="absolute w-[3px] h-[36px] bg-white rounded-full animate-blink pointer-events-none" id="custom-cursor" style="display: none;"></div>
<input aria-label="Your name" autocomplete="off" autofocus="" class="bg-transparent text-center text-4xl font-semibold text-white border-none focus:ring-0 w-full min-w-[20px]" id="name-input" placeholder="" type="text">
</div>
</div>
</main>
<!-- END: Main Content Section -->
<!-- BEGIN: Footer Section (Button) -->
<footer class="ys-ob-footer" data-purpose="footer-action">
<button id="continue-btn" class="ys-ob-btn" data-purpose="continue-button" disabled type="button">
      Continue
    </button>
</footer>
<!-- END: Footer Section (Button) -->
<!-- Minimal JS to handle input interaction (hiding fake cursor on typing for realism) -->
<script src="js/onboarding.js"></script>
<script data-purpose="input-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('name-input');
      const cursor = document.getElementById('custom-cursor');
      const continueBtn = document.getElementById('continue-btn');

      // Restore a previously typed name (back/forward navigation).
      const savedName = YSOnboarding.get('name');
      if (savedName) {
        input.value = savedName;
        cursor.style.display = 'none';
        input.style.caretColor = '#FFFFFF';
      }

      // Focus input on load for immediate typing
      input.focus();

      // Only letters (a-z, A-Z) and spaces are allowed in the name
      const sanitizeName = (value) => value.replace(/[^a-zA-Z\s]/g, '');

      // Continue stays disabled until the name contains at least one letter
      const updateContinueState = () => {
        continueBtn.disabled = !/[a-zA-Z]/.test(input.value.trim());
      };

      const submitName = () => {
        if (/[a-zA-Z]/.test(input.value.trim())) {
          YSOnboarding.go('name', input.value.trim(), 'age-interest.html');
        }
      };

      input.addEventListener('input', () => {
        // Strip any non-letter / non-space characters (e.g. from pasted text)
        const sanitized = sanitizeName(input.value);
        if (sanitized !== input.value) {
          input.value = sanitized;
          input.setSelectionRange(input.value.length, input.value.length);
        }
        // Fake cursor visibility
        if (input.value.length > 0) {
          cursor.style.display = 'none';
          input.style.caretColor = '#FFFFFF'; // Show real cursor
        } else {
          cursor.style.display = 'block';
          input.style.caretColor = 'transparent'; // Hide real cursor
        }
        updateContinueState();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !continueBtn.disabled) submitName();
      });

      // Wire up the Continue button (disabled buttons don't fire clicks, so this is safe)
      continueBtn.addEventListener('click', submitName);

      // Ensure focus keeps it blinking if empty
      input.addEventListener('focus', () => {
         if (input.value.length === 0) {
            cursor.style.display = 'block';
         }
      });

      input.addEventListener('blur', () => {
          cursor.style.display = 'none';
      });

      updateContinueState();
    });
  </script>
<script src="js/animations.js"></script>
</body></html>
