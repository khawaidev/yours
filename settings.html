<script>
(function () {
  var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';

  var supabase = null;
  try {
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    supabase = null;
  }

  // Clear any app-level auth/session flags so the app returns to the guest state.
  function clearSession() {
    try {
      localStorage.removeItem('yours_demo_mode');
    } catch (e) {}
    // Drop persisted Supabase auth tokens (localStorage + sessionStorage) so a
    // signed-out user can never be silently restored by supabase-js.
    var tokenKeys = [
      'supabase.auth.token',
      'sb-dgbxcakkqrgrapwsvrol-auth-token',
      'sb-dgbxcakkqrgrapwsvrol-auth-token-code-verifier'
    ];
    for (var k = 0; k < tokenKeys.length; k++) {
      try { localStorage.removeItem(tokenKeys[k]); } catch (e) {}
      try { sessionStorage.removeItem(tokenKeys[k]); } catch (e) {}
    }
    try {
      sessionStorage.clear();
    } catch (e) {}
  }

  function goHome() {
    window.location.href = 'index.html';
  }

  function getCurrentUserId() {
    return new Promise(function (resolve) {
      if (!supabase) return resolve(null);
      supabase.auth.getUser().then(function (res) {
        resolve(res.data && res.data.user ? res.data.user.id : null);
      }).catch(function () {
        resolve(null);
      });
    });
  }

  var modal = document.getElementById('confirm-modal');
  var backdrop = document.getElementById('confirm-backdrop');
  var title = document.getElementById('confirm-title');
  var desc = document.getElementById('confirm-desc');
  var okBtn = document.getElementById('confirm-ok');
  var cancelBtn = document.getElementById('confirm-cancel');
  var pending = null;

  function showConfirm(t, d, okLabel, onOk) {
    title.textContent = t;
    desc.textContent = d;
    okBtn.textContent = okLabel;
    pending = onOk;
    modal.style.display = 'flex';
  }
  function hideConfirm() {
    modal.style.display = 'none';
    pending = null;
  }
  function setBusy(busy) {
    okBtn.disabled = busy;
    okBtn.classList.toggle('opacity-60', busy);
  }
  cancelBtn.addEventListener('click', hideConfirm);
  backdrop.addEventListener('click', hideConfirm);
  okBtn.addEventListener('click', function () {
    hideConfirm();
    if (pending) pending();
  });

  // ---- Log out: invalidate the Supabase session, then clear local state ----
  document.getElementById('logout-btn').addEventListener('click', function () {
    showConfirm('Log out', 'You will need to sign in again to continue.', 'Log out', function () {
      if (!supabase) {
        clearSession();
        goHome();
        return;
      }
      setBusy(true);
      supabase.auth.signOut().then(function () {
        clearSession();
        goHome();
      }).catch(function () {
        clearSession();
        goHome();
      });
    });
  });

  // ---- Delete account: permanently remove the user + all data, then return home ----
  document.getElementById('delete-btn').addEventListener('click', function () {
    showConfirm('Delete account', 'This will permanently delete your account, chats and all data. This cannot be undone.', 'Delete', function () {
      getCurrentUserId().then(function (userId) {
        if (!userId) {
          clearSession();
          goHome();
          return;
        }
        setBusy(true);
        window.YoursAPI.deleteAccount(userId).then(function () {
          if (supabase) {
            return supabase.auth.signOut();
          }
          return null;
        }).then(function () {
          clearSession();
          goHome();
        }).catch(function (err) {
          setBusy(false);
          alert('Could not delete account: ' + (err && err.message ? err.message : 'Unknown error'));
        });
      });
    });
  });

  // Manage subscription: if the user is on the free plan, open the premium plan page.
  var manageSub = document.getElementById('manage-sub');
  var plan = localStorage.getItem('yours_plan') || 'free';
  if (manageSub) {
    if (plan !== 'pro') {
      manageSub.setAttribute('href', 'premium-acess.html');
    } else {
      manageSub.setAttribute('href', 'features.html');
    }
  }

  // ---- Profile row: render the signed-in user's name + avatar ----
  function applyProfile(p) {
    if (!p) return;
    var nameEl = document.getElementById('settings-profile-name');
    var imgEl = document.getElementById('settings-avatar-img');
    var fbEl = document.getElementById('settings-avatar-fallback');
    if (p.displayName && nameEl) nameEl.textContent = p.displayName;
    if (p.avatarUrl && imgEl) {
      imgEl.src = p.avatarUrl;
      imgEl.classList.remove('hidden');
      if (fbEl) fbEl.classList.add('hidden');
    }
  }
  function loadProfile() {
    var meta = null;
    try {
      var cu = (window.YoursAPI && YoursAPI.getCurrentUser) ? YoursAPI.getCurrentUser() : null;
      if (cu) meta = cu;
    } catch (e) {}
    if (!supabase) { applyProfile(meta); return; }
    supabase.auth.getUser().then(function (r) {
      var u = r.data && r.data.user;
      if (!u) return;
      var um = u.user_metadata || {};
      applyProfile({ displayName: um.full_name || um.name || null, avatarUrl: um.avatar_url || um.picture || null });
      // The DB profile may have a newer display name (edited from edit-profile).
      supabase.from('profiles')
        .select('display_name, avatar_url')
        .eq('id', u.id)
        .maybeSingle()
        .then(function (res) {
          if (res && res.data) {
            applyProfile({ displayName: res.data.display_name, avatarUrl: res.data.avatar_url });
          }
        })
        .catch(function () {});
    }).catch(function () { applyProfile(meta); });
  }
  loadProfile();

  // ---- Restore purchases: verify the account's subscription state ----
  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:.8rem 1.2rem;border-radius:9999px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  var restoreBtn = document.getElementById('restore-btn');
  if (restoreBtn) {
    restoreBtn.addEventListener('click', function (e) {
      e.preventDefault();
      getCurrentUserId().then(function (uid) {
        if (!uid) { showToast('Please sign in to restore purchases.'); return; }
        window.YoursAPI.getSubscription(uid).then(function (res) {
          var sub = res && res.subscription;
          if (sub && (sub.plan_type === 'plus' || sub.plan_type === 'premium') && sub.status !== 'cancelled' && sub.status !== 'expired') {
            showToast('Premium is already active on this account.');
          } else {
            showToast('No previous purchases found on this account.');
          }
        }).catch(function () {
          showToast('Could not check your account. Try again.');
        });
      });
    });
  }
})();
</script>
