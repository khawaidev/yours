<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Settings - Blush Design System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-fonts">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121212; /* Blush Dark Background */
      color: #FFFFFF;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blush: {
              bg: '#121212',
              card: '#1E1E1E',
              text: '#FFFFFF',
              subtext: '#A0A0A0',
              accent: '#FF4D6D', // Example Blush accent
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-blush-bg text-blush-text antialiased min-h-screen flex flex-col items-center pt-8">
<!-- Mobile Container to simulate the app view -->
<div class="w-full max-w-[400px] h-full flex flex-col px-4 pb-8">
<!-- BEGIN: Header -->
<header data-reveal class="flex items-center justify-between py-4 mb-6">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-blush-card transition-colors focus:outline-none focus:ring-2 focus:ring-blush-accent">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.e3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold tracking-wide absolute left-1/2 -translate-x-1/2">Settings</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- END: Header -->
<!-- BEGIN: Profile Section -->
<section data-reveal class="mb-8">
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center text-2xl">
            🤪
          </div>
<div>
<h2 class="font-bold text-lg leading-tight">Edit profile</h2>
<p class="text-blush-subtext text-sm">Tyga</p>
</div>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</section>
<!-- END: Profile Section -->
<!-- BEGIN: Account Settings -->
<section data-reveal class="mb-8">
<h3 class="text-blush-subtext font-semibold mb-3 px-2 text-sm uppercase tracking-wider">Account</h3>
<div class="flex flex-col space-y-3">
<!-- Email Item -->
<a class="block bg-blush-card rounded-[24px] p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
<path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
</svg>
</div>
<div>
<span class="font-bold text-base block leading-tight">Email</span>
<span class="text-blush-subtext text-sm">Add email login</span>
</div>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Manage Subscription Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-base block">Manage subscription</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Restore Purchases Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-base block">Restore purchases</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</section>
<!-- END: Account Settings -->
<!-- BEGIN: App Settings -->
<section data-reveal>
<h3 class="text-blush-subtext font-semibold mb-3 px-2 text-sm uppercase tracking-wider">App settings</h3>
<div class="flex flex-col space-y-3">
<!-- Language Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-base block">Language</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Notifications Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"></path>
</svg>
</div>
<span class="font-bold text-base block">Notifications</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Content & Media Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" fill-rule="evenodd"></path>
</svg>
</div>
<span class="font-bold text-base block">Content &amp; Media</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Sounds & Vibration Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-base block">Sounds &amp; Vibration</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Appearance Item -->
<a class="block bg-blush-card rounded-full p-4 flex items-center justify-between hover:bg-opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-blush-accent" href="#">
<div class="flex items-center space-x-4">
<div class="w-8 flex justify-center">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path> <!-- Fallback icon -->
<!-- Hexagon icon representation -->
<path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="font-bold text-base block">Appearance</span>
</div>
<svg class="h-5 w-5 text-blush-subtext" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
</section>
<!-- END: App Settings -->
</div>
<script src="js/animations.js"></script>
</body></html>
