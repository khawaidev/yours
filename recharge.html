<script>
  (function () {
    // The back arrow returns the user to the page they came from
    // (browser history); fall back to the feed if there is no previous
    // page (e.g. the store was opened directly).
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
    var backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.addEventListener('click', goBack);

    var USER_ID = null;
    try {
      var cu = YoursAPI.getCurrentUser();
      if (cu) USER_ID = cu.id;
    } catch (e) {}

    // Live wallet balance (kept in sync with other pages).
    function refreshBalance() {
      if (!USER_ID) return;
      YoursAPI.getWallet(USER_ID).then(function (res) {
        var bal = document.getElementById('recharge-balance');
        if (res && res.wallet && res.wallet.credits != null && bal) {
          bal.textContent = Math.floor(Number(res.wallet.credits)).toLocaleString();
        }
      }).catch(function () {});
    }
    refreshBalance();

    // Regional pricing: India shows INR, everywhere else shows USD. Prices are
    // loaded from the backend catalog (DB-driven, cached) and rounded to the
    // detected device region.
    var RESOLVED_COUNTRY = null;
    var CATALOG = null;

    function fmtPrice(v, isIndia) {
      var n = Number(v) || 0;
      if (isIndia) return '₹' + n.toLocaleString('en-IN');
      return '$' + (Math.round(n * 100) / 100).toFixed(2);
    }

    // Render token counts + prices from the catalog. Falls back to the static
    // data-* attributes when the backend catalog is unavailable.
    function renderCatalog(isIndia) {
      var buttons = document.querySelectorAll('button[data-item]');
      for (var i = 0; i < buttons.length; i++) {
        var item = buttons[i].getAttribute('data-item');
        var pack = null;
        if (CATALOG && CATALOG.tokenPacks) {
          for (var j = 0; j < CATALOG.tokenPacks.length; j++) {
            if (CATALOG.tokenPacks[j].id === item) { pack = CATALOG.tokenPacks[j]; break; }
          }
        }
        if (pack) {
          buttons[i].setAttribute('data-usd', '$' + (Math.round(pack.usd * 100) / 100).toFixed(2));
          buttons[i].setAttribute('data-inr', '₹' + Number(pack.inr).toLocaleString('en-IN'));
          buttons[i].textContent = isIndia
            ? '₹' + Number(pack.inr).toLocaleString('en-IN')
            : '$' + (Math.round(pack.usd * 100) / 100).toFixed(2);
          var cntEl = document.getElementById('tok-count-' + (i + 1));
          if (cntEl) cntEl.textContent = pack.tokens.toLocaleString('en-US');
        } else {
          buttons[i].textContent = isIndia
            ? buttons[i].getAttribute('data-inr')
            : buttons[i].getAttribute('data-usd');
        }
      }
    }

    function applyRegionalPrices() {
      var country = RESOLVED_COUNTRY || 'US';
      try { if (!RESOLVED_COUNTRY) country = YoursAPI.detectCountry(); } catch (e) {}
      renderCatalog(country === 'IN');
    }

    // Resolve the user's real location (IP-based, caches in sessionStorage)
    // and load the DB-backed price catalog before rendering.
    function loadStorePage() {
      return YoursAPI.getPaymentCatalog()
        .then(function (res) {
          if (res && res.tokenPacks) CATALOG = res;
          applyRegionalPrices();
        })
        .catch(function () { applyRegionalPrices(); });
    }
    YoursAPI.detectLocation()
      .then(function (code) { RESOLVED_COUNTRY = code; })
      .finally(function () { loadStorePage(); });

    function showToast(msg) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:.8rem 1.2rem;border-radius:9999px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 4000);
    }

    // Purchase flow: re-fetch the current price (bypassing the backend cache),
    // then create order → open Razorpay checkout → verify.
    function purchase(itemId, btn) {
      var country = RESOLVED_COUNTRY || 'US';
      try { if (!RESOLVED_COUNTRY) country = YoursAPI.detectCountry(); } catch (e) {}

      if (!USER_ID) {
        showToast('Please sign in to recharge your tokens.');
        return;
      }

      btn.disabled = true;
      var original = btn.textContent;
      btn.textContent = '...';

      YoursAPI.getPaymentCatalog(true)
        .then(function (res) {
          if (res && res.tokenPacks) {
            CATALOG = res;
            renderCatalog(country === 'IN');
          }
          return YoursAPI.createPaymentOrder(USER_ID, itemId, country);
        })
        .then(function (res) {
          var order = res.order;
          if (typeof Razorpay === 'undefined') throw new Error('Razorpay SDK failed to load');
          var options = {
            key: order.keyId,
            amount: order.amountInSmallestUnit,
            currency: order.currency,
            name: 'Yours AI',
            image: 'https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png',
            description: order.description,
            order_id: order.orderId,
            prefill: {
              contact: '',
              email: ''
            },
            handler: function (payResp) {
              return YoursAPI.verifyPayment(USER_ID, {
                orderId: payResp.razorpay_order_id,
                paymentId: payResp.razorpay_payment_id,
                signature: payResp.razorpay_signature,
                itemId: itemId
              }).then(function (verify) {
                showToast('Payment successful! Tokens added to your wallet.');
                if (verify.wallet) {
                  var bal = document.getElementById('recharge-balance');
                  if (bal) bal.textContent = verify.wallet.credits;
                }
              }).catch(function (err) {
                showToast('Payment confirmed but verification failed: ' + (err.message || 'error'));
              });
            },
            modal: {
              ondismiss: function () { btn.disabled = false; btn.textContent = original; }
            }
          };
          var rzp = new Razorpay(options);
          rzp.on('payment.failed', function () { showToast('Payment failed. Please try again.'); });
          rzp.open();
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = original;
          showToast('Could not start checkout: ' + (err.message || 'error'));
        });
    }

    var buttons = document.querySelectorAll('button[data-item]');
    for (var i = 0; i < buttons.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          purchase(btn.getAttribute('data-item'), btn);
        });
      })(buttons[i]);
    }
  })();
</script>
