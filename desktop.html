<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="Yours on the big screen — use Yours on desktop.">
    <meta name="robots" content="noindex, nofollow">
<title>Yours</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png" rel="icon" type="image/png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/desktop.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #1d1020 0%, #0c0c10 55%, #08080a 100%);
    color: #f4f4f6;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Authed layout: sidebar | chats | feeds (40% wider than chats) | profile */
  #shell { display: grid; height: 100vh; height: 100dvh; grid-template-columns: 232px 388px 544px 1fr; transition: grid-template-columns .28s ease; }
  /* Guest layout: sidebar | feeds (same size as chats) | discover */
  body.guest-mode #shell { grid-template-columns: 232px 388px 1fr; }

  #shell.rail { grid-template-columns: 76px 388px 544px 1fr; }
  body.guest-mode #shell.rail { grid-template-columns: 76px 388px 1fr; }

  /* ---- Sidebar ---- */
  #sidebar {
    display: flex; flex-direction: column; gap: 4px;
    background: rgba(18, 18, 24, 0.72);
    border-right: 1px solid rgba(255,255,255,0.06);
    padding: 18px 14px; overflow: hidden; min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 20px; white-space: nowrap; }
  .brand img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
  .brand span { font-size: 19px; font-weight: 800; letter-spacing: .2px; }
  #sidebar .nav-item {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 12px; border-radius: 14px; cursor: pointer;
    color: #9b9ba3; font-size: 14.5px; font-weight: 600; white-space: nowrap;
    background: none; border: none;
    -webkit-tap-highlight-color: transparent; outline: none;
    transition: background .15s, color .15s, transform .15s;
  }
  #sidebar .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  #sidebar .nav-item.active {
    background: linear-gradient(135deg, #c3244c 0%, #f02a53 60%, #ff3e86 100%);
    color: #fff; box-shadow: 0 6px 18px rgba(240,42,83,.35);
  }
  #sidebar .nav-item img,
  #sidebar .nav-item i { width: 20px; height: 20px; text-align: center; font-size: 16.5px; object-fit: contain; flex-shrink: 0; }
  #sidebar .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #shell.rail #sidebar .brand span,
  #shell.rail .nav-label { display: none; }
  #shell.rail #sidebar .nav-item { justify-content: center; padding: 12px; gap: 0; }
  #shell.rail .brand { justify-content: center; padding-inline: 0; }
  #sidebar .spacer { flex: 1; }

  /* Close-only: once closed, there is no way to reopen from here. */
  #close-sidebar-btn {
    display: block; width: 100%; margin-top: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    color: #c9c9d1; border-radius: 12px; padding: 9px 0; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: background .15s;
  }
  #close-sidebar-btn:hover { background: rgba(255,255,255,0.1); }
  #shell.rail #close-sidebar-btn { display: none; }

  /* ---- Panes ---- */
  .pane { min-width: 0; display: flex; flex-direction: column; background: #0e0e12; }
  .pane iframe { flex: 1; width: 100%; border: 0; background: transparent; }

  #chat-pane { border-right: 1px solid rgba(255,255,255,0.06); }
  #feeds-pane { border-right: 1px solid rgba(255,255,255,0.06); background: #0a0a0c; }
  #profile-pane { border-left: 1px solid rgba(255,255,255,0.06); background: #0a0a0c; }
  body.guest-mode #chat-pane { display: none; }
  /* Guests use the right pane for Discover (not character profile) */
  body.guest-mode #profile-pane { display: flex; border-left: 0; background: #0a0a0c; }

  @media (max-width: 1250px) {
    #shell { grid-template-columns: 76px 340px 476px 1fr; }
    body.guest-mode #shell { grid-template-columns: 76px 340px 1fr; }
  }
  @media (max-width: 1050px) {
    #profile-pane { display: none; }
    #shell, body.guest-mode #shell { grid-template-columns: 76px 340px 1fr; }
  }
  @media (max-width: 860px) {
    #chat-pane { display: none !important; }
    #shell, body.guest-mode #shell { grid-template-columns: 76px 1fr; }
  }
</style>
</head>
<body>
<div id="shell">

  <!-- LEFT: navigation sidebar (can only be closed, never reopened) -->
  <aside id="sidebar" aria-label="Navigation">
    <div class="brand">
      <img alt="Yours" src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
      <span class="text-gradient">Yours</span>
    </div>

    <button class="nav-item active" data-nav="home" data-src="index.html">
      <img alt="" src="https://i.ibb.co/hR2htXpk/football-card.png"><span class="nav-label">Feed</span>
    </button>
    <button class="nav-item" data-nav="discover" data-src="Discover.html">
      <img alt="" src="https://i.ibb.co/Zp5ZML9X/browser.png"><span class="nav-label">Discover</span>
    </button>
    <button class="nav-item" data-nav="profile" data-src="user-profile.html">
      <img alt="" src="https://i.ibb.co/kVrCvk98/user-1.png"><span class="nav-label">Profile</span>
    </button>
    <button class="nav-item" data-nav="settings" data-src="settings.html">
      <i class="fa-solid fa-gear"></i><span class="nav-label">Settings</span>
    </button>

    <div class="spacer"></div>
    <button id="close-sidebar-btn" title="Close sidebar"><i class="fa-solid fa-bars-staggered"></i></button>
  </aside>

  <!-- CHATS: persistent chat list (authed users only, loaded by script) -->
  <section class="pane" id="chat-pane">
    <iframe id="chatFrame" name="chatFrame" src="about:blank" title="Chats"></iframe>
  </section>

  <!-- MIDDLE: feeds by default; messaging when a chat opens; nav pages load here -->
  <section class="pane" id="feeds-pane">
    <iframe id="mainFrame" name="mainFrame" src="index.html?pane=1" title="Feeds"></iframe>
  </section>

  <!-- RIGHT: current character's profile (authed) / Discover page (guests),
       loaded by script so signed-out users never load the wrong page first -->
  <section class="pane" id="profile-pane">
    <iframe id="sideFrame" name="sideFrame" src="about:blank" title="Side panel"></iframe>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    'use strict';

    var shell = document.getElementById('shell');
    var mainFrame = document.getElementById('mainFrame');
    var sideFrame = document.getElementById('sideFrame');
    var chatFrame = document.getElementById('chatFrame');
    var closeBtn = document.getElementById('close-sidebar-btn');
    var navButtons = Array.prototype.slice.call(document.querySelectorAll('#sidebar .nav-item[data-nav]'));

    var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';

    // ---- Auth state ------------------------------------------------------
    // Quick synchronous check so the layout is right on first paint; the
    // supabase session check below corrects it if storage was stale.
    function hasStoredSession() {
      var keys = [
        'supabase.auth.token',
        'sb-dgbxcakkqrgrapwsvrol-auth-token',
        'sb-dgbxcakkqrgrapwsvrol-auth-token-code-verifier'
      ];
      for (var i = 0; i < keys.length; i++) {
        var raw = null;
        try { raw = localStorage.getItem(keys[i]); } catch (e) {}
        if (!raw) { try { raw = sessionStorage.getItem(keys[i]); } catch (e) {} }
        if (!raw) continue;
        try {
          var s = JSON.parse(raw).currentSession || JSON.parse(raw);
          if (s && typeof s.access_token === 'string') return true;
        } catch (e) {}
        if (/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(raw)) return true;
      }
      return false;
    }

    var isAuth = hasStoredSession();
    var demoMode = null;
    try { demoMode = new URLSearchParams(window.location.search).get('demo') || localStorage.getItem('yours_demo_mode'); } catch (e) {}
    if (!isAuth && demoMode === 'auth') isAuth = true;

    function applyMode() {
      document.body.classList.toggle('guest-mode', !isAuth);
      if (!isAuth) {
        // Guests only ever see feeds + discover; every other destination is
        // the auth page. Unload the chat list so it never runs for them.
        chatFrame.src = 'about:blank';
        sideFrame.src = 'Discover.html?pane=1';
        highlight(null);
      } else {
        chatFrame.src = 'chat.html?pane=1&t=' + Date.now();
        refreshProfilePane();
      }
    }

    // ---- Sidebar closed state (close-only, persists) ---------------------
    try {
      if (localStorage.getItem('yours_sidebar_closed') === '1' ||
          (window.innerWidth > 0 && window.innerWidth < 900)) shell.classList.add('rail');
    } catch (e) { /* ignore */ }

    closeBtn.addEventListener('click', function () {
      shell.classList.add('rail');
      try { localStorage.setItem('yours_sidebar_closed', '1'); } catch (e) { /* ignore */ }
    });

    // ---- Main pane routing -----------------------------------------------
    var lastMain = 'index.html';

    function pageFromQuery() {
      var m = /[?&]page=([^&]+)/.exec(window.location.search);
      return m ? decodeURIComponent(m[1]) : (isAuth ? 'home' : null);
    }

    function setMain(url) {
      if (!url) return;
      lastMain = url;
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      mainFrame.src = url + sep + 'pane=1&t=' + Date.now();
    }

    function refreshProfilePane() {
      // Reload so character-profile.html re-reads the current character.
      sideFrame.src = 'character-profile.html?pane=1&t=' + Date.now();
    }

    function highlight(nav) {
      navButtons.forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-nav') === nav);
      });
    }

    navButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!isAuth) { window.location.href = 'auth.html'; return; }
        var nav = btn.getAttribute('data-nav');
        setMain(btn.getAttribute('data-src'));
        highlight(nav);
      });
    });

    applyMode();

    // Default page from the URL (?page=...), else feed.
    var qPage = pageFromQuery();
    highlight(qPage);
    var initBtn = navButtons.filter(function (b) { return b.getAttribute('data-nav') === qPage; })[0];
    if (initBtn && isAuth) setMain(initBtn.getAttribute('data-src'));

    // Confirm/correct the storage-based guess with a real session lookup.
    try {
      var sb = window.supabase && window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      if (sb) {
        sb.auth.getSession().then(function (res) {
          var hasSession = !!(res.data && res.data.session);
          if (hasSession !== isAuth) {
            isAuth = hasSession;
            applyMode();
            if (!isAuth) highlight(null);
          }
        }).catch(function () {});
        sb.auth.onAuthStateChange(function (event) {
          if (event === 'SIGNED_OUT' && isAuth) { isAuth = false; applyMode(); }
          else if (event === 'SIGNED_IN' && !isAuth) {
            isAuth = true; applyMode();
            setMain('index.html'); highlight('home');
          }
        });
      }
    } catch (e) { /* ignore */ }

    // Pages inside the panes post messages when the user opens a chat,
    // opens a profile, or presses back — drive the panes here.
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || !d.ys) return;

      if (!isAuth) { window.location.href = 'auth.html'; return; }

      if (d.ys === 'open-chat') {
        setMain('messaging.html');
        highlight(null);
        refreshProfilePane();
      } else if (d.ys === 'open-profile') {
        refreshProfilePane();
        highlight(null);
      } else if (d.ys === 'go-back') {
        setMain(lastMain || 'index.html');
      }
    });
  })();
</script>
</body></html>
