<script>
        function selectCard(clickedButton) {
            clickedButton.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.swipe-container');
            const cards = document.querySelectorAll('.swipe-card');

            const updateActiveCard = () => {
                let minDistance = Infinity;
                let centerCard = null;
                const containerCenter = container.scrollLeft + container.clientWidth / 2;

                cards.forEach(card => {
                    const cardCenter = card.offsetLeft + card.clientWidth / 2;
                    const distance = Math.abs(containerCenter - cardCenter);
                    if (distance < minDistance) {
                        minDistance = distance;
                        centerCard = card;
                    }
                });

                cards.forEach(card => {
                    if (card === centerCard) {
                        card.classList.add('card-active');
                        card.classList.remove('card-inactive', 'border-white/10');
                    } else {
                        card.classList.remove('card-active');
                        card.classList.add('card-inactive', 'border-white/10');
                    }
                });
            };

            container.addEventListener('scroll', updateActiveCard);
            // Run initially to set correct state
            updateActiveCard();
        });
    </script>
