<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="description" content="Choose what catches your eye — appearance preferences for your ideal AI companion.">
    <meta name="robots" content="noindex, nofollow">
<title>Who catches your eye?</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/onboarding.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      background-color: #131313;
      color: #fff;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="ys-ob-page app-page">
<!-- BEGIN: Top Navigation & Progress -->
<header class="ys-ob-header">
<button aria-label="Go back" class="ys-ob-back" onclick="window.location.href='art-interest.html'" type="button">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 19l-7-7 7-7"></path></svg>
</button>
<!-- Progress Bar (identical on every onboarding step) -->
<div class="ys-ob-progress" data-step="5"><span data-ob-progress></span></div>
<div class="ys-ob-spacer" aria-hidden="true"></div>
</header>
<!-- END: Top Navigation & Progress -->
<!-- BEGIN: Main Content Area -->
<main class="ys-ob-main">
<!-- Header Section -->
<div class="ys-ob-title">
<h1>Who catches your eye?</h1>
</div>
<!-- Swipe Gallery -->
<div class="ys-ob-carousel" id="carousel">
<!-- Card 1: Empress lady -->
<button aria-label="Select Empress lady" class="ys-ob-card is-inactive" data-value="empress_lady" type="button">
<div class="ys-ob-card-img" data-alt="A portrait of a sophisticated, confident woman in her 40s wearing stylish, dark-rimmed glasses and a crisp white silk blouse." style="background-image: url(&quot;https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2001_11_43%20AM.png&quot;);"></div>
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">Empress lady</span>
</button>
<!-- Card 2: MILF -->
<button aria-label="Select MILF" class="ys-ob-card is-inactive" data-value="milf" type="button">
<div class="ys-ob-card-img" data-alt="A captivating portrait of an attractive, mature woman with blonde hair styled in a messy chic updo." style="background-image: url(&quot;https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2001_21_33%20AM.png&quot;);"></div>
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">MILF</span>
</button>
<!-- Card 3: Adult College Girl -->
<button aria-label="Select Adult Collage Girl" class="ys-ob-card is-inactive" data-value="adult_collage_girl" type="button">
<div class="ys-ob-card-img" data-alt="A vibrant portrait of a stunning, wealthy-looking woman with rich brown skin and voluminous dark hair." style="background-image: url(&quot;https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2001_29_36%20AM.png&quot;);"></div>
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">Adult Collage Girl</span>
</button>
<!-- Card 4: Sweet Girl -->
<button aria-label="Select Sweet Girl" class="ys-ob-card is-active" data-value="sweet_girl" type="button">
<div class="ys-ob-card-img" data-alt="A dramatic portrait of an intense, authoritative woman with dark hair." style="background-image: url(&quot;https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2001_40_45%20AM.png&quot;);"></div>
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">Sweet Girl</span>
</button>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Action -->
<footer class="ys-ob-footer">
<button class="ys-ob-btn" id="continue-btn" type="button">
    Continue
  </button>
</footer>
<!-- END: Footer Action -->
<script src="js/onboarding.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const carousel = YSOnboarding.bindCarousel({ root: '#carousel', key: 'archetype' });

    // Restore a previous choice (back/forward navigation).
    const saved = YSOnboarding.get('archetype');
    if (saved && carousel) carousel.select(saved);

    document.getElementById('continue-btn').addEventListener('click', () => {
      const active = document.querySelector('.ys-ob-card.is-active');
      if (active) YSOnboarding.set('archetype', active.getAttribute('data-value'));
      window.location.href = 'explore-interest.html';
    });
  });
</script>
<script src="js/animations.js"></script>
</body></html>
