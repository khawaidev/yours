<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector('.carousel-container');
    const items = document.querySelectorAll('.carousel-item');

    // Selection logic (highlights the tapped card with an accent ring)
    items.forEach(item => {
      item.addEventListener('click', () => {
        item.classList.toggle('selected');
        item.style.boxShadow = item.classList.contains('selected') ? "0 0 0 2px #ff5c35" : "none";
      });
    });

    // Intersection Observer for scroll snapping visual effect
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active-card');
        } else {
          entry.target.classList.remove('active-card');
        }
      });
    }, {
      root: container,
      threshold: 0.6 // Trigger when 60% visible
    });

    items.forEach(item => observer.observe(item));
  });
</script>
