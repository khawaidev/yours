<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Chat Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style data-purpose="custom-styles">
    body {
      background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBKZ-JbzvLuDg7Ys03ZJDIcsMYJbJaDhR_J5AU54WqH8GT3gAPf36MIy_ELrtECtHjI_bGVWCG1Rkkcg9oOv6_7IOCm7Q_rpvz8FCstIHrRIDkLTyLZpf4B1katO7YSKW7CJCx7V_YFgCjQdNEmloApBhVt_lGvX1Qmvg4ggu2FZ0HS1FnMwWks6Wuzs2KWYgEUiTlDnbbaSS_m7v5AWPDx0s8IuLfjue7RbvqixmDf9Zxd45F2zaHAYo9Yv-GxcypUIzc');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .gradient-pro {
      background: linear-gradient(90deg, #1d4ed8 0%, #8b5cf6 50%, #1d4ed8 100%);
    }

    .blurred-photo {
      background: linear-gradient(180deg, #4b5563 0%, #1f2937 100%);
    }
    
    /* Scrollbar hiding for chat area */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

<body class="text-white h-screen flex flex-col overflow-hidden bg-black/60" style="background-image: url(&quot;https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%207%2C%202026%2C%2002_52_19%20AM.png&quot;); background-size: cover; background-position: center center; background-attachment: fixed; font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;">
<!-- BEGIN: Custom skeleton loader (mirrors page layout) -->
<div id="page-skeleton" style="position:fixed;inset:0;z-index:9999;background:#0e0e0e;display:flex;flex-direction:column;align-items:center">
<div style="width:100%;max-width:28rem;height:100%;padding:1rem 1.25rem;display:flex;flex-direction:column">
<!-- Header: back / avatar / name + actions -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
<div style="display:flex;align-items:center;gap:.75rem">
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
<div class="skeleton-block" style="width:3rem;height:3rem;border-radius:9999px"></div>
<div class="skeleton-block" style="height:1.25rem;width:4rem;border-radius:.375rem"></div>
</div>
<div style="display:flex;gap:.75rem">
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
</div>
</div>
<!-- Chat bubbles -->
<div style="flex:1;display:flex;flex-direction:column;gap:1rem;justify-content:flex-end">
<div class="skeleton-block" style="height:3rem;width:60%;border-radius:1rem 1rem 1rem .25rem"></div>
<div class="skeleton-block" style="height:2.5rem;width:45%;border-radius:1rem 1rem .25rem 1rem;align-self:flex-end"></div>
<div class="skeleton-block" style="height:4rem;width:70%;border-radius:1rem 1rem 1rem .25rem"></div>
<div class="skeleton-block" style="height:2.5rem;width:40%;border-radius:1rem 1rem .25rem 1rem;align-self:flex-end"></div>
</div>
<!-- Bottom controls -->
<div style="display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem">
<div style="display:flex;gap:1rem">
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
<div class="skeleton-block" style="width:2.5rem;height:2.5rem;border-radius:9999px"></div>
</div>
<div style="display:flex;gap:.5rem">
<div class="skeleton-block" style="height:2.25rem;width:6.5rem;border-radius:9999px"></div>
<div class="skeleton-block" style="height:2.25rem;width:7rem;border-radius:9999px"></div>
<div class="skeleton-block" style="height:2.25rem;width:5rem;border-radius:9999px"></div>
</div>
<div style="display:flex;gap:.75rem;align-items:center">
<div class="skeleton-block" style="height:3.25rem;flex:1;border-radius:9999px"></div>
<div class="skeleton-block" style="width:3rem;height:3rem;border-radius:9999px"></div>
</div>
</div>
</div>
</div>
<!-- END: Custom skeleton loader -->
<!-- BEGIN: Header -->
<header class="flex items-center justify-between px-4 pb-4 z-10 relative pt-4">
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<i class="fa-solid fa-chevron-left"></i>
</button>
<div class="relative">
<img alt="Elsa Profile" class="w-12 h-12 rounded-full object-cover border-2 border-transparent" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8W8C6ozSv-X3_dsYCoFEdI23dQEZXr2pLYztz_LZlP41w6_bEDaQeDRptfw1NRtFdXMcpo_PVzS0Zywfj-ORdgRlgHfRjWAgJ81RGiGmf5sc3jx8PxvqJaInfO4nM2l2u-Qfu1dKhFj5PhwZXc0CRDqIWpFe8ohZLzKD00v9hh3N3pKCrVVKSAjVJ7zWmwghrZm8uVW2gkaWfrVOuyMkvm8yQKI1F90SJe87CEDT-7YTvns1VcTBiOQ">
<div class="absolute inset-0 rounded-full border-2 border-white/50 animate-pulse"></div>
</div>
<h1 class="text-xl font-bold">Elsa</h1>
</div>
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<i class="fa-solid fa-wand-magic-sparkles"></i>
</button>
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<i class="fa-solid fa-ellipsis"></i>
</button>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Chat Area -->
<main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 relative z-0 no-scrollbar gap-6"></main>
<!-- END: Chat Area -->
<!-- BEGIN: Bottom Controls -->
<footer class="absolute bottom-0 left-0 right-0 p-4 pb-8 bg-gradient-to-t from-black/80 to-transparent z-20 flex flex-col gap-3">
<!-- Action Buttons -->
<div class="flex items-center gap-4 pl-2">
<button class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-lg">
<i class="fa-solid fa-heart text-red-500 text-xl"></i>
</button>
<button class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-lg">
<i class="fa-solid fa-thumbs-down text-yellow-500 text-xl"></i>
</button>
<button class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-lg">
<i class="fa-solid fa-rotate text-black text-lg"></i>
</button>
</div>
<!-- Quick Actions Scroll -->
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
<button class="glass-effect rounded-full py-2 px-4 flex items-center gap-2 text-sm font-medium whitespace-nowrap">
<i class="fa-regular fa-image"></i> Quick pic
      </button>
<button class="glass-effect rounded-full py-2 px-4 flex items-center gap-2 text-sm font-medium whitespace-nowrap">
<i class="fa-solid fa-video"></i> Custom video
      </button>
<button class="glass-effect rounded-full py-2 px-4 flex items-center gap-2 text-sm font-medium whitespace-nowrap">
<i class="fa-solid fa-microphone"></i> Voice
      </button>
</div>
<!-- Message Input -->
<div class="flex items-center gap-3">
<div class="glass-effect flex-1 rounded-full flex items-center px-4 py-3 relative">
<input class="bg-transparent border-none outline-none w-full text-white placeholder-white/70 focus:ring-0 p-0 text-base" placeholder="Message" type="text">
<div class="flex items-center gap-3 absolute right-4">
<button class="text-white/80 hover:text-white"><i class="fa-solid fa-bolt"></i></button>
<button class="text-white/80 hover:text-white"><i class="fa-regular fa-image"></i></button>
</div>
</div>
<button class="w-12 h-12 rounded-full glass-effect flex items-center justify-center flex-shrink-0">
<i class="fa-solid fa-gift text-yellow-400 text-xl"></i>
</button>
</div>
</footer>
<!-- END: Bottom Controls -->




<script src="js/animations.js"></script>
</body></html>
