<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Yours - Create Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

                extend: {

                        "surface-container-highest": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "on-tertiary-container": "#3f2700",
                        "background": "#131313",
                        "surface": "#131313",
                        "on-secondary-container": "#ffd5e6",
                        "secondary": "#ffafd5",
                        "surface-dim": "#131313",
                        "surface-variant": "#353534",
                        "surface-tint": "#ffb4a3",
                        "secondary-fixed-dim": "#ffafd5",
                        "primary-container": "#ff5c35",
                        "surface-container-high": "#2a2a2a",
                        "primary-fixed": "#ffdad2",
                        "tertiary": "#ffb951",
                        "tertiary-fixed-dim": "#ffb951",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "secondary-container": "#bd0183",
                        "primary": "#ffb4a3",
                        "inverse-on-surface": "#313030",
                        "error": "#ffb4ab",
                        "on-primary": "#621100",
                        "outline-variant": "#5b413a",
                        "tertiary-fixed": "#ffddb3",
                        "on-primary-container": "#5a0e00",
                        "on-primary-fixed-variant": "#8a1c00",
                        "on-background": "#e5e2e1",
                        "inverse-primary": "#b52701",
                        "on-tertiary-fixed-variant": "#633f00",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#8a005e",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary": "#452b00",
                        "on-surface-variant": "#e3beb6",
                        "on-primary-fixed": "#3d0700",

                    spacing: {

                        "stack-md": "16px",
                        "gutter": "16px",

                        "unit": "8px"

                    fontFamily: {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],

                    fontSize: {

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        .text-gradient {
            background-image: linear-gradient(135deg, #C3244C 0%, #F02A53 50%, #FF3E86 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        
        .icon-gradient {
            background: -webkit-linear-gradient(135deg, #C3244C 0%, #F02A53 50%, #FF3E86 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .glass-panel {
            background: rgba(42, 42, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden pt-safe pb-[100px]">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-container-margin py-4 sticky top-0 z-40 bg-background/80 backdrop-blur-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-gradient tracking-tight">YOURS</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center glass-panel text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-container-margin py-stack-md flex flex-col gap-stack-lg max-w-2xl mx-auto w-full">
<!-- Header Text -->
<section class="text-center space-y-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">What do you want to create today?</h2>
<p class="font-body-lg text-body-lg font-medium max-w-[280px] mx-auto text-on-surface-variant">
                Unleash the power of AI art and craft unique characters to fall in love with!
            </p>
</section>
<!-- Creation Cards -->
<section class="grid grid-cols-1 gap-4">
<!-- Character Card -->
<button class="w-full text-left glass-panel rounded-2xl p-6 flex items-center justify-between group hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[40px] icon-gradient transition-transform group-hover:scale-110 duration-300" data-icon="person_add">person_add</span>
<div>
<h3 class="font-headline-lg-mobile text-[22px] leading-tight font-bold text-on-surface mb-1">Create character</h3>
<p class="font-body-md text-on-surface-variant text-sm">Design your perfect AI companion</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Photo Card -->
<button class="w-full text-left glass-panel rounded-2xl p-6 flex items-center justify-between group hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[40px] icon-gradient transition-transform group-hover:scale-110 duration-300" data-icon="image">image</span>
<div>
<h3 class="font-headline-lg-mobile text-[22px] leading-tight font-bold text-on-surface mb-1">Create AI photo</h3>
<p class="font-body-md text-on-surface-variant text-sm">Generate stunning visual art</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Video Card -->
<button class="w-full text-left glass-panel rounded-2xl p-6 flex items-center justify-between group hover:bg-surface-container-high transition-all active:scale-[0.98]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[40px] icon-gradient transition-transform group-hover:scale-110 duration-300" data-icon="videocam">videocam</span>
<div>
<h3 class="font-headline-lg-mobile text-[22px] leading-tight font-bold text-on-surface mb-1">Create AI video</h3>
<p class="font-body-md text-on-surface-variant text-sm">Bring your ideas to motion</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</section>
</main>
<!-- Floating Pill Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 pb-safe pointer-events-none flex justify-center px-4 mb-6">
<nav class="bg-surface/90 backdrop-blur-lg border border-outline-variant/10 shadow-2xl rounded-full px-6 py-3 flex justify-between items-center w-full max-w-sm pointer-events-auto">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-200 w-12">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
</button>
<!-- For You -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-200 w-12">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="hotel_class">hotel_class</span>
</button>
<!-- Create (Active) -->
<button class="flex flex-col items-center justify-center bg-gradient-brand text-white rounded-full w-14 h-14 -mt-6 shadow-lg shadow-[#F02A53]/30 transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined text-[28px]" data-icon="add" style="font-variation-settings: 'FILL' 1">add</span>
</button>
<!-- Chats -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-200 w-12">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="chat_bubble">chat_bubble</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-200 w-12">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
</button>
</nav>
</div>
<script src="js/animations.js"></script>
</body></html>
