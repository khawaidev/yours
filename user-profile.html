<script>
  // Load the real signed-in user: name, plan, and love-token balance from the
  // backend wallet (replacing the static "Tyga" / "1,250" placeholders).
  document.addEventListener('DOMContentLoaded', function () {
    var user = null;
    try { user = YoursAPI.getCurrentUser(); } catch (e) {}

    var nameEl = document.getElementById('profile-name');
    var planEl = document.getElementById('profile-plan');
    var avatarEl = document.getElementById('profile-avatar');
    var balanceEl = document.getElementById('wallet-balance');

    // Turn an email like "john.doe@gmail.com" into "John Doe".
    function emailToName(email) {
      if (!email) return '';
      var part = (email.split('@')[0] || '').replace(/[._-]+/g, ' ').trim();
      if (!part) return '';
      return part.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    function looksLikeEmail(s) {
      return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s || '');
    }

    // Deterministic background colour for the letter avatar.
    function avatarColorFor(seed) {
      var palette = ['#FF5A36', '#BD0183', '#C5861C', '#3B82F6', '#10B981', '#8B5CF6', '#EC4899', '#14B8A6'];
      var h = 0;
      for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      return palette[h % palette.length];
    }

    // The profile picture: the user's assigned profile icon from
    // /assets/profile-icons when set, else a letter avatar fallback.
    function applyProfile(profileName, profileIcon) {
      var candidates = [profileName, user && user.displayName];
      var name = '';
      for (var i = 0; i < candidates.length; i++) {
        var c = candidates[i];
        if (c && String(c).trim() && !looksLikeEmail(c)) { name = String(c).trim(); break; }
      }
      if (!name) name = emailToName(user ? user.email : '');
      name = name || 'User';

      if (nameEl) nameEl.textContent = name;
      if (planEl && !planEl.dataset.set) {
        planEl.dataset.set = '1';
      }

      if (avatarEl) {
        if (profileIcon && /^usericon[1-5]$/.test(String(profileIcon))) {
          avatarEl.innerHTML = '';
          avatarEl.style.backgroundColor = 'transparent';
          avatarEl.innerHTML = '<img src="Assets/profile-icons/' + encodeURIComponent(String(profileIcon)) + '.png" alt="' + name + ' icon" class="w-full h-full object-cover">';
        } else {
          avatarEl.innerHTML = '';
          avatarEl.style.backgroundImage = '';
          avatarEl.style.backgroundSize = '';
          avatarEl.style.backgroundPosition = '';
          avatarEl.style.backgroundColor = avatarColorFor(name);
          avatarEl.style.color = '#ffffff';
          avatarEl.textContent = name.trim().charAt(0).toUpperCase() || 'U';
        }
      }
    }

    // Always render a letter avatar — even when the session is unreadable, so a
    // stale emoji/photo placeholder can never remain on screen.
    applyProfile(null);

    if (!user || !user.id) return;

    // Bootstrap/refresh the profile (idempotent; passes email so a Google sign-in
    // with an existing email is treated as a login, never a duplicate user).
    YoursAPI.bootstrapProfile({
      userId: user.id,
      email: user.email || '',
      displayName: user.displayName || '',
      avatarUrl: user.avatarUrl || null,
    }).then(function (res) {
      var profile = res && res.profile;
      if (profile) applyProfile(profile.display_name, profile.profile_icon);
      if (planEl) planEl.textContent = 'FREE user';
      // Real plan state drives the badge and the banner action.
      YoursAPI.isPro(user.id).then(function (pro) {
        if (pro) {
          if (planEl) planEl.textContent = 'PRO user';
          upgradeToTopUp();
        }
      }).catch(function () {});
    }).catch(function () {});

    // Real love-token balance from the backend wallet endpoint.
    YoursAPI.getWallet(user.id).then(function (res) {
      var wallet = res && res.wallet;
      if (wallet && typeof wallet.credits === 'number' && balanceEl) {
        balanceEl.textContent = Math.floor(wallet.credits).toLocaleString();
      }
    }).catch(function () {});

    // PRO users top up tokens instead of upgrading: swap the banner button.
    function upgradeToTopUp() {
      var btn = document.getElementById('pro-action-btn');
      if (!btn) return;
      btn.textContent = 'Top up more love tokens';
      btn.classList.remove('bg-white', 'text-black', 'hover:scale-105');
      btn.classList.add('bg-gradient-to-r', 'from-[#FF5A36]', 'to-[#FF4D6D]', 'text-white', 'hover:scale-105');
      btn.setAttribute('onclick', "window.location.href = 'recharge.html';");
    }
  });
</script>
