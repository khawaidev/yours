<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="description" content="Adjust conversation settings with your AI companion on Yours.">
    <meta name="robots" content="noindex, nofollow">
<title>Conversation Settings</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000003704823093c6cccb8ba71cd1.png" rel="icon" type="image/png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #131313; color: white; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:9999px; background:#3a3a3a; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:8px; height:8px; border-radius:9999px; background:#ff7e5f; cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:8px; height:8px; border-radius:9999px; background:#ff7e5f; cursor:pointer; border:none; }
  .btn-chip { padding:10px 18px; border-radius:9999px; background:#201f1f; border:1px solid #3a3a3a; color:#d1d1d1; font-size:14px; font-weight:500; transition:all .15s ease; cursor:pointer; }
  .btn-chip.selected { background:#ff7e5f; border-color:#ff7e5f; color:#fff; }
  .apply-enabled { background:#ff7e5f !important; opacity:1 !important; pointer-events:auto !important; }
</style>
</head>
<body class="antialiased app-page">
<main class="min-h-screen flex flex-col pb-28">
<div class="px-6 pt-6 flex items-center justify-between relative">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition-colors cursor-pointer" onclick="window.location.href = 'character-profile.html#about';">
<i class="fa-solid fa-chevron-left text-lg"></i>
</button>
<h1 class="text-xl font-bold absolute left-1/2 -translate-x-1/2">Conversation</h1>
<div class="w-10"></div>
</div>
<div class="px-6 mt-8 flex flex-col gap-8">
<section>
<h2 class="text-base font-bold mb-4">Response length</h2>
<input type="range" min="0" max="100" value="50" id="response-length" aria-label="Response length">
<div class="flex justify-between mt-2 text-sm text-gray-400">
<span>Short</span>
<span>Long</span>
</div>
</section>
<section>
<h2 class="text-base font-bold mb-4">Additional Features</h2>
<div class="flex flex-wrap gap-3">
<button class="btn-chip" type="button" onclick="toggleChip(this)">Swearing</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Slang</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Abbreviations</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Emojis</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Dirty Talk</button>
</div>
</section>
</div>
</main>
<div class="fixed bottom-0 inset-x-0 px-6 pb-8 pt-4 bg-gradient-to-t from-[#131313] via-[#131313] to-transparent">
<button id="apply-btn" class="w-full py-4 rounded-full bg-gray-800 text-white font-bold text-lg shadow-lg pointer-events-none opacity-60 cursor-not-allowed" disabled type="button" onclick="applySettings()">Apply</button>
</div>
<script>
var slider = document.getElementById('response-length');
var applyBtn = document.getElementById('apply-btn');
var chips = document.querySelectorAll('.btn-chip');
var defaults = { length: 50, chips: {} };
for (var i = 0; i < chips.length; i++) defaults.chips[i] = false;
function refreshSlider() {
  slider.style.background = 'linear-gradient(to right, #ff7e5f ' + slider.value + '%, #3a3a3a ' + slider.value + '%)';
}
function refreshApply() {
  var changed = parseInt(slider.value, 10) !== defaults.length;
  if (!changed) {
    for (var i = 0; i < chips.length; i++) {
      if ((chips[i].classList.contains('selected')) !== defaults.chips[i]) { changed = true; break; }
    }
  }
  if (changed) {
    applyBtn.disabled = false;
    applyBtn.classList.add('apply-enabled');
    applyBtn.classList.remove('cursor-not-allowed');
  } else {
    applyBtn.disabled = true;
    applyBtn.classList.remove('apply-enabled');
    applyBtn.classList.add('cursor-not-allowed');
  }
}
slider.addEventListener('input', function () { refreshSlider(); refreshApply(); });
function toggleChip(btn) { btn.classList.toggle('selected'); refreshApply(); }
function saveSettings() {
  var features = [];
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].classList.contains('selected')) features.push(chips[i].textContent.trim());
  }
  var charSettings = {};
  try { charSettings = JSON.parse(sessionStorage.getItem('yours_char_settings') || '{}'); } catch (e) {}
  charSettings.responseLength = parseInt(slider.value, 10);
  charSettings.features = features;
  try { sessionStorage.setItem('yours_char_settings', JSON.stringify(charSettings)); } catch (e) {}
}
function applySettings() {
  window.YoursPlanGate.apply(function () {
    saveSettings();
    history.back();
  });
}
refreshSlider();
refreshApply();
</script>
<script src="js/api-client.js"></script>
<script src="js/plan-gate.js"></script>
</body></html>
