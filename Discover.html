<style data-purpose="custom-utilities">
    /* Hide scrollbar for horizontal scrolling areas */
    .no-scrollbar::-webkit-scrollbar {
      display: none;

      -ms-overflow-style: none;
      scrollbar-width: none;

    /* Card shimmer / skeleton */
    .skel-card {

      border-radius: 24px;

    .skel-card::after {
      content: '';

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);

<script>
  (function () {
    var API = window.YoursAPI;

    // ---- Coming soon (Create) modal ----
    var createBtn = document.getElementById('create-btn');
    var comingSoonModal = document.getElementById('coming-soon-modal');
    var comingSoonBackdrop = document.getElementById('coming-soon-backdrop');
    var comingSoonOk = document.getElementById('coming-soon-ok');
    if (createBtn && comingSoonModal) {
      createBtn.addEventListener('click', function () { comingSoonModal.style.display = 'flex'; });
      comingSoonOk.addEventListener('click', function () { comingSoonModal.style.display = 'none'; });
      comingSoonBackdrop.addEventListener('click', function () { comingSoonModal.style.display = 'none'; });
    }

    // ---- Helpers ----
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    function feedImage(c) {
      if (c.character_feeds && c.character_feeds.length) {
        var imgFeed = c.character_feeds.find(function (f) { return f.media_type === 'image' && f.media_url; });
        if (imgFeed) return imgFeed.media_url;
        return c.character_feeds[0].media_url || null;
      }
      return c.circular_profile_image_url || c.feed_media_url || c.background_image_url || null;
    }

    function cardHtml(c, wide) {
      var img = feedImage(c);
      var nameAge = (c.name || '') + (c.age ? ', ' + c.age : '');
      var about = c.about || c.description || c.bio || '';
      var cls = wide
        ? 'relative w-full aspect-[3/4] rounded-card overflow-hidden shrink-0 snap-start cursor-pointer'
        : 'relative w-[160px] h-[320px] rounded-card overflow-hidden shrink-0 snap-start cursor-pointer';
      return '<div class="' + cls + '" data-char="' + esc(c.id) + '">' +
        (img
          ? '<img loading="lazy" class="w-full h-full object-cover" src="' + esc(img) + '" alt="' + esc(c.name) + '">'
          : '<div class="w-full h-full bg-app-accent flex items-center justify-center text-4xl font-bold">' + esc((c.name || '?').charAt(0).toUpperCase()) + '</div>') +
        '<div class="absolute inset-0 card-gradient flex flex-col justify-end p-4">' +
          '<h3 class="font-bold text-lg mb-1 drop-shadow-md">' + esc(nameAge) + '</h3>' +
          '<p class="text-xs text-gray-200 line-clamp-2 drop-shadow-sm">' + esc(about) + '</p>' +
        '</div></div>';
    }

    function renderInto(container, chars, wide) {
      container.innerHTML = '';
      if (!chars || !chars.length) {
        container.innerHTML = '<p class="text-sm text-app-secondary py-8">No characters here yet.</p>';
        return;
      }
      chars.forEach(function (c) {
        var div = document.createElement('div');
        div.innerHTML = cardHtml(c, wide);
        var card = div.firstChild;
        card.addEventListener('click', function () { openCharacter(c); });
        container.appendChild(card);
      });
    }

    function openCharacter(c) {
      try {
        sessionStorage.setItem('yours_current_character', JSON.stringify(c));
      } catch (e) {}
      // Inside the desktop shell, the profile lives in its own pane.
      if (window.ysPane && window.ysNotify) { window.ysNotify('open-profile'); return; }
      window.location.href = 'character-profile.html';
    }

    // ---- Tabs ----
    var tabs = document.querySelectorAll('.discover-tab');
    var panels = document.querySelectorAll('[data-panel]');

    function activateTab(name) {
      tabs.forEach(function (t) {
        var on = t.getAttribute('data-tab') === name;
        t.classList.toggle('active', on);
        t.classList.toggle('bg-app-accent', on);
        t.classList.toggle('text-white', on);
        t.classList.toggle('bg-app-surface', !on);
        t.classList.toggle('text-app-primary', !on);
      });
      panels.forEach(function (p) {
        p.classList.toggle('hidden', p.getAttribute('data-panel') !== name);
      });
      if (name === 'liked') loadLiked();
    }

    tabs.forEach(function (t) {
      t.addEventListener('click', function () { activateTab(t.getAttribute('data-tab')); });
    });

    // ---- Liked tab (default) ----
    var likedGrid = document.getElementById('liked-grid');
    var likedEmpty = document.getElementById('liked-empty');

    function loadLiked() {
      var user = null;
      try { user = API ? API.getCurrentUser() : null; } catch (e) {}
      if (!user || !user.id) {
        likedGrid.innerHTML = '';
        likedGrid.classList.add('hidden');
        likedEmpty.classList.remove('hidden');
        return;
      }
      likedGrid.classList.remove('hidden');
      likedEmpty.classList.add('hidden');
      API.getSavedCharacters(user.id).then(function (res) {
        var chars = (res && res.characters) || [];
        if (!chars.length) {
          likedGrid.innerHTML = '';
          likedGrid.classList.add('hidden');
          likedEmpty.classList.remove('hidden');
          return;
        }
        renderInto(likedGrid, chars, false);
      }).catch(function () {
        likedGrid.innerHTML = '<p class="text-sm text-app-secondary py-8">Could not load your likes. Try again.</p>';
      });
    }

    // ---- Other tabs: shared character list (cached per session) ----
    var allCharsCache = null;
    function getAllChars() {
      if (allCharsCache) return Promise.resolve(allCharsCache);
      if (!API) return Promise.resolve([]);
      return API.getPublicCharacters().then(function (res) {
        allCharsCache = (res && res.characters) || [];
        return allCharsCache;
      }).catch(function () { return []; });
    }

    function tabRenderer(name, elId) {
      return function () {
        var el = document.getElementById(elId);
        getAllChars().then(function (list) {
          var out = list;
          if (name === 'realistic') out = list.filter(function (c) { return c.art_style === 'realistic'; });
          if (name === 'anime') out = list.filter(function (c) { return c.art_style === 'anime'; });
          renderInto(el, out, false);
        });
      };
    }

    var foryouEl = document.getElementById('foryou-grid');
    getAllChars().then(function (list) { renderInto(foryouEl, list, false); });

    document.querySelectorAll('[data-panel]').forEach(function (p) {
      var name = p.getAttribute('data-panel');
      if (name === 'foryou' || name === 'popular' || name === 'realistic' || name === 'anime') {
        var gridId = name + '-grid';
        var el = document.getElementById(gridId);
        getAllChars().then(function () { tabRenderer(name, gridId)(); });
      }
    });

    // ---- Search: filter the currently visible panel ----
    var search = document.getElementById('discover-search');
    if (search) {
      search.addEventListener('input', function () {
        var q = (search.value || '').trim().toLowerCase();
        if (!q) {
          // Re-render active panel with defaults
          var active = document.querySelector('.discover-tab.active');
          if (active) activateTab(active.getAttribute('data-tab'));
          return;
        }
        getAllChars().then(function (list) {
          var filtered = list.filter(function (c) {
            return ((c.name || '') + ' ' + (c.about || '') + ' ' + (c.description || '')).toLowerCase().indexOf(q) !== -1;
          });
          var active = document.querySelector('.discover-tab.active');
          var name = active ? active.getAttribute('data-tab') : 'foryou';
          var el = document.getElementById(name === 'liked' ? 'liked-grid' : name + '-grid');
          if (el && name !== 'liked') renderInto(el, filtered, false);
        });
      });
    }

    // ---- Live wallet balance (kept in sync with other pages) ----
    function loadBalance() {
      var user = null;
      try { user = API ? API.getCurrentUser() : null; } catch (e) {}
      // Guests: swap the cash pill for the signup offer.
      var wallet = document.getElementById('disc-wallet');
      var offer = document.getElementById('disc-guest-offer');
      if (!user || !user.id) {
        if (wallet) wallet.style.display = 'none';
        if (offer) offer.style.display = 'flex';
        return;
      }
      if (wallet) wallet.style.display = 'flex';
      if (offer) offer.style.display = 'none';
      API.getWallet(user.id).then(function (res) {
        var el = document.getElementById('disc-balance');
        if (res && res.wallet && res.wallet.credits != null && el) {
          el.textContent = Math.floor(Number(res.wallet.credits)).toLocaleString();
        }
      }).catch(function () {});
    }
    loadBalance();

    // Default tab = For you
    activateTab('foryou');
  })();
</script>
