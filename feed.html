<!DOCTYPE html><html lang="en" style=""><head>

<style data-purpose="custom-styles">
        body {
            background-color: #000; /* For mobile device feel outside safe area */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
        }

        #app-container {
            width: 100%;
            min-height: 100dvh;
            max-width: 430px; /* Max width for mobile feel */
            position: relative;
            background-color: #1a1a1a;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
        }

        /* Custom Font for Logo (Approximation) */
        .brand-logo {
            font-family: 'Arial Black', Gadget, sans-serif;
            background: -webkit-linear-gradient(#ff6b6b, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        .bottom-nav-bg {
            background: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item-active {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
    </style>
</head>

<!-- BEGIN: AppContainer -->

<!-- Background Image -->
