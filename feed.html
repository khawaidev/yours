<script>
  (function () {
    // Swipe guide: cycles through the 3 hand-gesture steps, dismissible.
    var guide = document.getElementById('swipe-guide');
    if (!guide) return;
    var steps = guide.querySelectorAll('.guide-step');
    var dots = guide.querySelectorAll('.guide-dot');
    var current = 0;
    var timer = null;

    function showStep(i) {
      steps.forEach(function (s, idx) { s.classList.toggle('guide-active', idx === i); });
      dots.forEach(function (d, idx) { d.classList.toggle('guide-dot-active', idx === i); });
    }

    function dismiss() {
      if (timer) clearInterval(timer);
      guide.classList.add('guide-hidden');
      setTimeout(function () {
        if (guide.parentNode) guide.parentNode.removeChild(guide);
      }, 450);
    }

    // Auto-advance the steps so users see all three gestures, then stop
    // on the final step (swipe up) so the guide feels complete.
    function advance() {
      if (current >= steps.length - 1) {
        clearInterval(timer);
        return;
      }
      current = current + 1;
      showStep(current);
    }
    timer = setInterval(advance, 3000);

    // Dismiss on "Got it" or by tapping the backdrop.
    guide.addEventListener('click', function (e) {
      if (e.target.closest('#guide-gotit') || e.target.closest('[data-guide-dismiss]')) dismiss();
    });
  })();
</script>

      cacheViewedCharacter(c);
      var seq = ++renderSeq;
      var feedMedia = c.character_feeds && c.character_feeds.length ? c.character_feeds[0] : null;
      var isVideo = !!(feedMedia && feedMedia.media_type === 'video');
      var bgUrl = feedMedia ? feedMedia.media_url : (c.circular_profile_image_url || '');
      var committed = false;

      function commit() {
        if (committed) return;
        committed = true;
        if (seq !== renderSeq) return;
        paint(c);
        hideSkeleton();
      }

      showSkeleton();
      if (isVideo) {
        var probe = document.createElement('video');
        probe.preload = 'auto';
        probe.onloadeddata = commit;
        probe.onerror = commit;
        probe.src = bgUrl;
      } else {
        Promise.all([preloadImage(bgUrl), preloadImage(c.circular_profile_image_url)]).then(commit);
      }
      setTimeout(commit, 2500);
    }

    function render() {
      if (!characters.length) {
        renderSeq++;
        if (skeletonEl) skeletonEl.style.display = 'none';
        profileEl.innerHTML =
          '<div class="text-center py-10"><p class="text-white/80">No characters match your interests yet.</p>' +
          '<p class="text-white/50 text-sm mt-1">Check back soon — new characters are added every day.</p></div>';
        bgImg.style.display = 'none';
        bgVideo.style.display = 'none';
        return;
      }
      showCharacter(characters[current]);
    }

    function wire() {
      var avatar = document.getElementById('feed-avatar');
      if (avatar) avatar.addEventListener('click', function () {
        sessionStorage.setItem('yours_current_character', JSON.stringify(characters[current]));
        window.location.href = 'character-profile.html';
      });
      var chatBtn = document.getElementById('feed-chat-btn');
      if (chatBtn) chatBtn.addEventListener('click', function () {
        sessionStorage.setItem('yours_current_character', JSON.stringify(characters[current]));
        window.location.href = 'messaging.html';
      });
      var loveBtn = document.getElementById('feed-love-btn');
      if (loveBtn) loveBtn.addEventListener('click', function () {
        if (window.spawnLoveHeart) spawnLoveHeart(loveBtn);
      });
    }

    var allCharsRef = [];
    var appendedOthers = false;

    function go(step) {
      if (!characters.length) return;
      if (step < 0) {
        if (current <= 0) return;
        current -= 1;
        render();
        return;
      }
      if (current + 1 < characters.length) {
        current += 1;
        render();
        return;
      }
      // Reached the right end: if filtered, append remaining categories from allCharsRef
      if (!appendedOthers && allCharsRef.length > characters.length) {
        var seen = {};
        characters.forEach(function (c) { if (c && c.id) seen[c.id] = true; });
        var others = allCharsRef.filter(function (c) { return c && !seen[c.id]; });
        if (others.length) {
          appendedOthers = true;
          characters = characters.concat(others);
          current += 1;
          render();
          return;
        }
      }
      // All characters ended: wrap back to the start
      current = 0;
      render();
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    // ---- Swipe on the page to move between characters ----
    // Swipe right (dx > 0) -> next/new character; swipe left (dx < 0) -> previous viewed character.
    var touchX = null;
    document.addEventListener('touchstart', function (e) { touchX = e.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) go(dx > 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    // ---- Load matched characters (auth-only) ----
    async function init() {
      var session = (await supabase.auth.getSession()).data.session;
      if (!session) { window.location.href = 'auth.html'; return; }

      // 1) User's profile / onboarding preferences (may not exist yet)
      var { data: profile, error: profileErr } = await supabase
        .from('user_profiles')
        .select('age_interest, personality_interest, art_style, women_type_interest')
        .eq('id', session.user.id)
        .maybeSingle();
      if (profileErr) console.warn('profile fetch failed', profileErr);

      // 2) Pull all public characters (same source as Discover)
      var chars = null;
      if (window.YoursAPI && YoursAPI.getPublicCharacters) {
        try {
          var res = await YoursAPI.getPublicCharacters();
          chars = (res && res.characters) || null;
        } catch (e) { console.warn('API.getPublicCharacters failed', e); }
      }
      if (!chars) {
        var { data: sbChars } = await supabase
          .from('characters')
          .select('id,name,age,about,gender,personality,message_style,art_style,voice_id,circular_profile_image_url,verified,character_feeds(media_url,media_type)')
          .eq('is_active', true);
        chars = sbChars;
      }

      if (!chars || !chars.length) { render(); return; }

      // 3) Personality preference is stored with the same enum vocabulary as
      //    the characters.personality column ('the_sweetheart', 'the_tease',
      //    'the_dominant', 'the_submissive', 'the_mysterious') — compare directly.
      var preferredPersonality = (profile && profile.personality_interest) || null;

      function score(c) {
        var s = 0;
        if (preferredPersonality && c.personality === preferredPersonality) s += 0.5;
        if (profile && profile.art_style && c.art_style === profile.art_style) s += 0.2;
        if (profile && profile.age_interest) {
          // Age classifier: under 30 is young, 30 and above is mature.
          var isYoung = c.age < 30;
          if ((profile.age_interest === 'young' && isYoung) || (profile.age_interest === 'mature' && !isYoung)) s += 0.2;
        }
        return s;
      }

      // Every active character is shown, ranked by the preference scores.
      // Preferences only reorder the feed: they never hide characters whose
      // art style or age does not match (Discover shows those too).
      var allChars = chars
        .map(function (c) { return Object.assign({}, c, { score: score(c) }); })
        .sort(function (a, b) { return b.score - a.score; });
      allCharsRef = allChars;
      // Refresh viewedCache entries with latest backend character data
      if (viewedCache.length) {
        var freshById = {};
        allChars.forEach(function (c) { if (c && c.id) freshById[c.id] = c; });
        viewedCache = viewedCache.map(function (c) { return (c && c.id && freshById[c.id]) ? freshById[c.id] : c; });
        try { sessionStorage.setItem(VIEWED_CACHE_KEY, JSON.stringify(viewedCache)); } catch (e) {}
      }

      var activeFilters = { age: 'any', style: 'any', status: 'any' };
      var filterModal = document.getElementById('feed-filter-modal');
      var filterBtn = document.getElementById('feed-filter-btn');
      var filterClose = document.getElementById('feed-filter-close');
      var filterBackdrop = document.getElementById('feed-filter-backdrop');
      var filterDot = document.getElementById('feed-filter-dot');

      function openFilterModal() {
        if (!filterModal) return;
        filterModal.classList.remove('hidden');
        filterModal.classList.add('flex');
      }
      function closeFilterModal() {
        if (!filterModal) return;
        filterModal.classList.add('hidden');
        filterModal.classList.remove('flex');
      }
      if (filterBtn) filterBtn.addEventListener('click', openFilterModal);
      if (filterClose) filterClose.addEventListener('click', closeFilterModal);
      if (filterBackdrop) filterBackdrop.addEventListener('click', closeFilterModal);

      function applyFilters() {
        appendedOthers = false;
        characters = allChars.filter(function (c) {
          if (activeFilters.age !== 'any') {
            var charAge = parseInt(c.age, 10) || 0;
            if (activeFilters.age === 'young' && !(charAge < 30)) return false;
            if (activeFilters.age === 'mature' && !(charAge >= 30)) return false;
          }
          if (activeFilters.style !== 'any') {
            var charStyle = (c.art_style || '').toLowerCase();
            if (charStyle !== activeFilters.style) return false;
          }
          if (activeFilters.status !== 'any') {
            var isVerified = c.verified === true;
            if (activeFilters.status === 'verified' && !isVerified) return false;
            if (activeFilters.status === 'none' && isVerified) return false;
          }
          return true;
        });
        if (filterDot) {
          var hasFilter = activeFilters.age !== 'any' || activeFilters.style !== 'any' || activeFilters.status !== 'any';
          filterDot.classList.toggle('hidden', !hasFilter);
        }
        current = 0;
        render();
      }

      document.querySelectorAll('.feed-filter-opt').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-filter');
          var val = btn.getAttribute('data-value');
          activeFilters[key] = val;
          document.querySelectorAll('.feed-filter-opt[data-filter="' + key + '"]').forEach(function (b) {
            var isSel = b.getAttribute('data-value') === val;
            b.classList.toggle('bg-[#e11d48]', isSel);
            b.classList.toggle('bg-white/10', !isSel);
            b.classList.toggle('text-white', isSel);
            b.classList.toggle('text-white/70', !isSel);
          });
          applyFilters();
        });
      });

      applyFilters();
    }

    init();
  })();
</script>
<script src="js/animations.js"></script>

<script src="js/pwa.js"></script>
</body></html>
