<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Create Your Companion - Details | Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body class="ds-page" data-active-nav="create" data-topbar-title="Create">

<div class="ds-layout">
  <div id="ds-sidebar"></div>

  <div class="ds-content-col">
    <div id="ds-topbar"></div>

    <main class="ds-main">
      <!-- ================= CREATE STAGE 5 / DETAILS ================= -->
      <section class="cc-wrap" aria-label="Details preferences">
        <div class="cc-progress" role="progressbar" aria-valuenow="83" aria-valuemin="0" aria-valuemax="100" aria-label="Creation progress">
          <div class="cc-progress-fill" style="width: 83.33%"></div>
        </div>

        <!-- Stage5: matches stage5-ui.png -->
        <div class="s5-name-row">
          <div class="s5-field">
            <label for="cc-name">Character Name</label>
            <input class="s5-name-input" id="cc-name" type="text" maxlength="24" placeholder="Seraphina Desire" value="Seraphina Desire" autocomplete="off">
          </div>
          <div class="s5-field">
            <label>Age</label>
            <div class="s5-age-row" role="radiogroup" aria-label="Age" data-group="age">
              <button type="button" class="s5-age-num" data-value="21">21</button>
              <button type="button" class="s5-age-num" data-value="22">22</button>
              <button type="button" class="s5-age-num is-selected" data-value="23">23</button>
              <button type="button" class="s5-age-num" data-value="24">24</button>
              <button type="button" class="s5-age-num" data-value="25">25</button>
            </div>
          </div>
        </div>

        <div class="s5-hint">
          <strong>Personality Details</strong>
          <span>click to change</span>
        </div>

        <div class="s5-details-grid">
          <button type="button" class="s5-card" data-group="voice" data-value="Hottie" aria-label="Voice: Hottie">
            <span class="s5-card-icon is-play"><i class="fa-solid fa-play" style="font-size:12px; margin-left:2px"></i></span>
            <span class="s5-card-meta"><small>Voice</small><strong>Hottie</strong></span>
            <span class="s5-card-wave" aria-hidden="true">
              <i style="height:4px"></i><i style="height:9px"></i><i style="height:6px"></i><i style="height:11px"></i><i style="height:5px"></i><i style="height:8px"></i><i style="height:4px"></i><i style="height:10px"></i><i style="height:6px"></i><i style="height:7px"></i>
            </span>
          </button>
          <button type="button" class="s5-card" data-group="personality" data-value="Sweet" aria-label="Personality: Sweet">
            <span class="s5-card-icon is-pink"><i class="fa-solid fa-heart"></i></span>
            <span class="s5-card-meta"><small>Personality</small><strong>Sweet</strong></span>
          </button>
          <button type="button" class="s5-card" data-group="occupation" data-value="Stripper" aria-label="Occupation: Stripper">
            <span class="s5-card-icon is-pink"><i class="fa-solid fa-people-group"></i></span>
            <span class="s5-card-meta"><small>Occupation</small><strong>Stripper</strong></span>
          </button>
          <button type="button" class="s5-card" data-group="relationship" data-value="Lover" aria-label="Relationship: Lover">
            <span class="s5-card-icon is-pink"><i class="fa-solid fa-heart-circle-check"></i></span>
            <span class="s5-card-meta"><small>Relationship</small><strong>Lover</strong></span>
          </button>
          <button type="button" class="s5-card" data-group="hobby" data-value="None" aria-label="Hobby: None">
            <span class="s5-card-icon"><i class="fa-solid fa-ban"></i></span>
            <span class="s5-card-meta"><small>Hobby</small><strong>None</strong></span>
          </button>
          <button type="button" class="s5-card" data-group="fetish" data-value="None" aria-label="Fetish: None">
            <span class="s5-card-icon"><i class="fa-solid fa-ban"></i></span>
            <span class="s5-card-meta"><small>Fetish</small><strong>None</strong></span>
          </button>
        </div>

        <button type="button" class="s5-advanced" id="s5-advanced">
          Advanced Details <span>(optional)</span> <i class="fa-solid fa-chevron-down" style="margin-left:auto; color:var(--ds-muted); font-size:12px"></i>
        </button>

        <div class="cc-nav" style="justify-content: space-between;">
          <a class="cc-back" href="desktop-create-stage4.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back</a>
          <div class="s5-next-wrap" style="margin-top:0;">
            <button type="button" class="s5-next" id="continue-btn">Next <small><i class="fa-solid fa-gem"></i> 5</small></button>
          </div>
          <span style="width:92px;"></span>
        </div>

        <!-- Popup for detail selection -->
        <div class="s5-modal" id="s5-modal" aria-hidden="true">
          <div class="s5-modal-backdrop" id="s5-modal-backdrop"></div>
          <div class="s5-modal-card" role="dialog" aria-modal="true" aria-labelledby="s5-modal-title">
            <div class="s5-modal-head">
              <strong id="s5-modal-title">Select</strong>
              <button type="button" class="s5-modal-close" id="s5-modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="s5-option-grid" id="s5-modal-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <footer id="ds-footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api-client.js"></script>
<script src="js/desktop-ui.js"></script>
<script src="js/create-funnel.js"></script>
<script>
(function () {
  'use strict';

  var prefs = YoursCreate.prefs();
  var nameInput = document.getElementById('cc-name');
  if (prefs.name) nameInput.value = prefs.name;

  // Restore age from prefs (map number to button)
  var ageToSelect = prefs.age ? String(prefs.age) : '23';
  document.querySelectorAll('[data-group="age"] [data-value]').forEach(function (b) {
    b.classList.toggle('is-selected', b.getAttribute('data-value') === ageToSelect);
  });

  // Restore detail cards from prefs
  ['voice','personality','occupation','relationship','hobby','fetish'].forEach(function (g) {
    if (prefs[g]) {
      var card = document.querySelector('.s5-card[data-group="'+g+'"]');
      if (card) {
        card.setAttribute('data-value', prefs[g]);
        var strong = card.querySelector('strong');
        if (strong) strong.textContent = prefs[g];
      }
    }
  });

  YoursCreate.bindChipGroups();

  // Popup for detail cards
  var detailOptions = {
    voice: ['Hottie','Soft','Sultry','Sweet','Playful','Bratty','Sultry','Elegant'],
    personality: ['Sweet','Shy','Witty','Confident','Submissive','Dominant','Flirty','Caring'],
    occupation: ['Stripper','Student','Model','Nurse','Teacher','Dancer','None'],
    relationship: ['Lover','Girlfriend','Wife','Fling','Mistress','Friend','Crush'],
    hobby: ['None','Gaming','Yoga','Reading','Travel','Dance','Music'],
    fetish: ['None','Feet','BDSM','Roleplay','Voyeur','Custom','Latex']
  };
  var detailIcons = {
    voice: 'fa-microphone', personality: 'fa-heart', occupation: 'fa-briefcase',
    relationship: 'fa-heart-circle-check', hobby: 'fa-gamepad', fetish: 'fa-mask'
  };
  var modal = document.getElementById('s5-modal');
  var modalGrid = document.getElementById('s5-modal-grid');
  var modalTitle = document.getElementById('s5-modal-title');
  var activeCard = null;

  function openModal(card) {
    activeCard = card;
    var group = card.getAttribute('data-group');
    var opts = detailOptions[group] || [];
    var cur = card.getAttribute('data-value');
    modalTitle.textContent = group.charAt(0).toUpperCase() + group.slice(1);
    modalGrid.innerHTML = '';
    opts.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 's5-option' + (opt === cur ? ' is-selected' : '');
      btn.setAttribute('data-value', opt);
      btn.innerHTML = '<i class="fa-solid ' + (detailIcons[group] || 'fa-star') + '"></i> ' + opt;
      btn.addEventListener('click', function () {
        activeCard.setAttribute('data-value', opt);
        var strong = activeCard.querySelector('strong');
        if (strong) strong.textContent = opt;
        closeModal();
      });
      modalGrid.appendChild(btn);
    });
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
  }
  function closeModal() {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    activeCard = null;
  }
  document.querySelectorAll('.s5-card[data-group]').forEach(function (card) {
    card.addEventListener('click', function () { openModal(card); });
  });
  document.getElementById('s5-modal-backdrop').addEventListener('click', closeModal);
  document.getElementById('s5-modal-close').addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal(); });

  // Advanced details toggle (placeholder)
  document.getElementById('s5-advanced').addEventListener('click', function () {
    this.querySelector('i').classList.toggle('fa-chevron-down');
    this.querySelector('i').classList.toggle('fa-chevron-up');
  });

  function finalise() {
    // Collect age
    var ageSel = document.querySelector('[data-group="age"] .is-selected[data-value]');
    var ageVal = ageSel ? parseInt(ageSel.getAttribute('data-value'), 10) : 23;

    // Collect detail cards
    var detailVals = {};
    document.querySelectorAll('.s5-card[data-group]').forEach(function (c) {
      detailVals[c.getAttribute('data-group')] = c.getAttribute('data-value');
    });

    YoursCreate.save(detailVals);
    YoursCreate.save({
      name: nameInput.value.trim() || 'Seraphina Desire',
      age: ageVal
    });

    var all = YoursCreate.prefs();
    // For demo, go to stage 6 instead of completing
    window.location.href = 'desktop-create-stage6.html';
  }

  document.getElementById('continue-btn').addEventListener('click', finalise);
})();
</script>
</body>
</html>
