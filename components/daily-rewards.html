<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Daily Reward Disk</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../css/app.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'modal-bg': '#1a1a1a',
            'card-bg': '#2a2a2a',
            'accent-green': '#65c466',
            'pro-text': '#888888',
          },
          borderRadius: { '4xl': '2rem' }
        }
      }
    }
  </script>
</head>
<body class="bg-black h-screen w-full overflow-hidden relative app-page">
<!-- BEGIN: Rewards Bottom Sheet (slide-up from bottom) -->
<main id="reward-sheet" class="relative z-10 w-full max-w-md bg-modal-bg rounded-t-4xl h-[85vh] absolute bottom-0 flex flex-col p-6 shadow-2xl"
      style="transition: transform .35s cubic-bezier(0.22,1,0.36,1); transform: translateY(100%);">
  <!-- Drag Handle -->
  <div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-4"></div>
  <!-- Header -->
  <header class="text-center mt-6 mb-1">
    <h1 class="text-4xl font-extrabold text-white leading-tight mb-2">Your Daily<br>Reward</h1>
  </header>
  <!-- Coin graphic (4th plan image from the recharge page, 3x oversized) -->
  <div class="relative h-[300px] overflow-hidden flex items-center justify-center" style="margin-top:2px;margin-bottom:6px;">
    <img alt="Love tokens" class="h-[528px] w-[528px] object-contain drop-shadow-xl max-w-none"
         src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/37.74908936625081.png">
  </div>
  <!-- 7-day reward disk -->
  <section id="reward-days" class="flex space-x-3 overflow-x-auto pb-4 snap-x hide-scrollbar" style="scrollbar-width:none;-ms-overflow-style:none;"></section>
  <!-- Action: free claim + pro 2x claim -->
  <footer class="flex space-x-3 mt-4 mb-2">
    <button id="reward-claim-free-btn" class="flex-1 bg-[#3a3a3a] text-white font-bold text-lg py-4 rounded-2xl active:scale-95 transition-transform cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" type="button">Claim</button>
    <button id="reward-claim-pro-btn" class="flex-1 bg-white text-black font-bold text-lg py-4 rounded-2xl active:scale-95 transition-transform cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" type="button">2x PRO</button>
  </footer>
</main>
<!-- END: Rewards Bottom Sheet -->
<style>
  .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>

<script src="../js/api-client.js"></script>
<script src="../js/animations.js"></script>
<script>
  // Self-contained reward disk. In the feeds page this sheet is injected into
  // index.html and controlled there; here it doubles as a live preview that
  // falls back to sample data so the component renders standalone.
  (function () {
    var sheet = document.getElementById('reward-sheet');
    var daysEl = document.getElementById('reward-days');
    var freeBtn = document.getElementById('reward-claim-free-btn');
    var proBtn = document.getElementById('reward-claim-pro-btn');
    var API = (typeof window.YoursAPI !== 'undefined') ? window.YoursAPI : null;
    var FALLBACK_REWARDS = [25, 25, 25, 50, 50, 75, 100];
    var state = null;

    function open() { requestAnimationFrame(function () { sheet.style.transform = 'translateY(0)'; }); }
    function close() { sheet.style.transform = 'translateY(100%)'; }

    function currentUser() {
      if (!API) return null;
      try { return API.getCurrentUser(); } catch (e) { return null; }
    }
    function isPro() {
      try { return localStorage.getItem('yours_plan') === 'pro'; } catch (e) { return false; }
    }
    function tokenIcon() {
      return 'https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/slazzer-preview-z0bt9.png';
    }

    function renderDays() {
      var rewards = state.rewards || FALLBACK_REWARDS;
      daysEl.innerHTML = '';
      for (var i = 1; i <= 7; i++) {
        var amount = rewards[i - 1];
        var claimed = i <= state.claimedCount;
        var current = !state.claimedToday && i === state.cycleDay;
        var card = document.createElement('article');
        card.className = 'flex-none w-[88px] rounded-2xl p-3 flex flex-col items-center justify-center snap-center transition-all ' +
          (claimed ? 'bg-card-bg border border-gray-700 opacity-50'
           : current ? 'bg-white shadow-lg border border-white scale-105'
           : 'bg-card-bg border border-gray-700 opacity-70');
        card.innerHTML =
          '<span class="text-xs font-bold mb-1 ' + (current ? 'text-black' : 'text-white') + '">Day ' + i + '</span>' +
          '<div class="flex items-center justify-center gap-1 mb-1">' +
            (claimed
              ? '<i class="fa-solid fa-check text-green-400"></i>'
              : '<span class="text-2xl font-extrabold ' + (current ? 'text-black' : 'text-white') + '">' + amount + '</span>' +
                '<img alt="" class="w-5 h-5 object-contain" src="' + tokenIcon() + '">') +
          '</div>' +
          '<span class="text-[10px] font-bold text-center leading-tight ' + (current ? 'text-black' : 'text-pro-text') + '">' +
            (claimed ? 'Claimed' : 'Tokens') +
          '</span>';
        daysEl.appendChild(card);
      }
      var canClaim = state.canClaim;
      freeBtn.disabled = !canClaim;
      proBtn.disabled = !canClaim;
      if (canClaim) {
        var amount = rewards[state.cycleDay - 1];
        freeBtn.textContent = 'Claim ' + amount + ' Tokens';
        proBtn.textContent = 'Claim ' + (amount * 2) + ' PRO';
      } else {
        freeBtn.textContent = 'Claimed for Today';
        proBtn.textContent = 'Claimed for Today';
      }
    }

    function updateBalance(res) {
      if (!res || !res.wallet || res.wallet.credits == null) return;
      try {
        var b = document.getElementById('feed-wallet-balance');
        if (b) b.textContent = Math.floor(Number(res.wallet.credits)).toLocaleString();
      } catch (e) {}
    }

    function claimAs(pro) {
      var user = currentUser();
      if (!user || !user.id || !API || !API.claimDailyReward) return;
      var btn = pro ? proBtn : freeBtn;
      btn.disabled = true;
      API.claimDailyReward(user.id, pro).then(function (res) {
        updateBalance(res);
        if (res && res.claimed) {
          var info = document.createElement('div');
          info.className = 'w-full text-center text-white font-extrabold py-4 rounded-2xl bg-green-600/80';
          info.textContent = 'Claimed! +' + res.claimed.amount + ' Tokens';
          btn.parentNode.innerHTML = '';
          btn.parentNode.appendChild(info);
          setTimeout(close, 900);
        } else {
          btn.disabled = false;
        }
      }).catch(function () { btn.disabled = false; });
    }

    function openPremium() {
      try { sessionStorage.setItem('yours_prev_page', 'index.html'); } catch (e) {}
      window.location.href = 'premium-acess.html';
    }

    freeBtn.addEventListener('click', function () { if (state && state.canClaim) claimAs(false); });
    proBtn.addEventListener('click', function () {
      if (!state || !state.canClaim) return;
      if (isPro()) claimAs(true); else openPremium();
    });

    function load() {
      var user = currentUser();
      if (user && user.id && API && API.getDailyReward) {
        API.getDailyReward(user.id).then(function (res) {
          if (!res || !res.reward) return;
          state = res.reward;
          renderDays();
          if (state.canClaim) open();
        }).catch(function () {});
      } else {
        // Standalone preview with sample state.
        state = { canClaim: true, claimedToday: false, cycleDay: 1, claimedCount: 0, rewards: FALLBACK_REWARDS };
        renderDays();
        open();
      }
    }

    load();
  })();
</script>
</body></html>
