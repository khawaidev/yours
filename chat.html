<script>
(function () {
  // Same project config as auth.html / feed.html
  var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var list = document.getElementById('chat-list');
  var emptyEl = document.getElementById('chat-list-empty');
  var searchInput = document.getElementById('chat-search');
  var allConversations = [];

  // ---- Filter pills (All / Favorites) ----
  var pills = document.querySelectorAll('[data-filter-pill]');
  var activePill = 'all';
  for (var i = 0; i < pills.length; i++) {
    pills[i].addEventListener('click', function () {
      for (var j = 0; j < pills.length; j++) {
        pills[j].classList.remove('bg-white/50', 'text-white', 'font-bold');
        pills[j].classList.add('text-white/60');
      }
      this.classList.add('bg-white/50', 'text-white', 'font-bold');
      this.classList.remove('text-white/60');
      activePill = this.getAttribute('data-pill');
      render();
    });
  }

  // "All" shows every character; "Favorites" shows the ones the user has sent
  // a gift to / leveled up with (persisted per-user charisma).
  function isFavorite(c) {
    if (!c.charisma) return false;
    return c.charisma.some(function (row) { return row.level > 0; });
  }

  function openChat(c) {
    if (window.ysOpenChat) { window.ysOpenChat(c); return; }
    sessionStorage.setItem('yours_current_character', JSON.stringify(c));
    window.location.href = 'messaging.html';
  }

  // "x" minutes ago style relative time.
  function timeAgo(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff) || diff < 0) return '';
    var m = Math.floor(diff / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h';
    var d = Math.floor(h / 24);
    if (d < 7) return d + 'd';
    var w = Math.floor(d / 7);
    if (w < 5) return w + 'w';
    var mo = Math.floor(d / 30);
    if (mo < 12) return mo + 'mo';
    return Math.floor(d / 365) + 'y';
  }

  // Shorten long messages for the row subtitle.
  function preview(text) {
    var original = (text || '').trim();
    if (!original) return 'Say hi and start a conversation.';
    // Drop roleplay/action segments wrapped in asterisks (e.g. "*smiles*").
    text = original.replace(/\*[^*]+(\*|$)/g, ' ').replace(/\s+/g, ' ').trim();
    if (!text) return '';
    return text.length > 55 ? text.slice(0, 55) + '…' : text;
  }

  function render() {
    var q = (searchInput.value || '').trim().toLowerCase();
    var visible = allConversations.filter(function (conv) {
      var c = conv.character || {};
      if (activePill === 'favorites' && !isFavorite(c)) return false;
      if (c.gender === 'men') return false;
      if (q && c.name && c.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    list.querySelectorAll('.chat-row:not(#chat-list-empty)').forEach(function (el) { el.remove(); });
    if (!visible.length) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    visible.forEach(function (conv) {
      var c = conv.character || {};
      var lastMsgs = Array.isArray(conv.last_message) ? conv.last_message : [];
      var lastMsg = lastMsgs.slice().sort(function (a, b) {
        return new Date(b.created_at) - new Date(a.created_at);
      })[0] || null;
      var ts = (lastMsg && lastMsg.created_at) || conv.last_message_at;
      var isUser = lastMsg && lastMsg.sender_type === 'user';
      var sub = lastMsg ? (isUser ? 'You: ' : '') + preview(lastMsg.content) : preview('');
      var row = document.createElement('div');
      row.className = 'chat-row flex items-center gap-3 py-3 px-2 rounded-2xl hover:bg-surface-container transition-colors cursor-pointer relative';
      row.innerHTML =
        '<button class="relative shrink-0 rounded-full p-[2.5px] bg-gradient-to-r from-[#ff7e5f] to-[#ff4d6d] active:scale-95 transition-transform" data-avatar-btn="1" type="button"><span class="block bg-[#131313] rounded-full p-[2.5px]"><img class="w-[56px] h-[56px] rounded-full object-cover" alt="' + (c.name || '') + ' avatar" src="' + (c.circular_profile_image_url || '') + '"></span></button>' +
        '<div class="flex-1 min-w-0" data-msg-btn="1"><div class="flex justify-between items-baseline mb-1">' +
        '<h3 class="font-label-md text-label-md text-white truncate pr-2">' + (c.name || 'Unknown') + '</h3>' +
        '<span class="font-label-sm text-label-sm text-white/40 shrink-0">' + timeAgo(ts) + '</span></div>' +
        '<p class="font-body-md text-body-md text-white/70 truncate">' + sub + '</p></div>';
      row.addEventListener('click', function (e) {
        var avatar = e.target.closest('[data-avatar-btn="1"]');
        if (avatar) {
          e.stopPropagation();
          sessionStorage.setItem('yours_current_character', JSON.stringify(c));
          if (window.ysPane) { window.ysNotify('open-profile'); return; }
          window.location.href = 'character-profile.html';
        } else {
          openChat(c);
        }
      });
      list.appendChild(row);
    });
  }

  var newChatBtn = document.getElementById('new-chat-btn');
  if (newChatBtn) newChatBtn.addEventListener('click', function () { window.location.href = 'index.html'; });

  // ---- Search: live results from the DB character catalog ----
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  var allCharsCache = null;
  function getAllChars() {
    if (allCharsCache) return Promise.resolve(allCharsCache);
    return window.YoursAPI.getPublicCharacters().then(function (res) {
      allCharsCache = (res && res.characters) || [];
      return allCharsCache;
    }).catch(function () { return []; });
  }

  function avatarImage(c) {
    if (c.circular_profile_image_url) return c.circular_profile_image_url;
    if (c.character_feeds && c.character_feeds.length) return c.character_feeds[0].media_url || '';
    return '';
  }

  var searchEl = document.getElementById('chat-search');
  var resultsEl = document.getElementById('chat-results');
  var resultsEmpty = document.getElementById('chat-results-empty');
  var filtersSection = document.getElementById('chat-filters');
  var listSection = document.getElementById('chat-list');

  function renderSearchResults(chars) {
    resultsEl.querySelectorAll('.chat-row').forEach(function (el) { el.remove(); });
    if (!chars || !chars.length) {
      resultsEmpty.style.display = 'block';
      return;
    }
    resultsEmpty.style.display = 'none';
    chars.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'chat-row flex items-center gap-3 py-3 px-2 rounded-2xl hover:bg-surface-container transition-colors cursor-pointer relative';
      var nameAge = (c.name || 'Unknown') + (c.age ? ', ' + c.age : '');
      var sub = (c.about || c.description || c.personality || '').replace(/\s+/g, ' ').trim() || 'Tap to start a chat';
      var img = avatarImage(c);
      row.innerHTML =
        '<button class="relative shrink-0 rounded-full p-[2.5px] bg-gradient-to-r from-[#ff7e5f] to-[#ff4d6d] active:scale-95 transition-transform" type="button"><span class="block bg-[#131313] rounded-full p-[2.5px]"><img class="w-[56px] h-[56px] rounded-full object-cover" alt="' + esc(c.name || '') + ' avatar" src="' + esc(img) + '"></span></button>' +
        '<div class="flex-1 min-w-0"><h3 class="font-label-md text-label-md text-white truncate pr-2">' + esc(nameAge) + '</h3>' +
        '<p class="font-body-md text-body-md text-white/70 truncate">' + esc(preview(sub)) + '</p></div>';
      row.addEventListener('click', function () { openChat(c); });
      resultsEl.appendChild(row);
    });
  }

  function setSearchMode(active) {
    resultsEl.style.display = active ? 'flex' : 'none';
    if (filtersSection) filtersSection.style.display = active ? 'none' : '';
    if (listSection) listSection.style.display = active ? 'none' : '';
    if (!active && emptyEl) emptyEl.style.display = 'none';
  }

  if (searchEl) {
    searchEl.addEventListener('input', function () {
      var q = (searchEl.value || '').trim().toLowerCase();
      if (!q) {
        setSearchMode(false);
        render();
        return;
      }
      setSearchMode(true);
      getAllChars().then(function (list) {
        var filtered = list.filter(function (c) {
          if (c.gender === 'men') return false;
          var hay = [c.name || '', c.age != null ? String(c.age) : '', c.about || '', c.description || '', c.personality || '', c.gender || '', c.art_style || '', c.message_style || ''].join(' ').toLowerCase();
          return hay.indexOf(q) !== -1;
        });
        renderSearchResults(filtered);
      });
    });
  }

  // Load only the characters this user has actually talked to (via the backend
  // conversations API, which includes each conversation's last message).
  var sessionPromise = supabase.auth.getSession().then(function (res) { return res.data.session || null; }).catch(function () { return null; });

  void (async function () {
    var session = await sessionPromise;
    if (!session) { render(); return; }
    try {
      var resp = await window.YoursAPI.request('/conversations?userId=' + encodeURIComponent(session.user.id));
      allConversations = resp.conversations || [];

      var balEl = document.getElementById('chat-coin-balance');
      try {
        var walletRes = await window.YoursAPI.getWallet(session.user.id);
        if (walletRes && walletRes.wallet && walletRes.wallet.credits != null && balEl) {
          balEl.textContent = Math.floor(Number(walletRes.wallet.credits)).toLocaleString();
        }
      } catch (e) {
        console.warn('load wallet balance failed', e);
      }

      var ids = allConversations.map(function (c) { return c.character_id; }).filter(Boolean);
      if (ids.length) {
        var { data: charisma } = await supabase
          .from('user_charisma')
          .select('character_id, level')
          .eq('user_id', session.user.id)
          .in('character_id', ids);
        var byId = {};
        (charisma || []).forEach(function (row) { byId[row.character_id] = row.level; });
        allConversations.forEach(function (conv) {
          if (conv.character && byId[conv.character_id] > 0) conv.character.charisma = [{ level: byId[conv.character_id] }];
        });
      }
    } catch (e) {
      console.warn('load chats failed', e);
    }
    render();
  })();
})();
</script>
<script src="js/animations.js"></script>
</body></html>
