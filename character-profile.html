<script>
  (function () {
    // ---- Profile tabs: switch between Media and About content in place ----
    var mediaBtn = document.getElementById('tab-media-btn');
    var aboutBtn = document.getElementById('tab-about-btn');
    var mediaPanel = document.getElementById('tab-media');
    var aboutPanel = document.getElementById('tab-about');
    if (!mediaBtn || !aboutBtn || !mediaPanel || !aboutPanel) return;

    function selectTab(tab) {
      var isMedia = tab === 'media';
      function setActive(btn, active) {
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('font-semibold', active);
        btn.classList.toggle('border-b-2', active);
        btn.classList.toggle('border-[#ff7e5f]', active);
        btn.classList.toggle('text-gray-500', !active);
        btn.classList.toggle('font-medium', !active);
      }
      setActive(mediaBtn, isMedia);
      setActive(aboutBtn, !isMedia);
      aboutBtn.classList.toggle('hover:text-gray-300', !isMedia);
      mediaPanel.style.display = isMedia ? '' : 'none';
      aboutPanel.style.display = isMedia ? 'none' : '';
    }

    mediaBtn.addEventListener('click', function () { selectTab('media'); });
    aboutBtn.addEventListener('click', function () { selectTab('about'); });

    // Deep-link support: character-profile.html#about opens on the About tab
    // (settings pages link back here with the hash).
    if (window.location.hash === '#about') selectTab('about');

    // ---- Public / Private media toggles ----
    var publicBtn = document.getElementById('media-public-btn');
    var privateBtn = document.getElementById('media-private-btn');
    var mediaGrid = document.getElementById('media-grid');
    var privatePanel = document.getElementById('media-private');
    if (publicBtn && privateBtn && mediaGrid && privatePanel) {
      function selectMediaView(view) {
        var isPrivate = view === 'private';
        publicBtn.className = isPrivate
          ? 'flex-1 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 text-gray-400 font-medium text-sm flex items-center justify-center space-x-2 hover:text-white transition-colors'
          : 'flex-1 py-2 font-medium text-sm flex items-center justify-center space-x-2 shadow-sm border bg-white text-black border-white rounded-full';
        privateBtn.className = isPrivate
          ? 'flex-1 py-2 font-medium text-sm flex items-center justify-center space-x-2 shadow-sm border bg-white text-black border-white rounded-full'
          : 'flex-1 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 text-gray-400 font-medium text-sm flex items-center justify-center space-x-2 hover:text-white transition-colors';
        mediaGrid.style.display = isPrivate ? 'none' : '';
        privatePanel.style.display = isPrivate ? '' : 'none';
      }
      publicBtn.addEventListener('click', function () { selectMediaView('public'); });
      privateBtn.addEventListener('click', function () { selectMediaView('private'); });
    }

    // ---- Gifts: user-specific gifts sent to THIS character ----
    // Rendered from sessionStorage (set when the user sends a gift in chat).
    // Left empty (yours_gifts_...) → "+ Start gifting" empty state.
    var giftsTrack = document.getElementById('gifts-track');

    // Fallback gift image used behind the "+ Start gifting" tile.
    var DEFAULT_GIFT_BG = 'https://ik.imagekit.io/0a4t1zpln/6.761073908251913.png';

    function startGiftingTile(bg) {
      var src = bg || DEFAULT_GIFT_BG;
      return '<button class="flex flex-col items-center justify-center w-20 shrink-0 cursor-pointer" type="button" aria-label="Start gifting" onclick="window.location.href=\'messaging.html\'">' +
        '<div class="w-16 h-16 rounded-2xl border border-dashed border-white/20 relative overflow-hidden flex items-center justify-center">' +
        '<img class="absolute inset-0 w-full h-full object-cover blur-md scale-125 opacity-60 pointer-events-none" alt="" src="' + src + '">' +
        '<div class="absolute inset-0 bg-black/40 pointer-events-none"></div>' +
        '<span class="material-symbols-outlined text-white relative z-10 leading-none">add</span>' +
        '</div>' +
        '<span class="text-xs text-gray-400 text-center leading-tight mt-2">Start gifting</span>' +
        '</button>';
    }

    function tileHtml(g) {
      var img = g && g.img ? g.img : '';
      var name = g && g.name ? g.name : '';
      return '<div class="flex flex-col items-center gap-2 w-20 shrink-0">' +
        (img
          ? '<div class="w-16 h-16 rounded-2xl bg-surface-container border border-white/10 flex items-center justify-center p-1">' +
            '<img class="w-full h-full object-contain drop-shadow-lg" src="' + img + '" alt="' + name.replace(/"/g, '&quot;') + '">' +
            '</div>'
          : '<div class="w-16 h-16 rounded-2xl bg-surface-container border border-white/10 flex items-center justify-center">' +
            '<span class="material-symbols-outlined text-gray-400">redeem</span>' +
            '</div>') +
        '<span class="text-xs text-gray-400 text-center leading-tight max-w-[80px] truncate">' + name + '</span>' +
        '</div>';
    }

    function renderEmptyGifts() {
      if (!giftsTrack) return;
      giftsTrack.style.width = '';
      giftsTrack.style.animation = '';
      giftsTrack.innerHTML = startGiftingTile();
    }

    function renderUserGifts(gifts) {
      if (!giftsTrack) return;
      giftsTrack.style.width = '';
      giftsTrack.style.animation = '';
      if (!gifts || !gifts.length) {
        renderEmptyGifts();
        return;
      }
      var html = '';
      for (var i = 0; i < gifts.length; i++) html += tileHtml(gifts[i]);
      // "Start gifting" tile always follows so users can add more gifts.
      // It reuses the first gift image as a blurred background.
      html += startGiftingTile(gifts[0] && gifts[0].img);
      giftsTrack.innerHTML = html;
    }

    window.renderGifts = renderUserGifts;

    // Initial pass: whatever is already known for the current user/character.
    try {
      var gKey = 'yours_gifts_' + (window.__user_id__ || 'guest') + '_' + (window.__char_id__ || 'unknown');
      var gSaved = sessionStorage.getItem(gKey);
      if (gSaved) renderUserGifts(JSON.parse(gSaved));
      else if (sessionStorage.getItem('yours_gifts_key')) {
        var gGeneric = JSON.parse(sessionStorage.getItem(sessionStorage.getItem('yours_gifts_key')) || 'null');
        renderUserGifts(gGeneric);
      } else {
        renderEmptyGifts();
      }
    } catch (e) {
      renderEmptyGifts();
    }
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    // Same project config as auth.html / feed.html
    var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var heroImg = document.getElementById('hero-img');
    var thumbImg = document.getElementById('thumb-img');
    var nameEl = document.getElementById('profile-name');
    var bioEl = document.getElementById('profile-bio');
    var ageEl = document.getElementById('profile-identity-age');
    var headerAgeEl = document.getElementById('profile-age');
    var genderEl = document.getElementById('profile-identity-gender');
    var voiceEl = document.getElementById('profile-voice');
    var mediaGrid = document.getElementById('media-grid');
    var addMediaBtn = document.getElementById('add-media-btn');

    function humanize(k) {
      var map = {
        the_sweetheart: 'Sweetheart', the_tease: 'Tease',
        the_dominant: 'Dominant', the_submissive: 'Submissive',
        the_mysterious: 'Mysterious', men: 'Man', women: 'Woman',
        non_binary: 'Non-binary', everyone: 'Everyone',
        realistic: 'Realistic', anime: 'Anime'
      };
      if (k == null) return '';
      var s = String(k).toLowerCase().replace(/_/g, ' ');
      return map[String(k).toLowerCase()] || s.replace(/(^|\s)\w/g, function (m) { return m.toUpperCase(); });
    }

    function escAttr(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderMedia(items) {
      if (!mediaGrid || !items || !items.length) return;
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var m = items[i];
        var url = escAttr(m.media_url || '');
        var alt = escAttr(nameEl ? nameEl.textContent : '');
        if (m.media_type === 'video') {
          html += '<div class="rounded-2xl overflow-hidden aspect-[1/1.4] bg-surface-container"><video class="w-full h-full object-cover" src="' + url + '" muted loop playsinline></video></div>';
        } else {
          html += '<div class="rounded-2xl overflow-hidden aspect-[1/1.4] bg-surface-container"><img class="w-full h-full object-cover" src="' + url + '" alt="' + alt + ' media"></div>';
        }
      }
      var add = addMediaBtn ? addMediaBtn.outerHTML : '';
      mediaGrid.innerHTML = (add ? add : '') + html;
    }

    function apply(c) {
      if (!c) return;
      var name = c.name || 'Unknown';
      if (nameEl && nameEl.firstChild) nameEl.firstChild.textContent = (c.name ? c.name : 'Unknown') + ', ';
      if (headerAgeEl) headerAgeEl.textContent = c.age != null ? c.age : '';
      document.title = (c.name || 'Character') + "'s Profile";
      if (bioEl) bioEl.textContent = c.about || 'No bio yet.';
      if (ageEl) ageEl.textContent = c.age != null ? (c.age < 35 ? 'Young' : 'Mature') : '';
      if (genderEl) genderEl.textContent = humanize(c.gender);
      // Prefer the voice the user applied from the Voices settings page.
      var savedChar = null;
      try { savedChar = JSON.parse(sessionStorage.getItem('yours_char_settings') || 'null'); } catch (e) { savedChar = null; }
      if (voiceEl) voiceEl.textContent = (savedChar && savedChar.voice) || humanize(c.art_style) || 'Default';
      var heroUrl = heroImg && (c.character_feeds && c.character_feeds.length ? c.character_feeds[0].media_url : c.circular_profile_image_url);
      if (heroImg && heroUrl && heroUrl.indexOf('undefined') === -1) heroImg.src = heroUrl;
      // The "Add Media" tile reuses the character's feed image, blurred.
      var addMediaBg = document.getElementById('add-media-bg');
      if (addMediaBg && heroUrl && heroUrl.indexOf('undefined') === -1) addMediaBg.src = heroUrl;
      if (thumbImg && c.circular_profile_image_url) thumbImg.src = c.circular_profile_image_url;
      renderMedia(c.character_feeds);
    }

    var stored = null;
    try { stored = JSON.parse(sessionStorage.getItem('yours_current_character') || 'null'); } catch (e) { stored = null; }

    // Resolve the signed-in user so the Gifts row can show THIS user's gifts.
    function resolveUser() {
      return supabase.auth.getUser().then(function (res) {
        var u = res.data && res.data.user;
        window.__user_id__ = u && u.id ? u.id : 'guest';
      }).catch(function () {
        window.__user_id__ = 'guest';
      });
    }

    // Load + render the current user's gifts for the current character.
    function loadGifts() {
      if (typeof window.renderGifts !== 'function') return;
      var cId = window.__char_id__ || null;
      var uid = window.__user_id__ || 'guest';

      // Local fallback: gifts recorded in this browser session.
      function localGifts() {
        try {
          var key = 'yours_gifts_' + uid + '_' + (cId || 'unknown');
          var list = JSON.parse(sessionStorage.getItem(key) || 'null');
          return list && Array.isArray(list) ? list : null;
        } catch (e) { return null; }
      }

      if (uid && uid !== 'guest' && window.YoursAPI) {
        window.YoursAPI.getGifts(uid, cId).then(function (res) {
          var gifts = (res && res.gifts) || [];
          // Map DB rows to the tile shape used by the renderer.
          var mapped = gifts.map(function (g) {
            return { name: g.gift_name, img: g.gift_image };
          });
          // Merge with the session-local fallback so gifts sent while the
          // DB write failed still show up; dedupe by name+image.
          var local = (localGifts() || []).slice().reverse();
          var seen = {};
          var merged = [];
          local.concat(mapped).forEach(function (g) {
            var k = (g.name || '') + '|' + (g.img || '');
            if (!seen[k]) { seen[k] = true; merged.push(g); }
          });
          window.renderGifts(merged);
        }).catch(function () {
          window.renderGifts(localGifts());
        });
      } else {
        window.renderGifts(localGifts());
      }
    }

    resolveUser().then(function () {
      function useFullCharacter(id, fallback) {
        // Refetch the full row: sessionStorage snapshots saved by the chat /
        // call pages are partial ({id,name,avatar}) and miss bio/age/gender.
        supabase
          .from('characters')
          .select('id,name,age,about,gender,personality,art_style,voice_id,circular_profile_image_url,character_feeds(media_url,media_type)')
          .eq('id', id)
          .maybeSingle()
          .then(function (res) {
            var c = res && res.data;
            if (c) {
              window.__char_id__ = c.id || null;
              apply(Object.assign({}, fallback || {}, c));
            } else if (fallback) {
              apply(fallback);
            }
            loadGifts();
          })
          .catch(function () {
            if (fallback) apply(fallback);
            loadGifts();
          });
      }

      if (stored && stored.id) {
        window.__char_id__ = stored.id || null;
        var complete = stored.about != null && stored.age != null && stored.gender != null;
        if (complete) {
          apply(stored);
          loadGifts();
        } else {
          useFullCharacter(stored.id, stored);
        }
      } else {
        supabase
          .from('characters')
          .select('id,name,age,about,gender,personality,art_style,voice_id,circular_profile_image_url,character_feeds(media_url,media_type)')
          .eq('is_active', true)
          .order('created_at', { ascending: true })
          .limit(1)
          .then(function (res) {
            if (res.data && res.data[0]) {
              window.__char_id__ = res.data[0].id || null;
              apply(res.data[0]);
            }
            loadGifts();
          })
          .catch(function () { loadGifts(); });
      }
    });
  })();
</script>
