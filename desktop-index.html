<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover AI companions on Yours — browse characters by vibe, style and popularity, and find the one made for you.">
<title>Discover AI Companions | Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
<link rel="stylesheet" href="css/desktop.css">
<style>
  /* ---------- Discover toolbar ---------- */
  .disc-head { margin-bottom: 26px; }
  .disc-head h2 {
    margin: 0 0 6px;
    font-size: clamp(26px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  .disc-head p { margin: 0; font-size: 14px; color: var(--ds-muted); }

  .search-wrap { position: relative; max-width: 460px; margin-top: 18px; }
  .search-wrap i {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--ds-muted); pointer-events: none;
  }
  .search-input {
    width: 100%; height: 42px;
    padding: 0 16px 0 40px;
    border-radius: 999px;
    border: 1px solid var(--ds-line);
    background: var(--ds-surface);
    color: var(--ds-text); font-family: inherit; font-size: 14px;
    outline: none;
    transition: border-color .15s ease;
  }
  .search-input:focus { border-color: rgba(255, 77, 109, 0.55); }

  .tabs-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 20px 0 26px;
  }
  .tab {
    height: 36px; padding: 0 18px;
    border: 1px solid var(--ds-line); border-radius: 999px;
    background: transparent;
    color: var(--ds-muted); font-size: 13px; font-weight: 700;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .tab:hover { color: var(--ds-text); border-color: rgba(255, 255, 255, 0.2); }
  .tab.is-active { background: var(--ds-gradient); border-color: transparent; color: #fff; }

  .result-note { margin: 0 0 14px; font-size: 13px; color: var(--ds-muted); }

  .skeleton-card { aspect-ratio: 3/4; border-radius: var(--ds-radius); background: linear-gradient(100deg, var(--ds-surface) 40%, var(--ds-surface-2) 50%, var(--ds-surface) 60%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border: 1px solid var(--ds-line); }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body class="ds-page" data-active-nav="explore" data-topbar-title="Discover">

<div class="ds-layout">
  <div id="ds-sidebar"></div>

  <div class="ds-content-col">
    <div id="ds-topbar"></div>

    <main class="ds-main">
      <!-- ============ HEADER ============ -->
      <div class="disc-head">
        <h2>Find your person</h2>
        <p>Browse companions by vibe and style &mdash; someone is waiting to meet you.</p>
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input class="search-input" id="discover-search" type="search" placeholder="Search for a companion&hellip;" autocomplete="off">
        </div>
      </div>

      <!-- ============ TABS ============ -->
      <nav class="tabs-row" role="tablist" aria-label="Discover categories" id="discover-tabs">
        <button class="tab is-active" role="tab" aria-selected="true" data-tab="foryou">For you</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="popular">Popular</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="realistic">Realistic</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="anime">Anime</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="new">New</button>
      </nav>

      <p class="result-note" id="result-note"></p>

      <!-- ============ GRID ============ -->
      <section aria-label="Companions">
        <div class="ds-grid" id="discover-grid" style="display:none;"></div>
        <div class="ds-grid" id="discover-skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <div class="ds-empty" id="discover-empty" style="display:none;">
          <i class="fa-solid fa-heart-crack" aria-hidden="true" style="font-size:34px;color:var(--ds-muted);margin-bottom:16px;"></i>
          <p>No companions match that search &mdash; try another vibe.</p>
        </div>
      </section>
    </main>

    <footer id="ds-footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api-client.js"></script>
<script src="js/desktop-ui.js"></script>
<script>
(function () {
  'use strict';

  var characters = [];
  var activeTab = 'foryou';
  var query = '';
  var grid = document.getElementById('discover-grid');
  var skeleton = document.getElementById('discover-skeleton');
  var emptyState = document.getElementById('discover-empty');
  var note = document.getElementById('result-note');

  function cardHTML(c) {
    var img = YoursDesktop.cardImage(c) || '';
    var about = (c.about || '').slice(0, 46) + ((c.about || '').length > 46 ? '\u2026' : '');
    return (
      '<article class="ds-card">' +
        '<div class="ds-card-media">' +
          '<span class="ds-card-chip">' + (c.art_style || '') + '</span>' +
          '<img loading="lazy" alt="' + c.name + '" src="' + img + '" data-profile="' + c.id + '">' +
        '</div>' +
        '<div class="ds-card-row">' +
          '<div class="ds-card-name">' + c.name + ', ' + (c.age || '?') + '<small>' + about + '</small></div>' +
          '<button class="ds-card-open" data-chat="' + c.id + '"><i class="fa-solid fa-comment"></i>Chat</button>' +
        '</div>' +
      '</article>'
    );
  }

  function ordered(list, mode) {
    var arr = list.slice();
    if (mode === 'popular') {
      var shift = Math.floor(Date.now() / 3600000) % Math.max(arr.length, 1);
      arr = arr.slice(shift).concat(arr.slice(0, shift));
    } else if (mode === 'new') {
      arr.reverse();
    } else if (mode === 'foryou') {
      // Stable pseudo-shuffle so "For you" feels personal but consistent.
      arr.sort(function (a, b) {
        var ha = (a.id || '').split('').reduce(function (s, ch) { return s + ch.charCodeAt(0); }, 0);
        var hb = (b.id || '').split('').reduce(function (s, ch) { return s + ch.charCodeAt(0); }, 0);
        return ha - hb;
      });
    }
    return arr;
  }

  function render() {
    var list = characters.filter(function (c) {
      if (activeTab === 'realistic' && c.art_style !== 'realistic') return false;
      if (activeTab === 'anime' && c.art_style !== 'anime') return false;
      if (query && ((c.name || '') + ' ' + (c.about || '')).toLowerCase().indexOf(query) === -1) return false;
      return true;
    });
    list = ordered(list, activeTab);

    skeleton.style.display = 'none';
    if (!list.length) {
      grid.style.display = 'none';
      grid.innerHTML = '';
      emptyState.style.display = 'flex';
      note.textContent = '';
      return;
    }
    emptyState.style.display = 'none';
    grid.style.display = 'grid';
    note.textContent = list.length + ' companion' + (list.length > 1 ? 's' : '');
    grid.innerHTML = list.map(cardHTML).join('');
  }

  document.getElementById('discover-tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn) return;
    activeTab = btn.getAttribute('data-tab');
    document.querySelectorAll('#discover-tabs .tab').forEach(function (t) {
      var active = t === btn;
      t.classList.toggle('is-active', active);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    render();
  });

  document.getElementById('discover-search').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  grid.addEventListener('click', function (e) {
    var chatBtn = e.target.closest('[data-chat]');
    if (chatBtn) {
      var c = characters.filter(function (x) { return x.id === chatBtn.getAttribute('data-chat'); })[0];
      if (c) YoursDesktop.openChat(c);
      return;
    }
    var profileEl = e.target.closest('[data-profile]');
    if (profileEl) {
      var pc = characters.filter(function (x) { return x.id === profileEl.getAttribute('data-profile'); })[0];
      if (pc) {
        try { sessionStorage.setItem('yours_current_character', JSON.stringify(pc)); } catch (err) {}
        window.location.href = 'character-profile.html';
      }
    }
  });

  YoursDesktop.loadCharacters()
    .then(function (chars) {
      characters = chars;
      render();
    })
    .catch(function () {
      skeleton.style.display = 'none';
      emptyState.style.display = 'flex';
    });
})();
</script>
</body>
</html>
