<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yours</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png" rel="icon" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #1d1020 0%, #0c0c10 55%, #08080a 100%);
    color: #f4f4f6;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    padding: 38px 44px; border-radius: 28px;
    background: rgba(20,20,26,.92); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    max-width: min(86vw, 420px); text-align: center;
    animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .qr-frame {
    padding: 14px; background: #fff; border-radius: 20px;
    box-shadow: 0 12px 34px rgba(0,0,0,.45);
  }
  .qr-frame img { display: block; width: 220px; height: 220px; object-fit: contain; }
  .text { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.5; }
</style>
</head>
<body>
  <main class="card" role="dialog" aria-label="Continue on your smartphone">
    <div class="qr-frame"><img alt="Yours QR code" src="Assets/qrcode.png"></div>
    <p class="text">Enjoy the full experience of the all in your smart phone</p>
  </main>
</body></html>
