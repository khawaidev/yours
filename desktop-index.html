<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yours</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png" rel="icon" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    color: #17171b;
    overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 2vw; padding: 0 3vw;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: min(30vw, 400px); max-height: 92vh;
    object-fit: contain; flex-shrink: 0;
    user-select: none; pointer-events: none;
    animation: slide-in .55s ease both;
  }
  .phone-left  { animation-name: slide-in-left; }
  .phone-right { animation-name: slide-in-right; }
  @keyframes slide-in-left  { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  @keyframes slide-in-right { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  .center {
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    text-align: center; animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .qr-frame {
    padding: 14px; background: #fff; border-radius: 20px;
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 12px 34px rgba(0,0,0,.12);
  }
  .qr-frame img { display: block; width: 220px; height: 220px; object-fit: contain; }
  .text { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.5; color: #17171b; }
</style>
</head>
<body>
  <img class="phone phone-left" src="Assets/left.png" alt="Yours app preview">
  <main class="center" role="dialog" aria-label="Continue on your smartphone">
    <div class="qr-frame"><img alt="Yours QR code" src="Assets/qrcode.png"></div>
    <p class="text">Enjoy the full experience of the app in your smart phone</p>
  </main>
  <img class="phone phone-right" src="Assets/right.png" alt="Yours app preview">
</body></html>
