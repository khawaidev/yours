<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      // Fetch dynamic pricing from backend
      const res = await YoursAPI.getPricingForCountry();
      if (res && res.pricing) {
        const p = res.pricing;
        const btn = document.getElementById('subscribe-price-btn');
        const footer = document.getElementById('subscribe-price-footer');
        if (btn) btn.textContent = `Subscribe for ${p.currency_symbol}${p.premium_price}/month (${p.currency})`;
        if (footer) footer.textContent = `Plus Plan starting at ${p.currency_symbol}${p.plus_price}/month`;
      }
    } catch (e) {
      console.log('Dynamic pricing fallback active');
    }
  });
</script>
