<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Rotate the two background images every 2s (crossfade).
    var bgA = document.getElementById('premium-bg-a');
    var bgB = document.getElementById('premium-bg-b');
    var showB = false;
    if (bgA && bgB) {
      setInterval(function () {
        showB = !showB;
        bgA.style.opacity = showB ? '0' : '0.8';
        bgB.style.opacity = showB ? '0.8' : '0';
      }, 2000);
    }

    var USER_ID = null;
    try {
      var cu = YoursAPI.getCurrentUser();
      if (cu) USER_ID = cu.id;
    } catch (e) {}

    // Detect the user's real location (IP-based, falls back to locale).
    var country = 'US';
    try { country = await YoursAPI.detectLocation(); } catch (e) {
      try { country = YoursAPI.detectCountry(); } catch (e2) {}
    }
    var isIndia = country === 'IN';

    function showToast(msg) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:.8rem 1.2rem;border-radius:9999px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 4000);
    }

    function goPrev() {
      var pp = null;
      try { pp = sessionStorage.getItem('yours_prev_page'); } catch (e) {}
      if (pp) { try { sessionStorage.removeItem('yours_prev_page'); } catch (e2) {} window.location.href = pp; }
      else if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = 'index.html'; }
    }

    // Render the plan prices from the DB-backed regional pricing object.
    function renderPrices(p) {
      if (!p) return;
      var btn = document.getElementById('subscribe-price-btn');
      if (btn) btn.textContent = 'Subscribe for ' + p.currency_symbol + p.premium_price + '/month';

      var annual = p.premium_annual_price || Math.round(p.premium_price * 12);
      var monthlyEquiv = p.premium_annual_monthly_price != null
        ? Number(p.premium_annual_monthly_price)
        : Math.round(annual / 12 * 100) / 100;

      var annualText = Number.isInteger(annual) ? String(annual) : String(Math.round(annual * 100) / 100);
      var monthlyText = Number.isInteger(monthlyEquiv) ? String(monthlyEquiv) : String(Math.round(monthlyEquiv * 100) / 100);
      var priceSpan = document.getElementById('subscribe-price-annual-btn');
      if (priceSpan) priceSpan.textContent = p.currency_symbol + monthlyText + '/month, billed ' + p.currency_symbol + annualText + '/yr';
      var subSpan = document.getElementById('subscribe-price-annual-sub');
      if (subSpan) subSpan.textContent = '';

      var savePct = p.premium_save_percent != null ? Number(p.premium_save_percent) : Math.round((1 - annual / (p.premium_price * 12)) * 1000) / 10;
      var freeMonths = p.premium_free_months != null ? Number(p.premium_free_months) : 1;
      var footer = document.getElementById('subscribe-price-footer');
      if (footer) footer.textContent = 'Save ' + savePct + '% + ' + freeMonths + (freeMonths === 1 ? ' month' : ' months') + ' free';
    }

    // Direct Razorpay checkout for the premium plans. Before opening the
    // payment sheet we re-fetch pricing with `fresh=1` (bypasses the backend
    // cache) so the shown/charged price is the current DB price.
    function purchase(itemId) {
      itemId = itemId || 'premium_monthly';
      if (!USER_ID) { showToast('Please sign in to subscribe to Premium.'); return; }
      var btnId = itemId === 'premium_annual' ? 'premium-subscribe-annual-btn' : 'premium-subscribe-btn';
      var btn = document.getElementById(btnId);
      btn.disabled = true;
      var originalText = btn.textContent;
      btn.textContent = '...';
      YoursAPI.getCountryPricing(country, true)
        .then(function (fresh) {
          renderPrices(fresh);
          return YoursAPI.createPaymentOrder(USER_ID, itemId, country);
        })
        .then(function (res) {
          btn.textContent = originalText;
          var order = res.order;
          if (typeof Razorpay === 'undefined') throw new Error('Razorpay SDK failed to load');
          var options = {
            key: order.keyId,
            amount: order.amountInSmallestUnit,
            currency: order.currency,
            name: 'Yours AI',
            image: 'https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png',
            description: order.description,
            order_id: order.orderId,
            method: isIndia ? 'upi' : 'card',
            prefill: { email: '' },
            handler: function (payResp) {
              YoursAPI.verifyPayment(USER_ID, {
                orderId: payResp.razorpay_order_id,
                paymentId: payResp.razorpay_payment_id,
                signature: payResp.razorpay_signature,
                itemId: itemId
              }).then(function () {
                showToast('Premium activated! Enjoy unlimited access. ✨');
                setTimeout(goPrev, 1500);
              }).catch(function (err) {
                showToast('Verification failed: ' + (err.message || 'error'));
              });
            }
          };
          var rzp = new Razorpay(options);
          rzp.on('payment.failed', function () { showToast('Payment failed. Please try again.'); });
          rzp.open();
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = originalText;
          showToast('Could not start checkout: ' + (err.message || 'error'));
        });
    }

    var subscribeBtn = document.getElementById('premium-subscribe-btn');
    if (subscribeBtn) subscribeBtn.addEventListener('click', function () { purchase('premium_monthly'); });
    var annualBtn = document.getElementById('premium-subscribe-annual-btn');
    if (annualBtn) annualBtn.addEventListener('click', function () { purchase('premium_annual'); });

    try {
      // Fetch dynamic pricing for the detected region (DB-backed, cached).
      const p = await YoursAPI.getCountryPricing(country);
      if (p) {
        renderPrices(p);
        var savePct = p.premium_save_percent != null ? Number(p.premium_save_percent) : 33.3;
        var freeMonths = p.premium_free_months != null ? Number(p.premium_free_months) : 1;
        var badgeEl = document.getElementById('annual-badge');
        if (badgeEl) badgeEl.textContent = savePct + '% OFF + ' + freeMonths + (freeMonths === 1 ? ' month' : ' months') + ' free';
      }
    } catch (e) {
      console.log('Dynamic pricing fallback active');
    }
  });
</script>
