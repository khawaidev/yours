<script>
  (function () {
    // Where Google OAuth / magic links come back to. auth.html consumes the
    // session, then either creates the account with the onboarding answers or
    // (existing account) discards them and logs straight in.
    // NOTE: this exact URL must be whitelisted in Supabase → Authentication → URL Configuration → Redirect URLs.
    var REDIRECT_PAGE = 'auth.html';

    // From backend/.env — the anon key is safe to ship to browsers (RLS protects the data).
    var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';

    var supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      supabase = null;
    }

    // Only ever bootstrap once (getSession + SIGNED_IN can both fire on load).
    var signedInHandled = false;

    function goToApp() {
      window.location.replace('index.html');
    }

    function redirectHome() {
      goToApp();
    }

    // Route a signed-in user: a brand-new account is created with the
    // onboarding answers collected before sign-up; an existing account
    // (same email / Google account) is a plain login — its onboarding
    // answers are discarded.
    function finishNewAccount(userId) {
      var applied = window.YSOnboarding
        ? window.YSOnboarding.applyToAccount(userId)
        : Promise.resolve(false);
      return applied.then(function () {
        if (window.YSOnboarding) window.YSOnboarding.clear();
        goToApp();
      });
    }

    function handleSignedIn() {
      if (signedInHandled) return;
      signedInHandled = true;
      if (!(supabase && window.YoursAPI)) { redirectHome(); return; }
      supabase.auth.getSession().then(function (res) {
        var u = res.data && res.data.session && res.data.session.user;
        if (!u) { signedInHandled = false; redirectHome(); return; }
        var meta = u.user_metadata || {};
        var answers = window.YSOnboarding ? window.YSOnboarding.all() : {};
        var hasAnswers = window.YSOnboarding ? window.YSOnboarding.hasAnswers() : false;

        YoursAPI.bootstrapProfile({
          userId: u.id,
          email: u.email || meta.email || '',
          // Prefer the name typed during onboarding over the Google profile name.
          displayName: answers.name || meta.full_name || meta.name || '',
          avatarUrl: meta.avatar_url || meta.picture || null,
          declaredAge: answers.age || undefined,
        }).then(function (r) {
          if (r && r.created) {
            if (!hasAnswers) {
              // Signed up without going through onboarding — run it now.
              window.location.replace('Age.html');
              return;
            }
            // Brand-new account: save the onboarding answers onto it.
            return finishNewAccount(u.id);
          }

          // Existing account (same email / Google account).
          var profile = (r && r.profile) || {};
          var state = profile.onboarding_state;
          var neverFinished = !state || (state !== 'completed' && state !== 'done');
          if (hasAnswers && neverFinished) {
            // This account never finished onboarding, so keep the answers.
            return finishNewAccount(u.id);
          }
          // Normal login: the onboarding answers are discarded.
          if (window.YSOnboarding) window.YSOnboarding.clear();
          goToApp();
        }).catch(function () {
          signedInHandled = false;
          redirectHome();
        });
      }).catch(function () {
        signedInHandled = false;
        redirectHome();
      });
    }

    // Restore an existing session (returning from Google OAuth or a magic link).
    if (supabase) {
      supabase.auth.getSession().then(function (res) {
        if (res.data.session) handleSignedIn();
      });
      supabase.auth.onAuthStateChange(function (event) {
        if (event === 'SIGNED_IN') handleSignedIn();
      });
    }

    // ---- Skeleton → staggered content reveal ----
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var skeleton = document.getElementById('skeleton-screen');
        if (skeleton) {
          skeleton.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(function () { skeleton.remove(); }, 600);
        }
        document.querySelectorAll('.reveal').forEach(function (el) {
          el.classList.add('in');
        });
      }, 1100);
    });

    // ---- UI helpers ----
    function showError(msg) {
      var el = document.getElementById('auth-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function clearError() {
      document.getElementById('auth-error').classList.add('hidden');
    }
    function setLoading(btn, label, text) {
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-wait', 'pointer-events-none');
      if (!btn.querySelector('.spinner')) {
        var sp = document.createElement('span');
        sp.className = 'spinner';
        btn.prepend(sp);
      }
      label.textContent = text;
    }
    function unsetLoading(btn, label, text) {
      btn.disabled = false;
      btn.classList.remove('opacity-70', 'cursor-wait', 'pointer-events-none');
      var sp = btn.querySelector('.spinner');
      if (sp) sp.remove();
      label.textContent = text;
    }
    function animateIn(el) {
      el.classList.remove('slide-in');
      void el.offsetWidth; // restart the animation
      el.classList.add('slide-in');
    }

    // ---- Continue with Google ----
    window.handleGoogle = async function () {
      clearError();
      if (!supabase) {
        showError('Authentication is not configured yet. Check your connection and try again.');
        return;
      }
      var btn = document.getElementById('google-btn');
      var label = document.getElementById('google-label');
      setLoading(btn, label, 'Redirecting…');
      var res = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: new URL(REDIRECT_PAGE, window.location.href).href },
      });
      if (res.error) {
        unsetLoading(btn, label, 'Continue with Google');
        showError(res.error.message);
      }
    };

    // ---- Continue with Email (email + password) ----
    window.showEmailForm = function () {
      clearError();
      document.getElementById('auth-methods').classList.add('hidden');
      var form = document.getElementById('email-form');
      form.classList.remove('hidden');
      animateIn(form);
      document.getElementById('email-input').focus();
    };
    window.backToMethods = function () {
      clearError();
      document.getElementById('email-form').classList.add('hidden');
      var methods = document.getElementById('auth-methods');
      methods.classList.remove('hidden');
      animateIn(methods);
    };

    // Bottom toast shown after the confirmation email is sent. It disappears
    // after 3 seconds and leaves the email + password fields untouched so the
    // visitor can tap Continue again once they have confirmed.
    var confirmToastTimer = null;
    function showConfirmToast(email) {
      var toast = document.getElementById('confirm-toast');
      if (!toast) return;
      var emailEl = document.getElementById('confirm-toast-email');
      if (emailEl) emailEl.textContent = email || '';
      toast.style.opacity = '1';
      toast.style.transform = 'translate(-50%, 0)';
      clearTimeout(confirmToastTimer);
      confirmToastTimer = setTimeout(function () {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 1.5rem)';
      }, 3000);
    }

    // An address Supabase already knows: sign in with the password instead of
    // creating a duplicate. Wrong password surfaces a helpful message.
    async function signInExisting(email, password, btn, label) {
      var res = await supabase.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        unsetLoading(btn, label, 'Continue');
        if (/invalid login credentials/i.test(res.error.message)) {
          showError('That email already has an account. Check your password, or continue with Google.');
        } else {
          showError(res.error.message);
        }
        return;
      }
      // Existing account → handleSignedIn() decides whether to keep or
      // discard the onboarding answers, then enters the app.
      handleSignedIn();
    }

    window.handleEmailSubmit = async function (e) {
      e.preventDefault();
      clearError();
      if (!supabase) {
        showError('Authentication is not configured yet. Check your connection and try again.');
        return;
      }

      var email = document.getElementById('email-input').value.trim();
      var password = document.getElementById('password-input').value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        showError('Your password must be at least 6 characters.');
        return;
      }

      var btn = document.getElementById('email-submit');
      var label = document.getElementById('email-submit-label');
      setLoading(btn, label, 'Please wait…');

      var answers = window.YSOnboarding ? window.YSOnboarding.all() : {};

      var res = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          // The confirmation link lands back on this page. If it opens in
          // another tab it signs in there; this tab can then simply tap
          // Continue again (same email + password) to log in.
          emailRedirectTo: new URL(REDIRECT_PAGE, window.location.href).href,
          data: {
            display_name: answers.name || '',
            declared_age: answers.age || null,
          },
        },
      });

      // Supabase hides "already registered" by returning a user with no
      // identities when email confirmation is enabled. Try a password login.
      var existing = !!(res.data && res.data.user &&
        Array.isArray(res.data.user.identities) && res.data.user.identities.length === 0);

      if (res.error) {
        if (/already registered|already been registered/i.test(res.error.message)) {
          await signInExisting(email, password, btn, label);
          return;
        }
        unsetLoading(btn, label, 'Continue');
        showError(res.error.message);
        return;
      }

      if (existing) {
        await signInExisting(email, password, btn, label);
        return;
      }

      // Email confirmation disabled → Supabase returns a live session now.
      if (res.data && res.data.session) {
        handleSignedIn();
        return;
      }

      // Confirmation email sent: confirm in-place so the fields stay filled and
      // the visitor can return to this same screen after clicking the link.
      showConfirmToast(email);
      unsetLoading(btn, label, 'Continue');
    };
  })();
</script>
