<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Create Your Companion - General | Yours</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000006a2c81fa833aa9f0571bfffc.png">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body class="ds-page" data-active-nav="create" data-topbar-title="Create">

<div class="ds-layout">
  <div id="ds-sidebar"></div>

  <div class="ds-content-col">
    <div id="ds-topbar"></div>

    <main class="ds-main">
      <!-- ================= CREATE STAGE 2 / HAIR & EYES (matches desktop-create-stage2.html) ================= -->
      <section class="cc-wrap" aria-label="Hair and eye preferences">
        <div class="cc-progress" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100" aria-label="Creation progress">
          <div class="cc-progress-fill" style="width: 33.33%"></div>
        </div>

        <h1 class="cc-title">Define Her <span class="brand-word">Look</span></h1>

        <div class="cc-group">
          <p class="cc-group-title">HAIR STYLE</p>
          <div class="hair-grid" role="radiogroup" aria-label="Hair Style" data-group="hair_style">
            <button type="button" class="hair-card" data-value="Braided" aria-label="Braided"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Braided</span></button>
            <button type="button" class="hair-card" data-value="Long" aria-label="Long"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Long</span></button>
            <button type="button" class="hair-card" data-value="Bangs" aria-label="Bangs"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Bangs</span></button>
            <button type="button" class="hair-card" data-value="Ponytail" aria-label="Ponytail"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Ponytail</span></button>
            <button type="button" class="hair-card" data-value="Short" aria-label="Short"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Short</span></button>
            <button type="button" class="hair-card" data-value="Bun" aria-label="Bun"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Bun</span></button>
            <button type="button" class="hair-card" data-value="Buns" aria-label="Buns"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Buns</span></button>
            <button type="button" class="hair-card" data-value="Wavy" aria-label="Wavy"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Wavy</span></button>
            <button type="button" class="hair-card" data-value="Pixie" aria-label="Pixie"><i class="fa-solid fa-heart hair-icon" aria-hidden="true"></i><span class="hair-label">Pixie</span></button>
            <button type="button" class="hair-card" data-value="Custom" aria-label="Custom"><i class="fa-solid fa-wand-magic-sparkles hair-icon" aria-hidden="true"></i><span class="hair-label">Custom</span></button>
          </div>
        </div>

        <div class="cc-group">
          <p class="cc-group-title">EYE COLOR</p>
          <div class="color-grid" role="radiogroup" aria-label="Eye Color" data-group="eye_color">
            <button type="button" class="color-option" data-value="Black" aria-label="Black"><span class="color-swatch" style="background:#0a0a0a"></span><span>Black</span></button>
            <button type="button" class="color-option" data-value="Brown" aria-label="Brown"><span class="color-swatch" style="background:#6b3a1f"></span><span>Brown</span></button>
            <button type="button" class="color-option" data-value="Red" aria-label="Red"><span class="color-swatch" style="background:#c0392b"></span><span>Red</span></button>
            <button type="button" class="color-option" data-value="Gold" aria-label="Gold"><span class="color-swatch" style="background:#d4a017"></span><span>Gold</span></button>
            <button type="button" class="color-option" data-value="Green" aria-label="Green"><span class="color-swatch" style="background:#27ae60"></span><span>Green</span></button>
            <button type="button" class="color-option" data-value="Blue" aria-label="Blue"><span class="color-swatch" style="background:#2980b9"></span><span>Blue</span></button>
            <button type="button" class="color-option" data-value="Purple" aria-label="Purple"><span class="color-swatch" style="background:#8e44ad"></span><span>Purple</span></button>
            <button type="button" class="color-option" data-value="Pink" aria-label="Pink"><span class="color-swatch" style="background:#ff6b9d"></span><span>Pink</span></button>
            <button type="button" class="color-option" data-value="White" aria-label="White"><span class="color-swatch" style="background:#f5f5f7"></span><span>White</span></button>
            <button type="button" class="color-option" data-value="Silver" aria-label="Silver"><span class="color-swatch" style="background:#bdc3c7"></span><span>Silver</span></button>
          </div>
        </div>

        <div class="cc-group">
          <p class="cc-group-title">HAIR COLOR</p>
          <div class="color-grid" role="radiogroup" aria-label="Hair Color" data-group="hair_color">
            <button type="button" class="color-option" data-value="Black" aria-label="Black"><span class="color-swatch" style="background:#0a0a0a"></span><span>Black</span></button>
            <button type="button" class="color-option" data-value="Brunette" aria-label="Brunette"><span class="color-swatch" style="background:#4b2e1a"></span><span>Brunette</span></button>
            <button type="button" class="color-option" data-value="Red" aria-label="Red"><span class="color-swatch" style="background:#8b2500"></span><span>Red</span></button>
            <button type="button" class="color-option" data-value="Blonde" aria-label="Blonde"><span class="color-swatch" style="background:#e8d5a3"></span><span>Blonde</span></button>
            <button type="button" class="color-option" data-value="Green" aria-label="Green"><span class="color-swatch" style="background:#1e8449"></span><span>Green</span></button>
            <button type="button" class="color-option" data-value="Blue" aria-label="Blue"><span class="color-swatch" style="background:#2e86c1"></span><span>Blue</span></button>
            <button type="button" class="color-option" data-value="Purple" aria-label="Purple"><span class="color-swatch" style="background:#7d3c98"></span><span>Purple</span></button>
            <button type="button" class="color-option" data-value="Pink" aria-label="Pink"><span class="color-swatch" style="background:#ff8fab"></span><span>Pink</span></button>
            <button type="button" class="color-option" data-value="White" aria-label="White"><span class="color-swatch" style="background:#f5f5f7"></span><span>White</span></button>
            <button type="button" class="color-option" data-value="Silver" aria-label="Silver"><span class="color-swatch" style="background:#d5d8dc"></span><span>Silver</span></button>
          </div>
        </div>

        <div class="cc-nav">
          <a class="cc-back" href="desktop-create.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back</a>
          <button type="button" class="cc-continue" id="continue-btn">Continue<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
        </div>
      </section>
    </main>

    <footer id="ds-footer"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api-client.js"></script>
<script src="js/desktop-ui.js"></script>
<script src="js/create-funnel.js"></script>
<script>
(function () {
  'use strict';

  YoursCreate.bindChipGroups();

  document.getElementById('continue-btn').addEventListener('click', function () {
    YoursCreate.save(YoursCreate.collectGroups());
    var user = window.YoursAPI ? YoursAPI.getCurrentUser() : null;
    try { if (user && YoursAPI.trackEvent) YoursAPI.trackEvent('desktop_create_stage2', YoursCreate.prefs(), user.id); } catch (e) {}
    window.location.href = 'desktop-create-stage3.html';
  });
})();
</script>
