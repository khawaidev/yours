<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors ml-4">

<!-- Script for interactive highlighting logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[type="radio"][name="personality"]');
            
            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all labels
                    document.querySelectorAll('label').forEach(label => {
                        label.className = 'relative flex items-center p-gutter rounded-xl glass-panel cursor-pointer hover:bg-surface-container transition-all duration-300 group';
                        
                        // Remove active background element if it exists
                        const activeBg = label.querySelector('.absolute.inset-0.bg-gradient-to-r');
                        if (activeBg) activeBg.remove();
                        
                        // Reset emoji container
                        const emojiContainer = label.querySelector('.flex.items-center.justify-center.w-12.h-12');
                        emojiContainer.className = 'flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high text-2xl mr-gutter group-hover:scale-110 transition-transform duration-300';
                    });

                    // Style the checked label
                    if (e.target.checked) {
                        const activeLabel = e.target.closest('label');
                        activeLabel.className = 'relative flex items-center p-gutter rounded-xl glass-card-active cursor-pointer transition-all duration-300 group';
                        
                        // Add active background element
                        const activeBg = document.createElement('div');
                        activeBg.className = 'absolute inset-0 bg-gradient-to-r from-primary/5 to-transparent rounded-xl opacity-100 pointer-events-none';
                        activeLabel.insertBefore(activeBg, activeLabel.firstChild.nextSibling);
                        
                        // Style active emoji container
                        const activeEmoji = activeLabel.querySelector('.flex.items-center.justify-center.w-12.h-12');
                        activeEmoji.className = 'flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-highest text-2xl mr-gutter scale-110 relative z-10 shadow-[0_0_15px_rgba(255,180,163,0.2)]';
                    }
                });
            });
        });
    </script>
