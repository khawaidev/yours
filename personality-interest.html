<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="description" content="Pick the personality you vibe with — shape your ideal AI companion on Yours.">
    <meta name="robots" content="noindex, nofollow">
<title>What personality do you vibe with?</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/onboarding.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      background-color: #131313;
      color: #fff;
      overflow-x: hidden;
    }
    /* Clear the pinned footer. */
    .ys-ob-main { padding-bottom: 132px; }
    /* This step has five stacked options — keep the whole list visible. */
    .ys-ob-title { margin-bottom: 24px; }

    .ys-pers-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: rgba(32, 31, 31, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      text-align: left;
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .ys-pers-card:active { transform: scale(0.99); }
    .ys-pers-card.is-selected {
      background: rgba(53, 53, 52, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 20px rgba(255, 180, 163, 0.1);
    }
    .ys-pers-emoji {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      background: #2a2a2a;
      font-size: 24px;
      line-height: 1;
      transition: background 0.25s ease, transform 0.25s ease;
    }
    .ys-pers-card.is-selected .ys-pers-emoji {
      background: #3d3d3c;
      transform: scale(1.06);
    }
    .ys-pers-title {
      display: block;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: #f0dedb;
      margin-bottom: 2px;
    }
    .ys-pers-desc {
      display: block;
      font-size: 14px;
      line-height: 18px;
      color: #fff;
      opacity: 0.9;
    }
    .ys-pers-tick {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: #000;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .ys-pers-tick svg { width: 14px; height: 14px; opacity: 0; transition: opacity 0.2s ease; }
    .ys-pers-card.is-selected .ys-pers-tick {
      background: #fff;
      border-color: #fff;
    }
    .ys-pers-card.is-selected .ys-pers-tick svg { opacity: 1; }
  </style>
</head>
<body class="ys-ob-page app-page">
<!-- BEGIN: Top Navigation & Progress -->
<header class="ys-ob-header">
<button aria-label="Go back" class="ys-ob-back" onclick="window.location.href='explore-interest.html'" type="button">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 19l-7-7 7-7"></path></svg>
</button>
<!-- Progress Bar (identical on every onboarding step) -->
<div class="ys-ob-progress"><span data-ob-progress></span></div>
<div class="ys-ob-spacer" aria-hidden="true"></div>
</header>
<!-- END: Top Navigation & Progress -->
<!-- BEGIN: Main Content Area -->
<main class="ys-ob-main">
<!-- Header Section -->
<div class="ys-ob-title">
<h1>What personality do you vibe with?</h1>
<p>Each character has a unique personality</p>
</div>
<!-- Options List -->
<div class="flex flex-col gap-3 px-6" id="personality-list">
<label class="ys-pers-card" data-value="sweetheart">
<input class="sr-only" name="personality" type="radio" value="sweetheart">
<span class="ys-pers-emoji">🥰</span>
<span class="flex-1">
<span class="ys-pers-title">The Sweetheart</span>
<span class="ys-pers-desc">Caring, romantic, wants to make you smile</span>
</span>
<span class="ys-pers-tick"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"></path></svg></span>
</label>
<label class="ys-pers-card" data-value="tease">
<input class="sr-only" name="personality" type="radio" value="tease">
<span class="ys-pers-emoji">😏</span>
<span class="flex-1">
<span class="ys-pers-title">The Tease</span>
<span class="ys-pers-desc">Playful, flirty, keeps you guessing</span>
</span>
<span class="ys-pers-tick"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"></path></svg></span>
</label>
<label class="ys-pers-card" data-value="dominant">
<input class="sr-only" name="personality" type="radio" value="dominant">
<span class="ys-pers-emoji">👑</span>
<span class="flex-1">
<span class="ys-pers-title">The Dominant</span>
<span class="ys-pers-desc">Takes control, knows what she wants</span>
</span>
<span class="ys-pers-tick"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"></path></svg></span>
</label>
<label class="ys-pers-card" data-value="submissive">
<input class="sr-only" name="personality" type="radio" value="submissive">
<span class="ys-pers-emoji">🥺</span>
<span class="flex-1">
<span class="ys-pers-title">The Submissive</span>
<span class="ys-pers-desc">Eager to please, follows your lead</span>
</span>
<span class="ys-pers-tick"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"></path></svg></span>
</label>
<label class="ys-pers-card" data-value="mysterious">
<input class="sr-only" name="personality" type="radio" value="mysterious">
<span class="ys-pers-emoji">🌙</span>
<span class="flex-1">
<span class="ys-pers-title">The Mysterious</span>
<span class="ys-pers-desc">Deep, intense, full of secrets</span>
</span>
<span class="ys-pers-tick"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17l-5-5"></path></svg></span>
</label>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Action (pinned) -->
<footer class="ys-ob-footer is-fixed">
<button class="ys-ob-btn" id="continue-btn" disabled type="button">
    Continue
  </button>
<p class="ys-ob-hint" id="continue-hint">Pick one to continue</p>
</footer>
<!-- END: Footer Action -->
<script src="js/onboarding.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = Array.prototype.slice.call(document.querySelectorAll('.ys-pers-card'));
    const continueBtn = document.getElementById('continue-btn');
    const hint = document.getElementById('continue-hint');

    const selectedValue = () => {
      const card = cards.filter((c) => c.classList.contains('is-selected'))[0];
      return card ? card.getAttribute('data-value') : null;
    };

    const sync = () => {
      const value = selectedValue();
      continueBtn.disabled = !value;
      hint.textContent = value ? '' : 'Pick one to continue';
      if (value) YSOnboarding.set('personality', value);
    };

    // Restore a previous choice (back/forward navigation).
    const saved = YSOnboarding.get('personality');
    cards.forEach((card) => {
      const input = card.querySelector('input');
      if (saved && card.getAttribute('data-value') === saved) {
        card.classList.add('is-selected');
        input.checked = true;
      }
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.classList.remove('is-selected');
          c.querySelector('input').checked = false;
        });
        card.classList.add('is-selected');
        input.checked = true;
        sync();
      });
    });

    sync();

    continueBtn.addEventListener('click', () => {
      if (continueBtn.disabled) return;
      YSOnboarding.set('personality', selectedValue());
      window.location.href = 'analyse.html';
    });
  });
</script>
<script src="js/animations.js"></script>
</body></html>
