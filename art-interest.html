<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="description" content="Pick the art styles you love so your AI companion matches your taste.">
    <meta name="robots" content="noindex, nofollow">
<title>What's your style?</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/onboarding.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-styles">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #131313;
      color: #fff;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="ys-ob-page app-page">
<!-- BEGIN: Top Navigation & Progress -->
<header class="ys-ob-header" data-purpose="top-navigation">
<!-- Back Button -->
<button aria-label="Go back" class="ys-ob-back" onclick="window.location.href='age-interest.html'" type="button">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7"></path>
</svg>
</button>
<!-- Progress Bar (identical on every onboarding step) -->
<div class="ys-ob-progress"><span data-ob-progress></span></div>
<div class="ys-ob-spacer" aria-hidden="true"></div>
</header>
<!-- END: Top Navigation & Progress -->
<!-- BEGIN: Main Content Area -->
<main class="ys-ob-main" data-purpose="main-content">
<!-- Header Text -->
<div class="ys-ob-title" data-purpose="header-text">
<h1>What's your style?</h1>
</div>
<!-- Swipe Carousel -->
<div class="ys-ob-carousel" data-purpose="style-carousel" id="carousel">
<!-- Realistic Option Card -->
<button aria-label="Select Realistic style" class="ys-ob-card is-active" data-value="realistic" type="button">
<img alt="Realistic style preview" src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/download%20(4).jpg">
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">Realistic</span>
</button>
<!-- Anime Option Card -->
<button aria-label="Select Anime style" class="ys-ob-card is-inactive" data-value="anime" type="button">
<img alt="Anime style preview" src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2012_56_47%20AM.png">
<div class="ys-ob-card-overlay"></div>
<span class="ys-ob-card-label">Anime</span>
</button>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Action -->
<footer class="ys-ob-footer">
<button class="ys-ob-btn" id="continue-btn" type="button">
    Continue
  </button>
</footer>
<!-- END: Footer Action -->
<script src="js/onboarding.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const carousel = YSOnboarding.bindCarousel({ root: '#carousel', key: 'artStyle' });

    // Restore a previous choice (back/forward navigation).
    const saved = YSOnboarding.get('artStyle');
    if (saved && carousel) carousel.select(saved);

    document.getElementById('continue-btn').addEventListener('click', () => {
      const active = document.querySelector('.ys-ob-card.is-active');
      if (active) YSOnboarding.set('artStyle', active.getAttribute('data-value'));
      window.location.href = 'eye-interest.html';
    });
  });
</script>
<script src="js/animations.js"></script>
</body></html>
