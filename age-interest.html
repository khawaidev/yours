<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style data-purpose="custom-config">

            'primary-container': '#ff5c35',
            'on-primary-container': '#ffffff',
            secondary: '#e7bdb4',
            'on-secondary': '#442a24',
            'secondary-container': '#5d3f38',
            'on-secondary-container': '#ffdad3',
            tertiary: '#d7c57f',
            'on-tertiary': '#393000',
            'tertiary-container': '#514600',
            'on-tertiary-container': '#f4e098',
            error: '#ffb4ab',
            'on-error': '#690005',
            'error-container': '#93000a',
            'on-error-container': '#ffdad6',
            'on-surface': '#f0dedb',
            'on-surface-variant': '#d8c2be',
            outline: '#a08c88',
            'outline-variant': '#534340',
            'inverse-surface': '#f0dedb',

          },

<style data-purpose="custom-styles">
    body {
      background-color: #131313;
      color: #ffffff;
      overflow-x: hidden;
    }
    
    .gradient-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 40%);
    }

    /* Hide scrollbar for cleaner look */
    ::-webkit-scrollbar {
      display: none;
    }

    .carousel-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-left: 7.5vw;
      padding-right: 7.5vw;
      gap: 4vw;
      width: 100%;
    }

    .carousel-item {
      flex: 0 0 85vw;
      height: 60vh;
      scroll-snap-align: center;
      transition: filter 0.3s ease, transform 0.3s ease;
      position: relative;
    }

    .carousel-item:not(.active) {
      filter: blur(4px) brightness(0.7);
      transform: scale(0.95);
    }
    
    .carousel-item.active {
      filter: blur(0) brightness(1);
      transform: scale(1);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans selection:bg-primary selection:text-on-primary">
<!-- BEGIN: Top Navigation & Progress -->
<header class="w-full sticky top-0 z-20 bg-surface" data-purpose="top-navigation">
<!-- Progress Bar (full-width, same style as other onboarding pages) -->
<div class="w-full h-1 bg-surface-container-highest overflow-hidden">
<div id="progress-fill" class="h-full bg-primary-container rounded-full w-[35%] transition-all duration-500"></div>
</div>
<div class="w-full flex items-center gap-3 px-6 pt-4 pb-3">
<!-- Back Button -->
<button onclick="window.location.href='Gender-interest.html'" aria-label="Go back" class="text-white hover:text-primary transition-colors p-2 -ml-2 rounded-full cursor-pointer shrink-0">
<span class="material-symbols-outlined text-[28px] font-bold">arrow_back_ios_new</span>
</button>
<!-- Title & Subtitle inline with the back arrow -->
<div class="min-w-0" data-purpose="page-headers">
<h1 class="text-[28px] leading-tight font-extrabold text-white tracking-tight">What age do you prefer?</h1>
<p class="text-[15px] font-medium text-white mt-1">Choose one option</p>
</div>
</div>
</header>
<!-- END: Top Navigation & Progress -->
<!-- BEGIN: Main Content Area -->
<main class="flex-grow flex flex-col items-center pt-6 pb-6 w-full relative" data-purpose="main-content">
<!-- Carousel -->
<div class="carousel-container" id="carousel">
<!-- Option 1: Young -->
<div aria-label="Select Young preference" class="carousel-item rounded-3xl overflow-hidden shadow-2xl relative group cursor-pointer active" data-index="0">
<img alt="Young Woman" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%208%2C%202026%2C%2012_42_32%20AM.png">
<div class="absolute inset-0 gradient-overlay pointer-events-none"></div>

<div class="absolute bottom-8 w-full text-center px-4 pointer-events-none">
<h2 class="text-white text-3xl font-bold tracking-wide drop-shadow-md">Young</h2>
</div>
</div>
<!-- Option 2: Mature -->
<div aria-label="Select Mature preference" class="carousel-item rounded-3xl overflow-hidden shadow-2xl relative group cursor-pointer" data-index="1">
<img alt="Mature Woman" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/ChatGPT%20Image%20Aug%207%2C%202026%2C%2002_52_19%20AM.png">
<div class="absolute inset-0 gradient-overlay pointer-events-none"></div>

<div class="absolute bottom-8 w-full text-center px-4 pointer-events-none">
<h2 class="text-white text-3xl font-bold tracking-wide drop-shadow-md">Mature</h2>
</div>
</div>
</div>
<div class="w-full mt-auto pt-8 px-6 pb-4">
<button onclick="window.location.href='art-interest.html'" class="w-full bg-white text-black font-bold py-4 rounded-full text-[18px] active:scale-[0.98] transition-transform shadow-lg cursor-pointer">
    Continue
  </button>
</div>
</main>
<!-- END: Main Content Area -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const carousel = document.getElementById('carousel');
    const items = document.querySelectorAll('.carousel-item');
    
    // Function to update active class based on scroll position
    const updateActiveItem = () => {
      let minDiff = Infinity;
      let activeIndex = 0;
      const carouselCenter = carousel.scrollLeft + carousel.clientWidth / 2;

      items.forEach((item, index) => {
        const itemCenter = item.offsetLeft + item.clientWidth / 2;
        const diff = Math.abs(carouselCenter - itemCenter);
        if (diff < minDiff) {
          minDiff = diff;
          activeIndex = index;
        }
      });

      items.forEach((item, index) => {
        if (index === activeIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      // Functional progress bar: fill advances with the active card
      const progressFill = document.getElementById('progress-fill');
      if (progressFill) {
        progressFill.style.width = (35 + activeIndex * 35) + '%';
      }
    };

    carousel.addEventListener('scroll', updateActiveItem);
    
    // Allow clicking to snap a card into view
    items.forEach(item => {
      item.addEventListener('click', () => {
        const scrollTarget = item.offsetLeft - (carousel.clientWidth - item.clientWidth) / 2;
        carousel.scrollTo({
          left: scrollTarget,
          behavior: 'smooth'
        });
      });
    });

    // Initial check
    updateActiveItem();
  });
</script>


<script src="js/animations.js"></script>
</body></html>
