<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Personality Settings</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000003704823093c6cccb8ba71cd1.png" rel="icon" type="image/png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #131313; color: white; }
  .btn-chip { padding:10px 18px; border-radius:9999px; background:#201f1f; border:1px solid #3a3a3a; color:#d1d1d1; font-size:14px; font-weight:500; transition:all .15s ease; cursor:pointer; }
  .btn-chip.selected { background:#ff7e5f; border-color:#ff7e5f; color:#fff; }
  .apply-enabled { background:#ff7e5f !important; opacity:1 !important; pointer-events:auto !important; }
</style>
</head>
<body class="antialiased app-page">
<main class="min-h-screen flex flex-col pb-16">
<div class="px-6 pt-6 flex items-center justify-between relative">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition-colors cursor-pointer" onclick="window.location.href = 'character-profile.html#about';">
<i class="fa-solid fa-chevron-left text-lg"></i>
</button>
<h1 class="text-xl font-bold absolute left-1/2 -translate-x-1/2">Personality</h1>
<div class="w-10"></div>
</div>
<div class="px-6 mt-8 flex flex-col gap-8">
<section>
<h2 class="text-base font-bold mb-4">Traits</h2>
<div class="flex flex-wrap gap-3">
<button class="btn-chip" type="button" onclick="toggleChip(this)">Sexy</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Stubborn</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Sarcastic</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Sweet</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Rude</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Forward</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Edgy</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Traditional</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Dramatic</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Bossy</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Easy</button>
</div>
</section>
<section>
<h2 class="text-base font-bold mb-4">Interest</h2>
<div class="flex flex-wrap gap-3">
<button class="btn-chip" type="button" onclick="toggleChip(this)">Reading</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Movies</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Sports</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Hiking</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Music</button>
<button class="btn-chip" type="button" onclick="toggleChip(this)">Video Games</button>
</div>
</section>
</div>
</main>
<div class="fixed bottom-0 inset-x-0 px-6 pb-8 pt-4 bg-gradient-to-t from-[#131313] via-[#131313] to-transparent">
<button id="apply-btn" class="w-full py-4 rounded-full bg-gray-800 text-white font-bold text-lg shadow-lg pointer-events-none opacity-60 cursor-not-allowed" disabled type="button" onclick="applySettings()">Apply</button>
</div>
<script>
var chips = document.querySelectorAll('.btn-chip');
var applyBtn = document.getElementById('apply-btn');
var savedTraits = null;
try {
  var cs = JSON.parse(sessionStorage.getItem('yours_char_settings') || '{}');
  if (cs && cs.personalityTraits) savedTraits = { traits: cs.personalityTraits.traits || [], interests: cs.personalityTraits.interests || [] };
} catch (e) {}

function sectionName(chip) {
  var section = chip.closest('section');
  return (section && section.querySelector('h2') || {}).textContent || '';
}
function isDefault() {
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].classList.contains('selected')) return false;
  }
  return true;
}
function refreshApply() {
  var changed = !isDefault();
  if (changed) {
    applyBtn.disabled = false;
    applyBtn.classList.add('apply-enabled');
    applyBtn.classList.remove('cursor-not-allowed');
  } else {
    applyBtn.disabled = true;
    applyBtn.classList.remove('apply-enabled');
    applyBtn.classList.add('cursor-not-allowed');
  }
}
function toggleChip(btn) { btn.classList.toggle('selected'); refreshApply(); }
function applySettings() {
  window.YoursPlanGate.apply(function () {
    var traits = [], interests = [];
    for (var i = 0; i < chips.length; i++) {
      if (!chips[i].classList.contains('selected')) continue;
      var name = chips[i].textContent.trim();
      if (sectionName(chips[i]) === 'Traits') traits.push(name);
      else interests.push(name);
    }
    var charSettings = {};
    try { charSettings = JSON.parse(sessionStorage.getItem('yours_char_settings') || '{}'); } catch (e) {}
    charSettings.personalityTraits = { traits: traits, interests: interests };
    try { sessionStorage.setItem('yours_char_settings', JSON.stringify(charSettings)); } catch (e) {}
    history.back();
  });
}
refreshApply();
</script>
<script src="js/api-client.js"></script>
<script src="js/plan-gate.js"></script>
</body></html>
