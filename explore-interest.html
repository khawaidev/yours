<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="description" content="Choose the topics you want to explore with your AI companion on Yours.">
    <meta name="robots" content="noindex, nofollow">
<title>What do you want to explore?</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/onboarding.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    .glass-pill {
      background: rgba(42, 42, 42, 0.4);
      border: 1px solid rgba(227, 190, 182, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .glass-pill.selected {
      background: rgba(255, 92, 53, 0.15);
      border: 1px solid #ff5c35;
      box-shadow: 0 0 16px rgba(255, 92, 53, 0.2);
    }
    body {
      background-color: #131313;
      color: #fff;
      overflow-x: hidden;
    }
    /* Clear the pinned footer. */
    .ys-ob-main { padding-bottom: 132px; }
  </style>
</head>
<body class="ys-ob-page app-page">
<!-- BEGIN: Top Navigation & Progress -->
<header class="ys-ob-header">
<button aria-label="Go back" class="ys-ob-back" onclick="window.location.href='eye-interest.html'" type="button">
<svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 19l-7-7 7-7"></path></svg>
</button>
<!-- Progress Bar (identical on every onboarding step) -->
<div class="ys-ob-progress" data-step="6"><span data-ob-progress></span></div>
<div class="ys-ob-spacer" aria-hidden="true"></div>
</header>
<!-- END: Top Navigation & Progress -->
<!-- BEGIN: Main Content Area -->
<main class="ys-ob-main">
<!-- Header Section -->
<div class="ys-ob-title">
<h1>What do you want to explore?</h1>
<p>Select all that interest you</p>
</div>
<!-- Tags Cloud -->
<div class="flex flex-wrap justify-center gap-3 px-6">
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="roleplay" type="button">
<span class="text-xl leading-none">🔥</span>
<span class="text-sm font-semibold text-white">Roleplay</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="age_gap" type="button">
<span class="text-xl leading-none">🌶️</span>
<span class="text-sm font-semibold text-white">Age gap</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="power_play" type="button">
<span class="text-xl leading-none">😏</span>
<span class="text-sm font-semibold text-white">Power play</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="dom_sub" type="button">
<span class="text-xl leading-none">🔒</span>
<span class="text-sm font-semibold text-white">Dom/sub</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="being_spoiled" type="button">
<span class="text-xl leading-none">🙌</span>
<span class="text-sm font-semibold text-white">Being spoiled</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="deep_connection" type="button">
<span class="text-xl leading-none">🔗</span>
<span class="text-sm font-semibold text-white">Deep connection</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="casual_fun" type="button">
<span class="text-xl leading-none">⚡</span>
<span class="text-sm font-semibold text-white">Casual fun</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="fantasy" type="button">
<span class="text-xl leading-none">🔥</span>
<span class="text-sm font-semibold text-white">Fantasy</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="romance" type="button">
<span class="text-xl leading-none">🌹</span>
<span class="text-sm font-semibold text-white">Romance</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="adventure" type="button">
<span class="text-xl leading-none">🗺️</span>
<span class="text-sm font-semibold text-white">Adventure</span>
</button>
<button class="glass-pill rounded-full px-5 py-3 flex items-center gap-2 active:scale-95" data-value="first_time" type="button">
<span class="text-xl leading-none">💝</span>
<span class="text-sm font-semibold text-white">First time</span>
</button>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Footer Action (pinned) -->
<footer class="ys-ob-footer is-fixed">
<button class="ys-ob-btn" id="continue-btn" disabled type="button">
    Continue
  </button>
<p class="ys-ob-hint" id="continue-hint">Pick at least one to continue</p>
</footer>
<!-- END: Footer Action -->
<script src="js/onboarding.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pills = Array.prototype.slice.call(document.querySelectorAll('.glass-pill'));
    const continueBtn = document.getElementById('continue-btn');
    const hint = document.getElementById('continue-hint');

    const selectedValues = () => pills
      .filter((p) => p.classList.contains('selected'))
      .map((p) => p.getAttribute('data-value'));

    const sync = () => {
      const values = selectedValues();
      const hasChoice = values.length > 0;
      continueBtn.disabled = !hasChoice;
      hint.textContent = hasChoice ? '' : 'Pick at least one to continue';
      YSOnboarding.set('interests', values);
    };

    // Restore previous choices (back/forward navigation).
    const saved = YSOnboarding.get('interests') || [];
    pills.forEach((pill) => {
      if (saved.indexOf(pill.getAttribute('data-value')) !== -1) pill.classList.add('selected');
      pill.addEventListener('click', () => {
        pill.classList.toggle('selected');
        sync();
      });
    });

    sync();

    continueBtn.addEventListener('click', () => {
      if (continueBtn.disabled) return;
      YSOnboarding.set('interests', selectedValues());
      window.location.href = 'personality-interest.html';
    });
  });
</script>
<script src="js/animations.js"></script>
</body></html>
