<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Blush Onboarding - Character Types</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="../css/app.css">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'blush-bg': '#121212',
            'blush-surface': '#1C1C1E',
            'blush-brand': '#FF5A40',
            'blush-border': '#333333',
            'blush-text-muted': '#A0A0A0'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Custom checkbox styling for the selection cards */
    .selection-card input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #555;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      background-color: transparent;
    }

    .selection-card input[type="checkbox"]:checked {
      background-color: white;
      border-color: white;
    }

    .selection-card input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #121212;
    }
    
    /* Active state for the whole card */
    .selection-card.active {
      border-color: white;
      background-color: rgba(255, 255, 255, 0.05);
    }
    
    /* Hide scrollbar for main content area to look more native */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-blush-bg text-white min-h-screen flex flex-col antialiased app-page">
<!-- BEGIN: NavigationBar -->
<!-- Top navigation with back button, progress bar, and close button -->
<header class="flex items-center justify-between px-4 pt-12 pb-4">
<!-- Back Button -->
<button aria-label="Go back" class="p-2 -ml-2 text-white focus:outline-none">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Progress Bar -->
<div class="flex-1 max-w-[200px] mx-4 h-1.5 bg-gray-700 rounded-full overflow-hidden flex">
<!-- Active Segment -->
<div class="h-full bg-blush-brand w-3/5 rounded-full relative z-10" style="box-shadow: 2px 0 0 #121212;"></div>
<!-- Inactive Segment -->
<div class="h-full bg-gray-700 w-2/5"></div>
</div>
<!-- Close Button -->
<button aria-label="Close" class="p-2 -mr-2 text-white focus:outline-none">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContent -->
<!-- Main content area containing header text and scrollable list of options -->
<main class="flex-1 overflow-y-auto no-scrollbar flex flex-col px-6 pt-4 pb-32">
<!-- Header Section -->
<section class="text-center mb-8" data-purpose="screen-header">
<h1 class="text-[32px] leading-[1.1] font-extrabold tracking-tight mb-3">
        What type of characters would you like to see in the app?
      </h1>
<p class="text-gray-300 text-sm font-medium">Pick as many as you like</p>
</section>
<!-- Options List Section -->
<section class="flex flex-col gap-3" data-purpose="options-list">
<!-- Option: Realistic -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Realistic</span>
<input name="character_type" type="checkbox" value="realistic">
</label>
<!-- Option: Anime -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Anime</span>
<input name="character_type" type="checkbox" value="anime">
</label>
<!-- Option: Game -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Game</span>
<input name="character_type" type="checkbox" value="game">
</label>
<!-- Option: Popular culture -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Popular culture</span>
<input name="character_type" type="checkbox" value="popular_culture">
</label>
<!-- Option: Fantasy -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Fantasy</span>
<input name="character_type" type="checkbox" value="fantasy">
</label>
<!-- Option: Furry -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Furry</span>
<input name="character_type" type="checkbox" value="furry">
</label>
<!-- Option: Kink -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200">
<span class="text-lg font-bold text-white tracking-wide">Kink</span>
<input name="character_type" type="checkbox" value="kink">
</label>
<!-- Option: Something else -->
<label class="selection-card flex items-center justify-between p-5 rounded-2xl border border-blush-border bg-[#1A1A1A] cursor-pointer transition-colors duration-200 mb-6">
<span class="text-lg font-bold text-white tracking-wide">Something else</span>
<input name="character_type" type="checkbox" value="something_else">
</label>
</section>
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomAction -->
<!-- Fixed bottom container for the continue button -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#121212] via-[#121212] to-transparent pt-12 pb-8 pointer-events-none">
<button class="w-full bg-white text-black font-extrabold text-[17px] py-4 rounded-[28px] focus:outline-none hover:bg-gray-100 active:scale-[0.98] transition-transform duration-150 pointer-events-auto">
      Continue
    </button>
</div>
<!-- END: BottomAction -->
<script data-purpose="interaction-logic">
    // Add visual feedback when a card is selected
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.selection-card');
      
      cards.forEach(card => {
        const checkbox = card.querySelector('input[type="checkbox"]');
        
        // Initial state check
        if (checkbox.checked) {
          card.classList.add('active');
        }
        
        // Listen for changes
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            card.classList.add('active');
          } else {
            card.classList.remove('active');
          }
        });
      });
    });
  </script>
<script src="../js/animations.js"></script>
</body></html>
