<body class="bg-background text-on-surface h-screen flex flex-col font-body-md overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Glow Background -->

<!-- Top Bar -->
<header class="relative z-10 w-full pt-gutter px-container-margin pb-stack-sm flex items-center justify-between">
<button aria-label="Close" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-high transition-colors hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]">close</span>
</button>
<div class="flex-1 px-container-margin">
<!-- Progress Bar -->
<div class="h-1 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full from-primary to-secondary w-1/5 rounded-full shadow-[0_0_12px_rgba(255,180,163,0.6)] bg-primary"></div>
</div>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-container-margin md:px-section-gap text-center max-w-2xl mx-auto w-full pb-section-gap">
<!-- 3D Logo / Hero Image Area -->
<div class="w-48 h-48 md:w-64 md:h-64 mb-stack-lg relative perspective-[1000px] animate-float">
<!-- Placeholder for a 3D glassmorphic logo -->

<!-- Abstract text logo backup if image fails -->
<div class="absolute inset-0 flex items-center justify-center bg-surface-container-lowest rounded-full border border-surface-variant/30 backdrop-blur-xl shadow-[0_0_40px_rgba(255,92,53,0.1)] -z-10 hidden">
<h1 class="text-headline-xl font-headline-xl tracking-tighter bg-gradient-to-r from-primary via-secondary to-tertiary bg-clip-text text-transparent italic">BLUSH</h1>
</div>
</div>
<!-- Typography -->
<div class="flex flex-col gap-stack-md animate-fade-in-up">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-balance">
                Give us feedback for a chance to win <span class="text-transparent bg-clip-text from-primary to-secondary text-primary">100</span></h1>
<p class="font-body-md text-body-md text-on-surface max-w-md mx-auto text-balance">
                Help us improve Blush with a quick 5-minute survey, and win 1 of 3 Amazon gift cards.
            </p>
</div>
</main>
<!-- Bottom Fixed Action Area -->
<div class="relative z-20 w-full p-container-margin md:pb-stack-lg pb-section-gap from-background via-background to-transparent flex justify-center">
<button class="w-full md:w-auto md:min-w-[320px] py-4 px-8 rounded-full from-primary-container to-secondary-container text-on-primary font-label-md text-label-md uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all duration-200 group flex items-center justify-center gap-2" style="background-color: white; color: black;">
            Start now
            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(5deg) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateX(10deg) rotateY(5deg); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
