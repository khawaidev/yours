<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">

<title>Edit profile - Yours</title>
<link href="https://pub-475cca0b7414418d866128a4b30dfd97.r2.dev/images/yours/file_000000003704823093c6cccb8ba71cd1.png" rel="icon" type="image/png">

<link rel="stylesheet" href="css/app.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style data-purpose="custom-fonts">

      font-family: 'Plus Jakarta Sans', sans-serif;

      color: #FFFFFF;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blush: {
              bg: '#121212',
              card: '#1E1E1E',
              text: '#FFFFFF',
              subtext: '#A0A0A0',
              accent: '#FF4D6D',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }

  </script>
<style>
    /* input.field beats the Tailwind forms-plugin base reset
       (input[type='...']) which would otherwise paint the fields white. */
    input.field,
    .field {
      width: 100%;
      background: #000000 !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 14px 20px;
      color: #fff !important;
      outline: none;
      font-size: 15px;
      transition: border-color 0.2s ease;
    }
    .field:focus {
      border-color: #fff;
    }
    .field::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .field::-webkit-inner-spin-button,
    .field::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #000000;
    }
    .btn-primary:disabled {
      background: rgba(255, 255, 255, 0.4);
      color: rgba(0, 0, 0, 0.5);
    }
    .row-btn {
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .row-btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body class="bg-blush-bg text-blush-text antialiased min-h-screen flex flex-col items-center pt-2 app-page">
<div class="w-full max-w-[400px] h-full flex flex-col px-4 pb-8">
<!-- BEGIN: Header -->
<header data-reveal class="flex items-center justify-between py-3 mb-4">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-blush-card transition-colors focus:outline-none" onclick="if (window.history.length > 1) window.history.back(); else window.location.href='settings.html';">
<svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold tracking-wide absolute left-1/2 -translate-x-1/2">Edit profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- END: Header -->
<!-- BEGIN: Avatar Preview -->
<section data-reveal class="flex flex-col items-center mb-8">
<div class="w-24 h-24 rounded-full bg-gray-700 flex items-center justify-center text-4xl mb-1" id="avatar-preview">🤪</div>
<p class="text-blush-subtext text-sm" id="email-hint">Signed in</p>
</section>
<!-- END: Avatar Preview -->
<!-- BEGIN: Form -->
<section data-reveal class="flex flex-col space-y-4">
<div>
<label class="text-blush-subtext text-xs font-semibold uppercase tracking-wider px-2 mb-2 block" for="display-name">Name</label>
<input class="field" id="display-name" maxlength="40" autocomplete="name" placeholder="Your display name" type="text">
</div>
<div>
<label class="text-blush-subtext text-xs font-semibold uppercase tracking-wider px-2 mb-2 block" for="declared-age">Age</label>
<input class="field" id="declared-age" min="18" max="120" inputmode="numeric" placeholder="18" type="number">
<p class="text-blush-subtext text-xs px-2 mt-2">Your age must be 18 or older.</p>
</div>
</section>
<!-- END: Form -->
<!-- BEGIN: Save Button -->
<section data-reveal class="mt-8">
<button class="w-full btn-primary text-black font-bold py-4 rounded-full row-btn focus:outline-none disabled:opacity-60" disabled id="save-btn" type="button">
Save changes
</button>
</section>
<!-- END: Save Button -->
</div>
<!-- BEGIN: Toast -->
<div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full text-white text-sm font-semibold transition-all duration-300 opacity-0 translate-y-[-10px]" id="toast" style="background:#FF4D6D;"></div>
<!-- END: Toast -->
<script>
(function () {
  var SUPABASE_URL = 'https://dgbxcakkqrgrapwsvrol.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYnhjYWtrcXJncmFwd3N2cm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTM0NDksImV4cCI6MjEwMTc2OTQ0OX0.v2gOgC28bfXXVjRVki1lL0ulgCHVloUAv1eF5HVSzuk';

  var user = null;
  try { user = YoursAPI.getCurrentUser(); } catch (e) { user = null; }

  var nameInput = document.getElementById('display-name');
  var ageInput = document.getElementById('declared-age');
  var saveBtn = document.getElementById('save-btn');
  var toast = document.getElementById('toast');
  var avatar = document.getElementById('avatar-preview');
  var emailHint = document.getElementById('email-hint');

  var loaded = { name: '', age: null };
  var saving = false;

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = '1';
    toast.style.transform = 'translateY(0)';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-10px)';
    }, 2200);
  }

  function refreshSave() {
    var changed = nameInput.value.trim() !== loaded.name ||
      (ageInput.value !== '' && String(loaded.age) !== String(parseInt(ageInput.value, 10)));
    saveBtn.disabled = saving || !changed;
  }

  function avatarColorFor(seed) {
    var palette = ['#FF5A36', '#BD0183', '#C5861C', '#3B82F6', '#10B981', '#8B5CF6', '#EC4899', '#14B8A6'];
    var h = 0;
    for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
  }

  function applyAvatar(name) {
    if (!avatar) return;
    avatar.textContent = (name || 'U').trim().charAt(0).toUpperCase();
    avatar.style.backgroundColor = avatarColorFor(name || 'U');
    avatar.style.color = '#fff';
  }

  nameInput.addEventListener('input', refreshSave);
  ageInput.addEventListener('input', refreshSave);

  if (!user || !user.id) {
    if (emailHint) emailHint.textContent = 'You are not signed in.';
    nameInput.disabled = true;
    ageInput.disabled = true;
    return;
  }

  if (emailHint) emailHint.textContent = user.email || 'Signed in';

  // Load the persisted profile (bootstrap is idempotent and returns the row).
  YoursAPI.bootstrapProfile({
    userId: user.id,
    email: user.email || '',
    displayName: user.displayName || '',
  }).then(function (res) {
    var p = res && res.profile;
    if (!p) return;
    loaded.name = p.display_name || user.displayName || '';
    loaded.age = p.declared_age != null ? p.declared_age : null;
    nameInput.value = loaded.name;
    if (loaded.age != null) ageInput.value = loaded.age;
    applyAvatar(loaded.name || (user.displayName || ''));
    refreshSave();
  }).catch(function () {
    applyAvatar(user.displayName || '');
  });

  saveBtn.addEventListener('click', function () {
    if (saveBtn.disabled || saving) return;

    var ageValue = ageInput.value === '' ? loaded.age : parseInt(ageInput.value, 10);
    if (ageValue != null && (isNaN(ageValue) || ageValue < 18 || ageValue > 120)) {
      showToast('Age must be 18 or older.');
      return;
    }

    saving = true;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    YoursAPI.updateProfile(user.id, {
      displayName: nameInput.value.trim().length ? nameInput.value.trim() : loaded.name,
      declaredAge: ageValue != null && ageValue !== '' ? ageValue : undefined,
    }).then(function () {
      loaded.name = nameInput.value.trim() || loaded.name;
      loaded.age = ageValue != null ? ageValue : loaded.age;
      applyAvatar(loaded.name);
      showToast('Profile updated');
      refreshSave();
    }).catch(function (err) {
      showToast(err && err.message ? err.message : 'Could not save changes.');
    }).finally(function () {
      saving = false;
      saveBtn.textContent = 'Save changes';
      refreshSave();
    });
  });
})();
</script>
<script src="js/animations.js"></script>
</body></html>
